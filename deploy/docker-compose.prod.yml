version: '3.9'
services:
  profitengine:
    image: profitengine:v5
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes:
      - pe5_data:/app/data
      - pe5_logs:/app/logs
    env_file: ../.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
volumes:
  pe5_data:
  pe5_logs:
