# Resource limits (cpus / mem_limit / pids_limit) are mandatory on every
# service: the OCI A1 host has a 30GB boot volume (~14 MB/s throughput cap),
# and one runaway container can pile the whole host into I/O-wait load >150,
# killing SSH and Caddy. Limits keep the host responsive no matter what a
# container does. Images are built in CI and shipped — never build on the box.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - runtime
      - backend
      - uptime-kuma

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 512
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      NEXT_PUBLIC_COMMAND_CENTER_URL: ${COMMAND_CENTER_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    expose:
      - "3000"
    depends_on:
      - runtime

  runtime:
    # The deploy workflow pulls ghcr.io/quantam101/profitenginev5-runtime:latest
    # on the OCI host and retags it to this local image name before running
    # `docker compose up -d --no-deps --no-build runtime`. Keep this image tag
    # aligned with .github/workflows/deploy.yml so compose never tries to rebuild
    # the runtime on the small OCI boot disk.
    image: profitenginev5-runtime:latest
    build:
      context: .
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 512
    env_file: .env
    expose:
      - "8080"
    volumes:
      - gmaos_data:/data
    command: ["uvicorn", "runtime.api:app", "--host", "0.0.0.0", "--port", "8080"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:2.19.5
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    expose:
      - "5678"
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_HOST: ${N8N_HOST:-n8n.${SITE_DOMAIN}}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-https://n8n.${SITE_DOMAIN}}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:?N8N_BASIC_AUTH_USER is required}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}
      TAYLOR_SERVER_URL: ${TAYLOR_SERVER_URL:-http://taylor:8001}
    volumes:
      - n8n_data:/home/node/.n8n

  # FastAPI backend — MongoDB Atlas, Stripe, distillation, referrals, waitlist.
  # Exposed at backend.alreadyherellc.com via Caddy (see caddy/Caddyfile).
  taylor:
    build:
      context: .
      dockerfile: Dockerfile.taylor
    restart: unless-stopped
    cpus: 1
    mem_limit: 768m
    pids_limit: 256
    env_file: .env
    environment:
      TAYLOR_HOST: 0.0.0.0
      TAYLOR_PORT: 8001
      TAYLOR_DB_PATH: ${TAYLOR_DB_PATH:-/data/taylor.db}
    expose:
      - "8001"
    volumes:
      - taylor_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: 1
    mem_limit: 768m
    pids_limit: 256
    env_file: .env
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    expose:
      - "3001"
    volumes:
      - uptime_data:/app/data

  # Local inference — runs on OCI A1 ARM (4 OCPUs / 24 GB RAM, CPU-only).
  # After first `docker compose up -d`, pull a model once:
  #   docker compose exec ollama ollama pull llama3.1:8b
  # Recommended models by use-case:
  #   llama3.1:8b  — best all-round (default)
  #   qwen2.5:7b   — SEO / multilingual content
  #   phi3.5:3.8b  — fastest for short structured tasks
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Profile "local-llm": not started on regular deploys (saves 10+ GB disk).
    # To start manually: docker compose --profile local-llm up -d ollama
    # Then pull a model: docker compose exec ollama ollama pull llama3.1:8b
    profiles:
      - local-llm
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  caddy_data:
  caddy_config:
  gmaos_data:
  postgres_data:
  n8n_data:
  taylor_data:
  uptime_data:
  ollama_data: