name: Pre-Market Paper Trading - 4 AM MST

on:
  schedule:
    # 4:00 AM MST = 11:00 AM UTC
    - cron: '0 11 * * 1-5'  # Monday-Friday at 4 AM MST
  workflow_dispatch:  # Allow manual trigger

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 660  # 10+ hours for full trading session

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx asyncio

      - name: Run pre-market trading session
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python deploy_premarket_4am.py

      - name: Upload trading results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: trading-results-${{ github.run_id }}
          path: |
            premarket_trading_4am.log
            premarket_trading_summary.json
          retention-days: 30

      - name: Post trading results
        if: always()
        run: |
          echo "=== Trading Session Complete ==="
          if [ -f premarket_trading_summary.json ]; then
            echo "Summary:"
            cat premarket_trading_summary.json
          fi
          if [ -f premarket_trading_4am.log ]; then
            echo "Last 50 lines of log:"
            tail -50 premarket_trading_4am.log
          fi
