name: Check Printify Shop & Etsy Connection Status
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Printify shops and Etsy connection
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
        run: |
          echo "## Printify Shop Status" >> $GITHUB_STEP_SUMMARY

          # List all shops
          SHOPS=$(curl -sf "https://api.printify.com/v1/shops.json" \
            -H "Authorization: Bearer $PRINTIFY_API_TOKEN" \
            -H "User-Agent: ProfitEngine/5.0")

          echo "$SHOPS" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if not isinstance(d, list):
              print('Error:', d)
              exit(1)
          print(f'Found {len(d)} shops:')
          etsy_connected = False
          for s in d:
              channel = s.get('sales_channel', '')
              print(f'  Shop {s[\"id\"]}: {s[\"title\"]} | channel: {channel}')
              if 'etsy' in channel.lower():
                  etsy_connected = True
          print()
          if etsy_connected:
              print('ETSY: Connected')
          else:
              print('ETSY: NOT connected — connect at https://printify.com/app/store/connect')
          "

          # Check if configured shop ID exists
          if [ -n "$PRINTIFY_SHOP_ID" ]; then
            echo "Configured PRINTIFY_SHOP_ID: $PRINTIFY_SHOP_ID"
            PRODUCTS=$(curl -sf "https://api.printify.com/v1/shops/$PRINTIFY_SHOP_ID/products.json?limit=3" \
              -H "Authorization: Bearer $PRINTIFY_API_TOKEN" \
              -H "User-Agent: ProfitEngine/5.0" | python3 -c \
              "import json,sys; d=json.load(sys.stdin); print(f'Products in shop: {d.get(\"total\",\"?\")}')") || true
            echo "$PRODUCTS"
          fi
