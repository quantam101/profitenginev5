name: Daily Trading Alert - 5 PM MST

on:
  schedule:
    # Run at 5 PM MST (12 AM UTC next day) every trading day
    - cron: '0 0 * * 1-5'  # Monday-Friday only
  workflow_dispatch:

jobs:
  send-daily-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest clients.db
        env:
          PROFITENGINE_DB_URL: ${{ secrets.PROFITENGINE_DB_URL }}
        run: |
          if [ ! -z "$PROFITENGINE_DB_URL" ]; then
            mkdir -p ./data
            curl -L "$PROFITENGINE_DB_URL" -o clients.db
            ls -lah clients.db
          fi

      - name: Generate and send daily alert
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'gmail' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION || 'us-east-1' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLIENTS_DB_PATH: './clients.db'
        run: |
          python runtime/daily_alerts.py

      - name: Save alert log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: daily-alert-logs
          path: daily_alerts.log
          retention-days: 30

      - name: Notify on success
        if: success()
        run: |
          echo "✓ Daily alert sent successfully at 5 PM MST"

      - name: Notify on failure
        if: failure()
        run: |
          echo "✗ Daily alert generation failed"
          exit 1
