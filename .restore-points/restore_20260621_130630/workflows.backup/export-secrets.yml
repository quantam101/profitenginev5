name: Export All Secrets to File

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Create secrets export
        run: |
          cat > secrets.env << 'EOF'
          SITE_DOMAIN=profitengine.alreadyherellc.com
          ACME_EMAIL=ops@alreadyherellc.com
          PUBLIC_SITE_URL=https://profitengine.alreadyherellc.com
          COMMAND_CENTER_URL=https://app.profitengine.alreadyherellc.com
          RUNTIME_API_URL=${{ secrets.RUNTIME_API_URL }}
          BACKEND_API_URL=http://129.146.236.177:8001
          ORACLE_API_URL=http://129.146.236.177:3000
          STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GUMROAD_ACCESS_TOKEN=${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GUMROAD_SELLER_ID=${{ secrets.GUMROAD_SELLER_ID }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          MONGODB_URL=${{ secrets.MONGODB_URL }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          BEEHIIV_API_KEY=${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID=${{ secrets.BEEHIIV_PUBLICATION_ID }}
          DEVTO_API_KEY=${{ secrets.DEVTO_API_KEY }}
          HASHNODE_API_KEY=${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUB_ID=${{ secrets.HASHNODE_PUB_ID }}
          MEDIUM_API_KEY=${{ secrets.MEDIUM_API_KEY }}
          MEDIUM_AUTHOR_ID=${{ secrets.MEDIUM_AUTHOR_ID }}
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_URL=https://backend.alreadyherellc.com/runtime/telegram/webhook
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          CONTENT_REPO_TOKEN=${{ secrets.CONTENT_REPO_TOKEN }}
          GITHUB_CONTENT_OWNER=quantam101
          GITHUB_CONTENT_REPO=content
          GITHUB_CONTENT_BRANCH=main
          GITHUB_CONTENT_DIR=posts
          HF_TOKEN=${{ secrets.HF_TOKEN }}
          PROFITENGINE_WEBHOOK_TOKEN=${{ secrets.PROFITENGINE_WEBHOOK_TOKEN }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GMAIL_USER=${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL=${{ secrets.ALERT_EMAIL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          BOTPRESS_TOKEN=${{ secrets.BOTPRESS_TOKEN }}
          AFFILIATE_LINKS=${{ secrets.AFFILIATE_LINKS }}
          AMAZON_PARTNER_TAG=${{ secrets.AMAZON_PARTNER_TAG }}
          POSTGRES_DB=profitengine
          POSTGRES_USER=profitengine
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          API_HOST=0.0.0.0
          API_PORT=8000
          API_RELOAD=false
          LOG_LEVEL=INFO
          ENVIRONMENT=prod
          EOF

          echo "✅ Secrets file created"
          cat secrets.env | wc -l

      - name: Upload secrets file
        uses: actions/upload-artifact@v4
        with:
          name: secrets-export
          path: secrets.env
          retention-days: 1

      - name: Display summary
        run: |
          echo "## ✅ Secrets Export Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the secrets file from artifacts." >> $GITHUB_STEP_SUMMARY
          echo "Total variables: $(grep -c '=' secrets.env)" >> $GITHUB_STEP_SUMMARY
