services:
  - type: web
    name: profitengine-runtime
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.runtime
    dockerCommand: uvicorn runtime.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: profitengine
      - key: GUMROAD_ACCESS_TOKEN
        sync: false
      - key: PRINTIFY_API_TOKEN
        sync: false
      - key: PRINTIFY_SHOP_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PROFITENGINE_WEBHOOK_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
