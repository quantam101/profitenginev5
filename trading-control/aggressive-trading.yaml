system:
  environment: live
  mode: aggressive              # HIGH RISK MODE - Aggressive scaling
  log_level: INFO
  start_date: "2026-06-26"
  target_win_rate: 0.85         # 85%+ (higher bar for aggressive)

accounts:
  live_agentic:
    broker: robinhood
    account_type: agentic
    account_number: "794764977"
    starting_capital: 754.44
    api_base: https://api.robinhood.com
    mode: aggressive

position_sizing:
  aggressive_mode:
    min_trade_size: 200         # $200 minimum (was $50)
    max_trade_size: 500         # $500 maximum (was $100)
    base_allocation: 90         # 90% of cash for trades
    kelly_fraction: 0.50        # 50% Kelly (aggressive)
    leverage: 1.0               # No margin (yet)

  scaling:
    # Auto-scale position size based on account growth
    tier_1:
      account_size: 754         # Current
      position_size: 200-500    # AGGRESSIVE
      daily_max: 200            # Tight daily limit
      weekly_max: 500           # Tight weekly limit

    tier_2:
      account_size: 1500        # After doubling
      position_size: 500-1000   # VERY AGGRESSIVE
      daily_max: 300
      weekly_max: 1000

    tier_3:
      account_size: 5000        # After 5x growth
      position_size: 1000-2000  # ULTRA AGGRESSIVE
      daily_max: 500
      weekly_max: 2000

risk:
  hard_limits:
    max_daily_loss_usd: 200     # INCREASED (was $50)
    max_weekly_loss_usd: 500    # INCREASED (was $200)
    max_position_size_pct: 30   # INCREASED (was 15%)
    max_spread_bps: 25
    min_volume_usd: 100000      # Higher volume required
    min_reward_risk_ratio: 1.5  # Lower bar (was 2.0)
    max_correlation: 0.6        # TIGHTER (was 0.7)
    quote_stale_threshold_sec: 15
    max_open_positions: 5       # INCREASED (was 2)
    max_trades_per_day: 8       # INCREASED (was 3)

  stop_loss:
    type: atr_based
    multiplier: 1.5             # Tighter stops (was 2.0)
    fixed_backup_pct: 5.0       # Wider backup stop

  take_profit:
    strategy: aggressive        # Multi-target exits
    partial_1: 3                # Sell 33% at +3%
    partial_2: 6                # Sell 33% at +6%
    partial_3: 10               # Sell 33% at +10%
    max_hold_hours: 3           # Close faster (was 4 hours)

signals:
  ensemble:
    enabled: true
    confidence_threshold: 0.50  # Lower threshold (was 0.55)
    vote_threshold: 0.2         # Lower threshold (was 0.3)

  signal_1_rsi:
    enabled: true
    period: 14
    oversold_threshold: 35      # Wider band (was 30)
    overbought_threshold: 65    # Wider band (was 70)
    extreme_oversold: 25        # More aggressive (was 20)
    extreme_overbought: 75      # More aggressive (was 80)
    confidence_oversold: 80     # Lower (was 85)
    confidence_extreme: 90      # Lower (was 95)

  signal_2_macd:
    enabled: true
    fast: 12
    slow: 26
    signal: 9
    min_histogram_strength: 0.005  # More sensitive (was 0.01)

  signal_3_bollinger:
    enabled: true
    period: 20
    std_dev: 1.8                # Tighter bands (was 2.0)
    confidence_band_break: 80   # Lower (was 85)

  signal_4_support_resistance:
    enabled: true
    lookback_periods: 15        # Shorter lookback (was 20)
    bounce_threshold_pct: 15    # Wider threshold (was 10%)
    confidence_bounce: 75       # Lower (was 85)

  signal_5_trend:
    enabled: true
    sma_fast: 20
    sma_slow: 50
    confidence_trend: 75        # Lower (was 80)

regime_detection:
  enabled: true
  adx_period: 14
  trending_threshold: 20        # Lower threshold (was 25)
  consolidation_threshold: 15   # Lower threshold (was 20)
  volatility_percentile: 70     # Higher vol tolerated (was 60)

  regimes:
    - name: trending_up
      signal_weights: {trend: 0.9, momentum: 0.8, mean_reversion: 0.3}
      position_size_mult: 1.2   # INCREASED (was 1.0)
      min_confidence: 0.50      # LOWER (was 0.65)

    - name: consolidation
      signal_weights: {mean_reversion: 0.95, support_resistance: 0.9, trend: 0.2}
      position_size_mult: 1.0   # INCREASED (was 0.8)
      min_confidence: 0.45      # LOWER (was 0.60)

    - name: trending_down
      signal_weights: {mean_reversion: 0.85, support_resistance: 0.9, trend: 0.7}
      position_size_mult: 1.0   # INCREASED (was 0.7)
      min_confidence: 0.45      # LOWER (was 0.60)

    - name: high_volatility
      action: trade_aggressive  # CHANGED from skip_trades
      note: "Trade high vol with 50% position sizes"

execution:
  order_type: limit
  time_in_force: day
  post_only: false
  timeout_sec: 10               # Faster (was 15)
  fill_timeout_sec: 3           # Faster (was 5)
  slippage_model_buffer_pct: 2.0  # Higher (was 1.5)

entry_criteria:
  minimum_checks:
    - ensemble_vote > 0.2       # Lower threshold
    - ensemble_confidence > 50% # Lower threshold
    - regime != skip_always     # Only skip extreme conditions
    - position_size > 0
    - stop_loss_calculated: true

exit_criteria:
  profit_target_hit: true
  stop_loss_hit: true
  signal_reversal: true
  time_limit_reached: true      # 3 hours max hold
  manual_override: true

monitoring:
  enabled: true
  check_frequency_sec: 60       # More frequent (was 300)
  live_dashboard: true
  log_file: ./logs/live_trading_aggressive.log
  results_file: ./live_trading_results_aggressive.json

hybrid_validation:
  paper_trading_continue: true
  comparison_enabled: true
  daily_reconciliation: true

audit:
  enabled: true
  database: sqlite:///./audit_aggressive.db
  log_file: ./logs/trading_aggressive.log
  retention_days: 365
  track_all_signals: true
  track_all_fills: true
  track_confidence_scores: true
