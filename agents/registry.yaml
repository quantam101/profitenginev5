agents:
  - id: sovereign-orchestrator
    name: Sovereign Orchestrator
    version: 0.2.0
    mission: Plan and execute profit-generating workflows using Ollama→Groq→Gemini→Claude→deterministic fallback cascade.
    max_cost_usd: 0
    allowed_connectors: [local_files, ollama_local, groq_api, gemini_api]
    forbidden_actions: [any_cost, public_post, email_send, production_deploy, repo_merge]
    approval_required_actions: [paid_api_call, repo_write, production_deploy]
    verifier_required: true

  - id: free-tier-cost-guard
    name: Free-Tier Cost Guard Agent
    version: 0.1.0
    mission: Prevent accidental spending and block paid resources.
    max_cost_usd: 0
    allowed_connectors: [local_files]
    forbidden_actions: [paid_api_call, paid_compute_create, paid_storage_create]
    approval_required_actions: [any_cost]
    verifier_required: false

  - id: local-research
    name: Local Research Agent
    version: 0.2.0
    mission: Produce source-aware research drafts using the inference cascade and local tools.
    max_cost_usd: 0
    allowed_connectors: [playwright_local, local_files, groq_api, gemini_api]
    forbidden_actions: [paid_api_call, public_post]
    approval_required_actions: [external_account_login]
    verifier_required: true

  - id: lifelong-catch-correct
    name: Lifelong Catch and Correct Agent
    version: 0.2.0
    mission: Analyze recent correction history and record one concrete prompt or heuristic improvement per cycle.
    max_cost_usd: 0
    allowed_connectors: [local_files, ollama_local, groq_api, gemini_api]
    forbidden_actions: [paid_api_call, public_post, production_deploy, repo_merge]
    approval_required_actions: [repo_write, external_publish]
    verifier_required: false

  # ── Content pipeline agents ──────────────────────────────────────────────
  - id: trend-scanner
    name: Trend Scanner Agent
    version: 0.1.0
    mission: Scan free public sources (HN, Reddit, GitHub trending) and surface the best affiliate content topics.
    max_cost_usd: 0
    allowed_connectors: [local_files, groq_api, gemini_api, ollama_local]
    forbidden_actions: [paid_api_call, production_deploy]
    approval_required_actions: []
    verifier_required: false

  - id: content-gen
    name: Content Generation Agent
    version: 0.1.0
    mission: Generate SEO-optimized long-form blog articles with resolved affiliate link tokens using the inference cascade.
    max_cost_usd: 0
    allowed_connectors: [local_files, groq_api, gemini_api, ollama_local]
    forbidden_actions: [paid_api_call, production_deploy]
    approval_required_actions: []
    verifier_required: false

  - id: blog-publisher
    name: Blog Publisher Agent
    version: 0.2.0
    mission: Publish generated articles to Dev.to, Hashnode, Medium, and GitHub Pages with affiliate link injection, then send an email digest.
    max_cost_usd: 0
    allowed_connectors: [devto_api, hashnode_api, medium_api, github_api, gmail_smtp, local_files]
    forbidden_actions: [paid_api_call, production_deploy]
    approval_required_actions: []
    verifier_required: false

  - id: content-pipeline
    name: Content Pipeline Agent
    version: 0.1.0
    mission: End-to-end automated content loop — trend scan → AI write → affiliate inject → publish → notify.
    max_cost_usd: 0
    allowed_connectors: [local_files, groq_api, gemini_api, ollama_local, devto_api, github_api, gmail_smtp]
    forbidden_actions: [paid_api_call, production_deploy]
    approval_required_actions: []
    verifier_required: false

  - id: content-factory
    name: Content Factory Agent
    version: 1.0.0
    mission: Convert one approved campaign payload into reusable book, blog, video, social, email, and course assets using local deterministic generation first.
    max_cost_usd: 0
    allowed_connectors: [local_files, ollama_local, groq_api, gemini_api]
    forbidden_actions: [paid_api_call, public_post, email_send, cold_bulk_message, scraped_contact_outreach, production_deploy]
    approval_required_actions: [external_publish, email_send, paid_api_call, campaign_launch]
    verifier_required: true

  - id: hf-asset-enhancer
    name: Hugging Face Asset Enhancer Agent
    version: 0.1.0
    mission: Optionally enhance Content Factory assets with approved Hugging Face models for images, audio, video concepts, embeddings, or Spaces demos while preserving deterministic local fallback.
    max_cost_usd: 0
    allowed_connectors: [local_files, huggingface_runtime]
    forbidden_actions: [hardcoded_api_key, unapproved_external_call, unapproved_paid_inference, public_post, dataset_upload, model_upload, space_deploy]
    approval_required_actions: [external_inference, paid_api_call, model_upload, dataset_upload, space_deploy, external_publish]
    verifier_required: true

  # ── Infrastructure health agent ──────────────────────────────────────────
  - id: docker-guard
    name: Docker Guard Agent
    version: 0.1.0
    mission: >
      Analyze distilled Docker/Ollama health reports from the server.
      Identifies disk pressure, unhealthy containers, and oversized Ollama
      models, then produces a structured remediation plan using the inference
      cascade (Ollama→Groq→deterministic fallback, zero cost). Does not call Docker directly —
      processes pre-collected output from scripts/docker-guard.sh.
    max_cost_usd: 0
    allowed_connectors: [local_files, ollama_local, groq_api, gemini_api]
    forbidden_actions: [paid_api_call, public_post, production_deploy, repo_merge]
    approval_required_actions: []
    verifier_required: false

  # Profitability intelligence agents
  - id: offer-scout
    name: Offer Scout Agent
    version: 0.1.0
    mission: Rank POD, affiliate, and productized service offers by cash potential, proof gating, and fulfillment effort.
    max_cost_usd: 0
    allowed_connectors: [local_files]
    forbidden_actions: [paid_api_call, public_post, production_deploy, payment_capture]
    approval_required_actions: [external_publish, paid_offer_launch]
    verifier_required: false

  - id: margin-guard
    name: Margin Guard Agent
    version: 0.1.0
    mission: Calculate Etsy, Printify, Stripe, and fulfillment margins before any offer is published.
    max_cost_usd: 0
    allowed_connectors: [local_files]
    forbidden_actions: [paid_api_call, public_post, production_deploy, payment_capture]
    approval_required_actions: [pricing_change, paid_offer_launch]
    verifier_required: false

  - id: listing-optimizer
    name: Listing Optimizer Agent
    version: 0.1.0
    mission: Validate Etsy listing titles, descriptions, tags, and conversion rules against the local shop pack.
    max_cost_usd: 0
    allowed_connectors: [local_files]
    forbidden_actions: [paid_api_call, public_post, production_deploy]
    approval_required_actions: [external_publish]
    verifier_required: false

  - id: traffic-agent
    name: Traffic Agent
    version: 0.1.0
    mission: Convert listings and service offers into daily traffic assets for social, blog, short-form, and outreach channels.
    max_cost_usd: 0
    allowed_connectors: [local_files]
    forbidden_actions: [paid_api_call, public_post, production_deploy]
    approval_required_actions: [external_publish, email_send]
    verifier_required: false

  - id: proof-ledger
    name: Proof Ledger Agent
    version: 0.1.0
    mission: Track verified revenue against the $25,000 proof threshold and keep paid ProfitEngine offers locked until proof is reached.
    max_cost_usd: 0
    allowed_connectors: [local_files]
    forbidden_actions: [paid_api_call, public_post, production_deploy, payment_capture]
    approval_required_actions: [unlock_paid_offer]
    verifier_required: true

  - id: motivation-engine
    name: Motivation Engine Agent
    version: 0.1.0
    mission: Convert proof-first revenue objectives into daily execution priorities and anti-stall fallback actions.
    max_cost_usd: 0
    allowed_connectors: [local_files]
    forbidden_actions: [paid_api_call, public_post, production_deploy, payment_capture]
    approval_required_actions: [external_publish, paid_offer_launch]
    verifier_required: false

  # Field work and application intelligence agents
  - id: job-signal-analyst
    name: Job Signal Analyst Agent
    version: 1.0.0
    mission: Score authorized opportunity payloads against Already Here LLC margin, distance, scope, and risk policy.
    max_cost_usd: 0
    allowed_connectors: [local_files]
    forbidden_actions: [paid_api_call, public_post, email_send, platform_accept, production_deploy, repo_merge]
    approval_required_actions: [platform_counter, external_publish]
    verifier_required: false

  - id: proposal-optimizer
    name: Proposal Optimizer Agent
    version: 1.0.0
    mission: Generate scope-controlled proposal and counter artifacts for human approval without sending externally.
    max_cost_usd: 0
    allowed_connectors: [local_files]
    forbidden_actions: [paid_api_call, public_post, email_send, platform_accept, production_deploy, repo_merge]
    approval_required_actions: [platform_counter, external_publish]
    verifier_required: false
