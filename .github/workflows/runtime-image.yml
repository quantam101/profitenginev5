name: Runtime Image — GHCR

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.runtime
      - Dockerfile.runtime.dockerignore
      - requirements.txt
      - runtime/**
      - agents/**
      - connectors/**
      - scripts/setup-telegram-command-webhook.py
      - scripts/printify_shop_status.py
      - scripts/push_printify_catalog.py
      - .github/workflows/runtime-image.yml
  workflow_dispatch:
    inputs:
      fresh_build:
        description: 'Rebuild runtime image without cache'
        required: false
        default: 'false'
        type: boolean
      platform:
        description: 'Target platform for OCI runtime host'
        required: false
        default: 'linux/arm64'
        type: choice
        options:
          - linux/arm64
          - linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-image-ghcr
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/quantam101/profitenginev5-runtime
  TEST_IMAGE: profitenginev5-runtime:ci-smoke

jobs:
  build_test_push:
    name: Build, smoke-test, and push runtime image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="${{ github.event.inputs.platform || 'linux/arm64' }}"
          NO_CACHE=""
          if [ "${{ github.event.inputs.fresh_build || 'false' }}" = "true" ]; then
            NO_CACHE="--no-cache"
          fi
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "no_cache=$NO_CACHE" >> "$GITHUB_OUTPUT"

      - name: Build runtime image locally for smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build ${{ steps.params.outputs.no_cache }} \
            --platform "${{ steps.params.outputs.platform }}" \
            -f Dockerfile.runtime \
            -t "$TEST_IMAGE" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --load .

      - name: Smoke test runtime image
        shell: bash
        run: |
          set -euo pipefail
          cid=""
          cleanup() {
            if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          cid=$(docker run -d -p 18080:8080 "$TEST_IMAGE")
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/health \
              | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('ok') is True else 1)"; then
              echo "runtime image smoke test passed on attempt $i"
              exit 0
            fi
            docker logs --tail 20 "$cid" || true
            sleep 2
          done
          echo "runtime image smoke test failed"
          docker logs "$cid" || true
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build runtime image and push to GHCR
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build ${{ steps.params.outputs.no_cache }} \
            --platform "${{ steps.params.outputs.platform }}" \
            -f Dockerfile.runtime \
            --label "org.opencontainers.image.source=https://github.com/quantam101/profitenginev5" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.title=profitenginev5-runtime" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            --push .

      - name: Verify pushed image manifest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" > /tmp/image-manifest.txt
          cat /tmp/image-manifest.txt
          DIGEST=$(grep -m1 'Digest:' /tmp/image-manifest.txt | awk '{print $2}')
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Write image summary
        run: |
          {
            echo "## Runtime Image Published"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | ${IMAGE}:latest |"
            echo "| SHA tag | ${IMAGE}:${{ github.sha }} |"
            echo "| Digest | ${{ steps.digest.outputs.digest }} |"
            echo "| Platform | ${{ steps.params.outputs.platform }} |"
            echo "| Smoke test | passed |"
          } >> "$GITHUB_STEP_SUMMARY"
