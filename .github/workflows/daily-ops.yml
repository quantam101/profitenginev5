name: Daily Ops — Digest, Health & Revenue

# Consolidated 2026-10-13 from digest.yml, ops-monitor.yml, revenue-report.yml
# and daily_revenue_tracking.yml — one scheduled workflow instead of four,
# cutting scheduled runs ~4x while keeping every check and its failover.
on:
  schedule:
    # 06:55 UTC — the distribution audit must land before the 07:05 article
    # publisher, exactly where distribution-readiness.yml used to run.
    - cron: '55 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-ops.yml'
      - 'scripts/distribution_preflight.py'
      - '.github/workflows/daily-content.yml'
      - 'runtime/eaos/social_engine.py'

# Least privilege: read-only by default; jobs that write escalate per-job.
permissions:
  contents: read

concurrency:
  group: daily-ops
  cancel-in-progress: false

jobs:
  # Folded in from distribution-readiness.yml: certify configured
  # distribution channels before the 07:05 publisher runs. A nonzero exit
  # means a configured channel is broken — the job fails visibly but gates
  # nothing downstream.
  distribution-preflight:
    name: Verify distribution credential coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
      HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUB_ID }}
      MEDIUM_API_KEY: ${{ secrets.MEDIUM_API_KEY }}
      MEDIUM_AUTHOR_ID: ${{ secrets.MEDIUM_AUTHOR_ID }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CMDOS_BASE_URL: ${{ secrets.CMDOS_BASE_URL }}
      PROFITENGINE_WEBHOOK_TOKEN: ${{ secrets.PROFITENGINE_WEBHOOK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate readiness checker
        run: python -m py_compile scripts/distribution_preflight.py
      - name: Audit configured channels
        run: python scripts/distribution_preflight.py

  digest:
    name: Trigger morning digest via runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true   # runtime outages must not block the rest
    env:
      PROFITENGINE_WEBHOOK_TOKEN: ${{ secrets.PROFITENGINE_WEBHOOK_TOKEN }}
      RUNTIME_BASE: ${{ secrets.RUNTIME_API_URL }}
    steps:
      - name: Trigger digest via runtime API
        run: |
          if [ -z "$RUNTIME_BASE" ]; then
            echo "::warning::RUNTIME_API_URL secret is not set — skipping digest"
            exit 0
          fi
          code=$(curl -s -o /tmp/digest_response.json -w "%{http_code}" --max-time 60 \
            -X POST "${RUNTIME_BASE}/digest/run" \
            -H "Authorization: Bearer ${PROFITENGINE_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json")
          echo "HTTP $code"
          cat /tmp/digest_response.json || true
          if [[ "$code" =~ ^2 ]]; then
            echo "::notice::Digest triggered successfully (HTTP $code)"
          else
            echo "::warning::Digest trigger failed (HTTP $code) — runtime unreachable or misconfigured"
          fi

  healthcheck:
    name: Service Health + Revenue Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # opens ops-alert / posts ops-log comments
    outputs:
      report: ${{ steps.report.outputs.report }}
      all_healthy: ${{ steps.report.outputs.all_healthy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check all endpoints
        id: checks
        run: |
          check() {
            local name=$1 url=$2
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
            if [[ "$code" =~ ^2 ]]; then
              echo "OK|${name}|${code}|${url}"
            else
              echo "FAIL|${name}|${code}|${url}"
            fi
          }
          {
            check "ProfitEngine Web"    "https://www.alreadyherellc.com/profitengine"
            check "ProfitEngine API"    "https://www.alreadyherellc.com/api/health"
            check "TokenForge Frontend" "https://forge.alreadyherellc.com"
            check "Tradegate2"          "https://tradegate2-one.vercel.app"
            check "Content Repo"        "https://quantam101.github.io/content/"
            check "Runtime Health Probe" "${{ secrets.RUNTIME_API_URL }}/health"
          } | tee /tmp/health_results.txt

      - name: Build daily report
        id: report
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, datetime

          results = open('/tmp/health_results.txt').read().strip().split('\n')
          rows = []
          failures = []
          for line in results:
              if not line.strip():
                  continue
              parts = line.split('|')
              if len(parts) < 4:
                  continue
              status, name, code, url = parts
              ok = status == 'OK'
              rows.append({'name': name, 'ok': ok, 'code': code, 'url': url})
              if not ok:
                  failures.append(name)

          all_healthy = len(failures) == 0

          revenue_block = ''
          stripe_key = os.environ.get('STRIPE_SECRET_KEY', '')
          if stripe_key and stripe_key.startswith('sk_'):
              try:
                  import urllib.request
                  now = int(datetime.datetime.now(datetime.timezone.utc).timestamp())
                  start_30d = now - 30 * 86400
                  req = urllib.request.Request(
                      f'https://api.stripe.com/v1/charges?created[gte]={start_30d}&limit=100',
                      headers={'Authorization': f'Bearer {stripe_key}'}
                  )
                  resp = json.loads(urllib.request.urlopen(req, timeout=10).read())
                  total = sum(c['amount'] for c in resp.get('data', []) if c.get('paid')) / 100
                  revenue_block = f'\n**Revenue (last 30d):** ${total:,.2f}'
              except Exception as e:
                  revenue_block = f'\n**Revenue:** could not fetch ({e})'

          date_str = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          status_icon = '✅' if all_healthy else '🚨'

          lines = [
              f'## {status_icon} Daily Ops Report — {date_str}',
              '',
              '### Service Health',
              '',
              '| Service | Status | Code |',
              '|---------|--------|------|',
          ]
          for r in rows:
              icon = '✅' if r['ok'] else '❌'
              lines.append(f"| {r['name']} | {icon} {r['code']} | `{r['url']}` |")

          if failures:
              lines += ['', f'### ⚠️ Failures: {", ".join(failures)}', '']

          lines.append(revenue_block)
          lines += [
              '',
              '---',
              '_Auto-generated by daily-ops.yml · Fix issues within 4h of alert_'
          ]

          report = '\n'.join(lines)
          print(report)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              escaped = report.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              f.write(f'report={escaped}\n')
              f.write(f'all_healthy={str(all_healthy).lower()}\n')
          PYEOF

      - name: Create issue on failure
        if: steps.report.outputs.all_healthy == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = decodeURIComponent(process.env.REPORT.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%'));
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ops-alert',
              per_page: 1
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Ops Alert — Service Degradation ${new Date().toISOString().slice(0,10)}`,
                body: report,
                labels: ['ops-alert', 'bug']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: report
              });
            }
        env:
          REPORT: ${{ steps.report.outputs.report }}

      - name: Post daily digest comment (healthy)
        if: steps.report.outputs.all_healthy == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = decodeURIComponent(process.env.REPORT.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%'));
            const title = `📊 Ops Log ${new Date().toISOString().slice(0,7)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ops-log',
              per_page: 1
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: report
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `# Monthly Operations Log\n\nDaily health + revenue snapshots.\n\n---\n\n${report}`,
                labels: ['ops-log']
              });
            }
        env:
          REPORT: ${{ steps.report.outputs.report }}

  revenue:
    name: Revenue aggregation + tracker + email
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commits the daily report
      issues: write     # revenue_report.py posts issue comments
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv pydantic

      - name: Run daily revenue tracker
        id: tracker
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          EMAIL_PLATFORM_API_KEY: ${{ secrets.EMAIL_PLATFORM_API_KEY }}
          AFFILIATE_API_KEY: ${{ secrets.AFFILIATE_API_KEY }}
          TRADING_API_KEY: ${{ secrets.TRADING_API_KEY }}
        run: python3 scripts/daily_revenue_tracker.py

      - name: Refresh learning signals (experiments + revenue → strategy)
        if: steps.tracker.outcome == 'success'
        run: python3 -m runtime.learning_signals refresh

      - name: Sync Gumroad buyers to newsletter (post-purchase nurture)
        if: always() && steps.tracker.outcome == 'success'
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
        run: python3 scripts/gumroad_buyers_to_beehiiv.py --days 7 || echo "::warning::beehiiv sync failed — continuing"

      - name: Post revenue snapshot to GitHub ($25K tracker)
        if: always()
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python scripts/revenue_report.py || echo "::warning::revenue snapshot failed — continuing"

      - name: Upload tracking report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-revenue-reports
          path: daily_revenue_*.json
          retention-days: 90
          if-no-files-found: ignore

      # Stale-report guard: only republish/email when today's tracker
      # produced a fresh file — otherwise recipients get yesterday's numbers.
      - name: Generate markdown report
        if: steps.tracker.outcome == 'success'
        run: |
          python3 << 'EOF'
          import json
          import glob
          from datetime import datetime, timezone

          reports = glob.glob("daily_revenue_*.json")
          if not reports:
              print("No reports found")
              exit(0)

          latest = sorted(reports)[-1]
          with open(latest, 'r') as f:
              data = json.load(f)

          md = (
              f"# Daily Revenue Report\n\n"
              f"**Date:** {data.get('date')}\n"
              f"**Generated:** {datetime.now(timezone.utc).isoformat()}\n\n"
              f"## Summary\n"
              f"- **Total Revenue (24h):** ${data.get('consolidated', {}).get('total_revenue_24h', 0):.2f}\n"
              f"- **Active Streams:** {data.get('consolidated', {}).get('active_revenue_streams', 0)}/{data.get('consolidated', {}).get('tracked_streams', 0)}\n\n"
              f"## Revenue Breakdown\n"
              f"| Stream | Revenue |\n"
              f"|--------|---------|\n"
          )
          for stream, amount in data.get('consolidated', {}).get('revenue_breakdown', {}).items():
              md += f"| {stream.capitalize()} | ${amount:.2f} |\n"
          if data.get('errors'):
              md += f"\n## Errors ({len(data['errors'])})\n"
              for error in data['errors']:
                  md += f"- {error}\n"
          with open('DAILY_REVENUE_REPORT.md', 'w') as f:
              f.write(md)
          print("✓ Markdown report generated")
          EOF

      - name: Send daily summary email
        if: steps.tracker.outcome == 'success'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.DAILY_TRACKING_EMAIL }}
        run: |
          python3 << 'EOF'
          import requests, json, glob, os

          if not all([os.getenv("SENDGRID_API_KEY"), os.getenv("RECIPIENT_EMAIL")]):
              print("⚠ Email configuration incomplete — skipping")
              exit(0)

          reports = glob.glob("daily_revenue_*.json")
          if not reports:
              print("No report to email")
              exit(0)

          with open(sorted(reports)[-1], 'r') as f:
              data = json.load(f)
          consolidated = data.get('consolidated', {})

          email_body = (
              f"<h2>Daily Revenue Summary - {data.get('date')}</h2>"
              f"<p><strong>Total Revenue (24h):</strong> ${consolidated.get('total_revenue_24h', 0):.2f}</p>"
              '<table border="1" cellpadding="5">'
              '<tr><th>Stream</th><th>Revenue</th></tr>'
          )
          for stream, amount in consolidated.get('revenue_breakdown', {}).items():
              email_body += f"<tr><td>{stream.capitalize()}</td><td>${amount:.2f}</td></tr>"
          email_body += "</table>"

          resp = requests.post(
              "https://api.sendgrid.com/v3/mail/send",
              headers={
                  "Authorization": f"Bearer {os.getenv('SENDGRID_API_KEY')}",
                  "Content-Type": "application/json",
              },
              json={
                  "personalizations": [{"to": [{"email": os.getenv("RECIPIENT_EMAIL")}]}],
                  "from": {"email": "reports@alreadyherellc.com"},
                  "subject": f"Daily Revenue Report - {data.get('date')}",
                  "content": [{"type": "text/html", "value": email_body}],
              },
              timeout=15,
          )
          print(f"SendGrid: HTTP {resp.status_code}")
          EOF

      - name: Commit report to repository
        if: steps.tracker.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily revenue report for ${{ github.run_id }}"
          file_pattern: "DAILY_REVENUE_REPORT.md daily_revenue_*.json data/strategy/signals.json"
          skip_fetch: false
          skip_checkout: false

  slack-notification:
    name: Send Slack revenue notification
    runs-on: ubuntu-latest
    needs: revenue
    steps:
      - uses: actions/checkout@v4

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_REVENUE_ALERTS }}
        run: |
          python3 << 'EOF'
          import requests, json, glob, os

          slack_webhook = os.getenv("SLACK_WEBHOOK")
          if not slack_webhook:
              print("⚠ SLACK_WEBHOOK not configured")
              exit(0)

          reports = glob.glob("daily_revenue_*.json")
          if not reports:
              print("No report produced — skipping Slack notification")
              exit(0)

          with open(sorted(reports)[-1], 'r') as f:
              data = json.load(f)

          consolidated = data.get('consolidated', {})
          total_revenue = consolidated.get('total_revenue_24h', 0)
          color = "good" if total_revenue > 100 else "warning" if total_revenue > 0 else "danger"

          slack_payload = {
              "attachments": [{
                  "color": color,
                  "title": f"Daily Revenue Report - {data.get('date')}",
                  "fields": [
                      {"title": "Total Revenue (24h)", "value": f"${total_revenue:.2f}", "short": True},
                      {"title": "Active Streams", "value": f"{consolidated.get('active_revenue_streams', 0)}/{consolidated.get('tracked_streams', 0)}", "short": True},
                  ]
              }]
          }
          breakdown_text = "\n".join([
              f"• {stream.capitalize()}: ${amount:.2f}"
              for stream, amount in consolidated.get('revenue_breakdown', {}).items()
          ])
          if breakdown_text:
              slack_payload["attachments"][0]["fields"].append(
                  {"title": "Breakdown", "value": breakdown_text, "short": False}
              )
          resp = requests.post(slack_webhook, json=slack_payload, timeout=10)
          print(f"Slack: HTTP {resp.status_code}")
          EOF
