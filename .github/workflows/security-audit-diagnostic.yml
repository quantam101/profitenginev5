name: Security audit diagnostic

on:
  push:
    branches:
      - fix/ci-vercel-hardening-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts --no-fund
      - name: Print actionable audit findings
        shell: bash
        run: |
          set +e
          npm audit --json > audit-all.json
          ALL_EXIT=$?
          npm audit --omit=dev --json > audit-prod.json
          PROD_EXIT=$?
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['audit-all.json','audit-prod.json']) {
            const d = JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(`\n=== ${file} ===`);
            console.log('metadata:', JSON.stringify(d.metadata?.vulnerabilities || {}, null, 2));
            for (const [name, v] of Object.entries(d.vulnerabilities || {})) {
              if (['critical','high'].includes(v.severity)) {
                console.log(JSON.stringify({name, severity:v.severity, isDirect:v.isDirect, range:v.range, via:v.via, effects:v.effects, fixAvailable:v.fixAvailable}, null, 2));
              }
            }
          }
          NODE
          echo "all_exit=$ALL_EXIT prod_exit=$PROD_EXIT"
          exit 0
      - name: Enforce zero production critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
