name: Daily Income Streams Automation

on:
  schedule:
    # Newsletter: 08:30 UTC daily (after content pipeline at 07:05)
    - cron: '30 8 * * *'
    # City SEO pages: 10:00 UTC daily (25 pages/day = 750/month)
    - cron: '0 10 * * *'
    # Gumroad catalog bootstrap: 09:00 UTC daily (idempotent)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      stream:
        description: 'Which stream to run (newsletter|city-seo|products|all)'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run (no commits, no publish)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: income-streams
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # gh run download of the video pipeline's artifacts

jobs:
  # Each scheduled job is gated to ITS OWN cron. Previously every cron fired
  # every job, so the newsletter broadcast went out three times a day.
  newsletter:
    name: Publish Daily Newsletter (Resend)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 8 * * *') ||
      github.event.inputs.stream == 'newsletter' ||
      github.event.inputs.stream == 'all'
    env:
      RUNTIME_API_URL: ${{ secrets.RUNTIME_API_URL || 'https://profitengine-runtime.onrender.com' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Pull artifacts from latest video production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow=autonomous-video-production.yml \
            --status=success --limit 1 --json databaseId -q '.[0].databaseId' || echo "")
          if [ -n "$RUN_ID" ]; then
            echo "using production run $RUN_ID"
            gh run download "$RUN_ID" -n youtube-uploads -D artifacts || true
            find artifacts -name '*.json' -exec cp {} . \; 2>/dev/null || true
            ls -la *.json || true
          else
            echo "no successful production run found — composing from repo trends + Gumroad only"
          fi

      - name: Compose + publish daily digest
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ -z "$RUNTIME_API_URL" ]; then
            echo "::warning::RUNTIME_API_URL not set — skipping newsletter"
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/make_daily_digest.py --dry-run
          else
            python scripts/make_daily_digest.py
          fi

  city-seo:
    name: Generate City SEO Pages
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') ||
      github.event.inputs.stream == 'city-seo' ||
      github.event.inputs.stream == 'all'
    env:
      RUNTIME_API_URL: ${{ secrets.RUNTIME_API_URL || 'https://profitengine-runtime.onrender.com' }}
    steps:
      - name: Generate and commit city pages
        run: |
          if [ -z "$RUNTIME_API_URL" ]; then
            echo "::warning::RUNTIME_API_URL not set — skipping city SEO"
            exit 0
          fi

          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          curl -sf -X POST "$RUNTIME_API_URL/city-seo/generate" \
            -H "Content-Type: application/json" \
            -d "{
              \"niches\": [\"it-support\", \"ai-chatbots\", \"automation-agency\", \"roofers\", \"plumbers\"],
              \"tiers\": [\"A\", \"B\"],
              \"limit\": 25,
              \"dry_run\": $DRY_RUN
            }" \
            -o /tmp/city_seo_result.json || echo '{"ok":false}' > /tmp/city_seo_result.json

          cat /tmp/city_seo_result.json
          echo "City SEO run complete"

  products:
    name: Bootstrap Gumroad Product Catalog
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') ||
      github.event.inputs.stream == 'products' ||
      github.event.inputs.stream == 'all'
    env:
      RUNTIME_API_URL: ${{ secrets.RUNTIME_API_URL || 'https://profitengine-runtime.onrender.com' }}
    steps:
      - name: Ensure all 5 products exist on Gumroad
        run: |
          if [ -z "$RUNTIME_API_URL" ]; then
            echo "::warning::RUNTIME_API_URL not set — skipping Gumroad bootstrap"
            exit 0
          fi

          curl -sf -X POST "$RUNTIME_API_URL/products/bootstrap" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o /tmp/products_result.json || echo '{"ok":false}' > /tmp/products_result.json

          cat /tmp/products_result.json
          echo "Gumroad catalog bootstrap complete"

  income-report:
    name: Daily Income Summary Report
    runs-on: ubuntu-latest
    needs: [newsletter, city-seo, products]
    # once a day, after the last stream (10:00 cron) — or on any manual run
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.schedule == '0 10 * * *')
    env:
      RUNTIME_API_URL: ${{ secrets.RUNTIME_API_URL || 'https://profitengine-runtime.onrender.com' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Pull income summary and send Telegram digest
        run: |
          if [ -z "$RUNTIME_API_URL" ]; then
            echo "No RUNTIME_API_URL — skipping income report"
            exit 0
          fi

          curl -sf "$RUNTIME_API_URL/income/summary" \
            -o /tmp/income.json || echo '{"ok":false}' > /tmp/income.json

          # Parse key metrics
          GUMROAD_REV=$(python3 -c "
          import json,sys
          try:
              d = json.load(open('/tmp/income.json'))
              s = d.get('streams', {})
              gum = s.get('digital_products', {}).get('month_revenue_usd', 0)
              chat = s.get('chatbot_retainers', {}).get('chatbot_mrr_usd', 0)
              subs = s.get('newsletter', {}).get('paid', 0)
              print(f'Gumroad: \${gum:.0f}/mo | Chatbots: \${chat:.0f} MRR | Newsletter paid: {subs}')
          except Exception as e:
              print(f'Parse error: {e}')
          " 2>/dev/null || echo "Metrics unavailable")

          MSG="📊 *Daily Income Report — $(date +'%b %d %Y')*%0A%0A${GUMROAD_REV}%0A%0AAll streams running ✅"

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi

          echo "Income report complete"
