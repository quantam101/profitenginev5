name: Hybrid Micro Trading - 4 AM MST Daily Execution

on:
  schedule:
    # 4 AM MST = 6 AM ET (pre-market)
    - cron: '0 11 * * 1-5'  # Monday-Friday at 4 AM MST (6 AM ET / 11 AM UTC)
  workflow_dispatch:  # Allow manual trigger

jobs:
  micro_trading:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: America/Denver  # MST timezone

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml numpy requests httpx asyncio

      - name: Run hybrid trading system
        env:
          ROBINHOOD_API_KEY: ${{ secrets.ROBINHOOD_API_KEY }}
          ROBINHOOD_SECRET: ${{ secrets.ROBINHOOD_SECRET }}
          ACCOUNT_NUMBER: "794764977"
          TRADING_MODE: hybrid
          MICRO_POSITIONS: "true"
          LOG_LEVEL: INFO
        run: |
          python trading-agent/run_hybrid_trading.py

      - name: Upload trading results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-trading-results-${{ github.run_id }}
          path: |
            live_trading_results.json
            hybrid_trading.log
            signal_analysis.json
          retention-days: 30

      - name: Post trading summary
        if: always()
        run: |
          echo "=== Hybrid Trading Session Complete ==="
          if [ -f live_trading_results.json ]; then
            echo "Trade Summary:"
            cat live_trading_results.json
          fi
          if [ -f signal_analysis.json ]; then
            echo "Signal Analysis:"
            cat signal_analysis.json
          fi

      - name: Notify on significant P&L
        if: always()
        run: |
          python -c "
          import json
          try:
            with open('live_trading_results.json', 'r') as f:
              results = json.load(f)
              pnl = results.get('daily_pnl', 0)
              if pnl > 20 or pnl < -20:
                print(f'⚠️  Significant P&L: \${pnl:.2f}')
          except:
            pass
          "
