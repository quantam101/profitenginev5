name: Daily Content Publisher

# Publishes one SEO article per day to GitHub Pages (quantam101/content).
# Model IDs are pinned to current production endpoints and can be overridden
# by repository/environment configuration when needed.
# Zero infrastructure required - runs entirely on GitHub's free CI runners.
# Topics rotate from scripts/article_topics.py (90-topic cycle).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-content.yml'
      - 'scripts/publish_article.py'
  schedule:
    # 07:05 UTC daily - 5 min after n8n cron on the server (avoids overlap)
    - cron: '5 7 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic (leave blank for today''s rotation)'
        required: false
        default: ''
      verify_only:
        description: 'Verify publisher credentials without publishing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_publish:
        description: 'Publish even if a post already exists today (bypass same-day guard)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Queue concurrent runs instead of racing — combined with the same-day guard
# in publish_article.py this makes double-dispatches publish exactly one post.
concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish article
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx pillow

      - name: Publish article + social blast
        id: publish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAOS_GROQ_MODEL: openai/gpt-oss-20b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAOS_GEMINI_MODEL: gemini-3.7-flash
          GITHUB_CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          GITHUB_CONTENT_OWNER: quantam101
          GITHUB_CONTENT_REPO: content
          GITHUB_CONTENT_BRANCH: main
          GITHUB_CONTENT_DIR: _posts
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUB_ID }}
          MEDIUM_API_KEY: ${{ secrets.MEDIUM_API_KEY }}
          MEDIUM_AUTHOR_ID: ${{ secrets.MEDIUM_AUTHOR_ID }}
          ARTICLE_TOPIC: ${{ github.event.inputs.topic }}
          AFFILIATE_LINKS: ${{ secrets.AFFILIATE_LINKS }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          CMDOS_BASE_URL: ${{ secrets.CMDOS_BASE_URL }}
          CONTENT_VERIFY_ONLY: ${{ github.event.inputs.verify_only }}
          FORCE_PUBLISH: ${{ github.event_name == 'push' && 'true' || github.event.inputs.force_publish }}
          PYTHONUTF8: "1"
          # EAOS Social credentials - add these secrets to enable each platform
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/publish_article.py

      - name: Summary
        if: always()
        run: |
          echo "### Content Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "Ran at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Site: https://quantam101.github.io/content" >> $GITHUB_STEP_SUMMARY
          echo "Dev.to: https://dev.to/quantam101" >> $GITHUB_STEP_SUMMARY
