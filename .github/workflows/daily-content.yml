name: Daily Content Publisher

# Publishes one SEO article per day to GitHub Pages (quantam101/content).
# The primary publication path is treated as revenue infrastructure: a green
# workflow means that a dated post actually exists in the canonical content
# repository. Optional syndication/social failures remain non-fatal.
# Pre-produced articles in data/scheduled_articles/YYYY-MM-DD.json are used
# first, allowing tomorrow's article to be completed early without bypassing
# the normal publication and distribution controls.

on:
  schedule:
    # 07:05 UTC daily / 00:05 Phoenix (Arizona does not observe DST).
    - cron: '5 7 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-content.yml'
      - 'scripts/publish_article.py'
      - 'scripts/publish_scheduled_article.py'
      - 'scripts/article_topics.py'
      - 'data/scheduled_articles/**'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic (leave blank for today''s rotation)'
        required: false
        default: ''
      verify_only:
        description: 'Verify publisher credentials without publishing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_publish:
        description: 'Publish even if a post already exists today (bypass same-day guard)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: daily-content-production
  cancel-in-progress: false

jobs:
  publish:
    name: Generate, publish, and verify article
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CONTENT_OWNER: quantam101
      CONTENT_REPO: content
      CONTENT_BRANCH: main
      CONTENT_DIR: _posts

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check httpx pillow

      - name: Validate publisher code
        run: |
          python -m py_compile scripts/publish_article.py
          python -m py_compile scripts/publish_scheduled_article.py

      - name: Preflight required publisher configuration
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 || secrets.GEMINI_API_KEY }}
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          SCHEDULED="data/scheduled_articles/${TODAY}.json"
          if [[ -z "${CONTENT_REPO_TOKEN}" ]]; then
            echo '::error::CONTENT_REPO_TOKEN is missing; canonical article publishing cannot work.'
            exit 1
          fi
          if [[ ! -f "$SCHEDULED" && -z "${GROQ_API_KEY}" && -z "${GEMINI_API_KEY}" ]]; then
            echo '::error::No scheduled article exists and both GROQ_API_KEY and GEMINI_API_KEY are missing.'
            exit 1
          fi
          python - <<'PY'
          import os
          import httpx

          token = os.environ['CONTENT_REPO_TOKEN']
          r = httpx.get(
              'https://api.github.com/repos/quantam101/content',
              headers={
                  'Authorization': f'token {token}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'ProfitEngine-Daily-Content-Preflight',
              },
              timeout=20,
          )
          if r.status_code != 200:
              raise SystemExit(
                  f'CONTENT_REPO_TOKEN cannot access quantam101/content: HTTP {r.status_code}'
              )
          print('[OK] Canonical content repository is reachable with publisher token')
          PY

      - name: Publish article + social blast
        id: publish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAOS_GROQ_MODEL: openai/gpt-oss-120b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 || secrets.GEMINI_API_KEY }}
          GMAOS_GEMINI_MODEL: gemini-3.8-flash
          GITHUB_CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          GITHUB_CONTENT_OWNER: quantam101
          GITHUB_CONTENT_REPO: content
          GITHUB_CONTENT_BRANCH: main
          GITHUB_CONTENT_DIR: _posts
          CONTENT_SITE_BASE: https://www.alreadyherellc.com/content
          INDEXNOW_KEY: df3d3df8306964832a848348037c470d
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUB_ID }}
          MEDIUM_API_KEY: ${{ secrets.MEDIUM_API_KEY }}
          MEDIUM_AUTHOR_ID: ${{ secrets.MEDIUM_AUTHOR_ID }}
          ARTICLE_TOPIC: ${{ github.event.inputs.topic }}
          AFFILIATE_LINKS: ${{ secrets.AFFILIATE_LINKS }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          CMDOS_BASE_URL: ${{ secrets.CMDOS_BASE_URL }}
          PROFITENGINE_WEBHOOK_TOKEN: ${{ secrets.PROFITENGINE_WEBHOOK_TOKEN }}
          CONTENT_VERIFY_ONLY: ${{ github.event.inputs.verify_only }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
          PYTHONUTF8: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          TODAY="$(date -u +%F)"
          SCHEDULED="data/scheduled_articles/${TODAY}.json"
          if [[ "${CONTENT_VERIFY_ONLY}" == "true" ]]; then
            python scripts/publish_article.py
          elif [[ -f "$SCHEDULED" ]]; then
            echo "[SCHEDULED] Publishing pre-produced article: $SCHEDULED"
            python scripts/publish_scheduled_article.py
          else
            python scripts/publish_article.py
          fi

      - name: Verify canonical post exists
        if: ${{ github.event.inputs.verify_only != 'true' }}
        id: verify_post
        shell: bash
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          from datetime import datetime, timezone
          import httpx

          date_str = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          url = 'https://api.github.com/repos/quantam101/content/contents/_posts'
          headers = {
              'Authorization': f"token {os.environ['CONTENT_REPO_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'ProfitEngine-Daily-Content-Verifier',
          }

          last_error = None
          for attempt in range(3):
              try:
                  r = httpx.get(url, headers=headers, params={'ref': 'main'}, timeout=30)
                  r.raise_for_status()
                  posts = r.json()
                  matches = [p.get('name', '') for p in posts if p.get('name', '').startswith(date_str)]
                  if matches:
                      print(f'[OK] Canonical daily article verified: {matches[-1]}')
                      with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                          out.write('verified=true\n')
                          out.write(f'post={matches[-1]}\n')
                      raise SystemExit(0)
                  last_error = f'No _posts entry dated {date_str}'
              except Exception as exc:
                  last_error = str(exc)
              time.sleep(5 * (attempt + 1))

          print(f'[WARN] Primary verification failed after retries: {last_error}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('verified=false\n')
          PY

      - name: Self-heal one missed primary publication
        if: ${{ github.event.inputs.verify_only != 'true' && steps.verify_post.outputs.verified != 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAOS_GROQ_MODEL: openai/gpt-oss-120b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 || secrets.GEMINI_API_KEY }}
          GMAOS_GEMINI_MODEL: gemini-3.8-flash
          GITHUB_CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          GITHUB_CONTENT_OWNER: quantam101
          GITHUB_CONTENT_REPO: content
          GITHUB_CONTENT_BRANCH: main
          GITHUB_CONTENT_DIR: _posts
          CONTENT_SITE_BASE: https://www.alreadyherellc.com/content
          INDEXNOW_KEY: df3d3df8306964832a848348037c470d
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUB_ID }}
          MEDIUM_API_KEY: ${{ secrets.MEDIUM_API_KEY }}
          MEDIUM_AUTHOR_ID: ${{ secrets.MEDIUM_AUTHOR_ID }}
          ARTICLE_TOPIC: ${{ github.event.inputs.topic }}
          AFFILIATE_LINKS: ${{ secrets.AFFILIATE_LINKS }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          CMDOS_BASE_URL: ${{ secrets.CMDOS_BASE_URL }}
          PROFITENGINE_WEBHOOK_TOKEN: ${{ secrets.PROFITENGINE_WEBHOOK_TOKEN }}
          CONTENT_VERIFY_ONLY: 'false'
          FORCE_PUBLISH: 'true'
          PYTHONUTF8: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo '[RECOVERY] No canonical post was detected. Retrying publication once.'
          TODAY="$(date -u +%F)"
          SCHEDULED="data/scheduled_articles/${TODAY}.json"
          if [[ -f "$SCHEDULED" ]]; then
            python scripts/publish_scheduled_article.py
          else
            python scripts/publish_article.py
          fi

      - name: Final canonical verification
        if: ${{ github.event.inputs.verify_only != 'true' }}
        shell: bash
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          import httpx

          date_str = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          r = httpx.get(
              'https://api.github.com/repos/quantam101/content/contents/_posts',
              headers={
                  'Authorization': f"token {os.environ['CONTENT_REPO_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'ProfitEngine-Daily-Content-Final-Verifier',
              },
              params={'ref': 'main'},
              timeout=30,
          )
          r.raise_for_status()
          matches = [
              p.get('name', '')
              for p in r.json()
              if p.get('name', '').startswith(date_str)
          ]
          if not matches:
              raise SystemExit(
                  f'Canonical publication failed: no _posts entry dated {date_str}. '
                  'This workflow is intentionally failing instead of reporting a false green.'
              )
          print(f'[OK] Final production proof: {matches[-1]}')
          PY

      - name: Summary
        if: always()
        run: |
          TODAY="$(date -u +%F)"
          if [[ -f "data/scheduled_articles/${TODAY}.json" ]]; then MODE='pre-produced scheduled article'; else MODE='AI daily generation'; fi
          echo '### Daily Content Pipeline' >> "$GITHUB_STEP_SUMMARY"
          echo "Ran at: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${MODE}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical site: https://www.alreadyherellc.com/content' >> "$GITHUB_STEP_SUMMARY"
          echo 'Content repository: https://github.com/quantam101/content' >> "$GITHUB_STEP_SUMMARY"
          echo 'AI primary: Groq openai/gpt-oss-20b' >> "$GITHUB_STEP_SUMMARY"
          echo 'AI fallback: Gemini gemini-3.8-flash' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "data/distribution_health.json" ]]; then
            echo '### Distribution health (real per-channel outcomes)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/distribution_health.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
