name: Daily Content Publisher

# Publishes one SEO article per day to GitHub Pages (quantam101/content)
# using Groq's free llama-3.3-70b-versatile model.
# Zero infrastructure required - runs entirely on GitHub's free CI runners.
# Topics rotate from scripts/article_topics.py (90-topic cycle).

on:
  schedule:
    # 07:05 UTC daily - morning publish (Groq/Gemini/HF rotation)
    - cron: '5 7 * * *'
    # 15:05 UTC daily - afternoon publish (second article, more SEO coverage)
    - cron: '5 15 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic (leave blank for today''s rotation)'
        required: false
        default: ''
      verify_only:
        description: 'Verify publisher credentials without publishing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  publish:
    name: Generate and publish article
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx pillow

      - name: Publish article + social blast
        id: publish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          GITHUB_CONTENT_OWNER: quantam101
          GITHUB_CONTENT_REPO: content
          GITHUB_CONTENT_BRANCH: main
          GITHUB_CONTENT_DIR: posts
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUB_ID }}
          MEDIUM_API_KEY: ${{ secrets.MEDIUM_API_KEY }}
          MEDIUM_AUTHOR_ID: ${{ secrets.MEDIUM_AUTHOR_ID }}
          ARTICLE_TOPIC: ${{ github.event.inputs.topic }}
          AFFILIATE_LINKS: ${{ secrets.AFFILIATE_LINKS }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          CMDOS_BASE_URL: ${{ secrets.CMDOS_BASE_URL }}
          CONTENT_VERIFY_ONLY: ${{ github.event.inputs.verify_only }}
          PYTHONUTF8: "1"
          # EAOS Social credentials - add these secrets to enable each platform
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/publish_article.py

      - name: Summary
        if: always()
        run: |
          echo "### Content Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "Ran at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Site: https://quantam101.github.io/content" >> $GITHUB_STEP_SUMMARY
          echo "Dev.to: https://dev.to/quantam101" >> $GITHUB_STEP_SUMMARY

  video:
    name: Generate article video (FFmpeg slideshow)
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 15
    if: ${{ always() && needs.publish.result == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install ffmpeg + pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing ffmpeg
          pip install pillow

      - name: Generate slideshow video
        env:
          ARTICLE_TOPIC: ${{ github.event.inputs.topic }}
          EAOS_GPU_ENABLED: "false"
          EAOS_VIDEO_ROOT: ./datacenter/video_pipeline
          PYTHONUTF8: "1"
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/generate_video.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v5
        with:
          name: article-video-${{ github.run_id }}
          path: datacenter/video_pipeline/distribution_masters/*.mp4
          if-no-files-found: ignore
          retention-days: 7
