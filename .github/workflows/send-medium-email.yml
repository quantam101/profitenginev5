name: Send Medium API Request Email

on:
  workflow_dispatch:

jobs:
  send:
    name: Send email to Medium API team
    runs-on: ubuntu-latest
    steps:
      - name: Send via Gmail SMTP
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'EOF'
import smtplib, os
from email.mime.multipart import MIMEMultipart
from email.mime.text import MIMEText

gmail_user = os.environ.get("GMAIL_USER", "alreadyherellc@gmail.com")
app_password = os.environ.get("GMAIL_APP_PASSWORD", "")

if not app_password:
    raise SystemExit("GMAIL_APP_PASSWORD not set")

body = """Hi Medium team,

My name is Stephen, founder of Already Here LLC. I'm building ProfitEngine v5, an automated content publishing platform that helps small business owners and indie builders create and distribute SEO-optimized articles across multiple platforms.

We'd like to integrate Medium's API to publish our generated content directly to our Medium publication. We're currently live on GitHub Pages, Dev.to, and Hashnode — Medium is the final distribution channel we want to activate.

Details:
- Company: Already Here LLC
- Website: https://profitengine.alreadyherellc.com
- Use case: Automated cross-posting of original long-form articles (1,000–1,500 words) on AI tools, passive income, and developer productivity
- Scopes needed: basicProfile, publishPost
- Publishing frequency: 1–3 articles per day
- Contact email: dispatch@alreadyherellc.com

We publish original content with proper FTC disclosures and canonical URLs. All articles are written by our AI pipeline using Groq/Gemini with human editorial oversight.

Would you be able to grant us a clientId and clientSecret, or confirm whether a self-issued integration token from Settings → Integration Tokens would cover the publishPost scope for our account?

Thank you for your time.

Best,
Stephen
Already Here LLC
dispatch@alreadyherellc.com
https://profitengine.alreadyherellc.com"""

msg = MIMEMultipart("alternative")
msg["Subject"] = "API Access Request — ProfitEngine v5 / Already Here LLC"
msg["From"] = f"Stephen — Already Here LLC <{gmail_user}>"
msg["To"] = "yourfriends@medium.com"
msg["Reply-To"] = "dispatch@alreadyherellc.com"
msg.attach(MIMEText(body, "plain"))

with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
    server.login(gmail_user, app_password)
    server.sendmail(gmail_user, "yourfriends@medium.com", msg.as_string())

print("Email sent to yourfriends@medium.com")
EOF
