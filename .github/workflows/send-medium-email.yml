name: Send Medium API Request Email

on:
  workflow_dispatch:

jobs:
  send:
    name: Send email to Medium API team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/send_medium_email.py
