name: Send Medium API Request Email

on:
  workflow_dispatch:
    inputs:
      test_recipient:
        description: 'If set, send to this address instead of Medium (diagnostic)'
        required: false
        default: ''

jobs:
  send:
    name: Send email to Medium API team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_RECIPIENT: ${{ github.event.inputs.test_recipient }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/send_medium_email.py
