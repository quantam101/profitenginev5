name: EAOS — Cluster Task Dispatch

# Enqueues one-off tasks into the EAOS cluster queue on the OCI runtime server.
# The cluster_master.py daemon (running on OCI) picks them up and executes them.
# Use this to manually trigger VIDEO, SOCIAL, or POD jobs outside the daily cron.

on:
  workflow_dispatch:
    inputs:
      agent_type:
        description: 'Target agent lane'
        required: true
        type: choice
        options: [VIDEO, SOCIAL, POD, ALL]
      directive:
        description: 'Action directive (e.g. PRODUCE_VIDEO, POST_ARTICLE, RENDER_CATALOG)'
        required: true
        default: 'POST_ARTICLE'
      payload_json:
        description: 'JSON payload for the task (e.g. {"title":"...", "url":"..."})'
        required: false
        default: '{}'

jobs:
  dispatch:
    name: Dispatch EAOS cluster task
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enqueue task
        env:
          EAOS_CLUSTER_DB: ./datacenter/eaos_cluster.db
          AGENT_TYPE: ${{ github.event.inputs.agent_type }}
          DIRECTIVE: ${{ github.event.inputs.directive }}
          PAYLOAD_JSON: ${{ github.event.inputs.payload_json }}
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PYEOF'
import asyncio, json, os, sys, pathlib

# Guard: exit cleanly if not triggered via workflow_dispatch (no inputs set)
if not os.environ.get('AGENT_TYPE'):
    print('[EAOS] Skipped — no AGENT_TYPE set. Trigger manually via workflow_dispatch.')
    sys.exit(0)
sys.path.insert(0, str(pathlib.Path(".").resolve()))
from runtime.eaos.cluster_master import ClusterTaskQueue

agent_type  = os.environ["AGENT_TYPE"]
directive   = os.environ["DIRECTIVE"]
payload_raw = os.environ.get("PAYLOAD_JSON", "{}")
payload     = json.loads(payload_raw) if payload_raw.strip() else {}

queue = ClusterTaskQueue()

if agent_type == "ALL":
    for lane in ["VIDEO", "SOCIAL", "POD"]:
        tid = queue.enqueue(lane, directive, payload)
        print(f"[Cluster] Enqueued {lane}::{directive} → task_id={tid}")
else:
    tid = queue.enqueue(agent_type, directive, payload)
    print(f"[Cluster] Enqueued {agent_type}::{directive} → task_id={tid}")

print(f"\nNote: The cluster_master daemon on the OCI server picks up queued tasks.")
print(f"Verify at: opc@129.146.167.73  →  cat datacenter/eaos_cluster.db")
PYEOF

      - name: Summary
        if: always()
        run: |
          echo "### EAOS Cluster Dispatch" >> $GITHUB_STEP_SUMMARY
          echo "Agent: ${{ github.event.inputs.agent_type }}" >> $GITHUB_STEP_SUMMARY
          echo "Directive: ${{ github.event.inputs.directive }}" >> $GITHUB_STEP_SUMMARY
          echo "Dispatched at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "OCI Server: 129.146.167.73" >> $GITHUB_STEP_SUMMARY
