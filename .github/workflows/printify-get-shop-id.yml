name: Printify — Get Shop ID (one-shot)
on:
  workflow_dispatch:
jobs:
  get-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch shop list
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: python3 scripts/printify_get_shop_id.py
