name: OCI SSH Hardening
on:
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Repair SSH resilience on the OCI host
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CMDOS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # single connection with retries; a fresh runner IP should not be fail2ban-banned
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=25 -o ServerAliveInterval=15 \
                   opc@129.146.236.177 'bash -s' <<'EOSSH'
          set -e
          # 1) Raise sshd pre-auth connection ceiling (root cause of banner-exchange drops)
          sudo sed -i '/^#\?MaxStartups/d;/^#\?MaxSessions/d' /etc/ssh/sshd_config
          echo 'MaxStartups 100:30:200' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          echo 'MaxSessions 50'         | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo sshd -t && (sudo systemctl reload ssh 2>/dev/null || sudo systemctl reload sshd 2>/dev/null || true)
          # 2) Clear any fail2ban SSH bans and make the jail tolerant of bursty deploys
          if command -v fail2ban-client >/dev/null 2>&1; then
            sudo fail2ban-client unban --all 2>/dev/null || true
            sudo tee /etc/fail2ban/jail.d/sshd-tolerant.local >/dev/null <<'F2B'
          [sshd]
          enabled = true
          maxretry = 20
          findtime = 600
          bantime  = 300
          ignoreip = 127.0.0.1/8 ::1
          F2B
            sudo systemctl reload fail2ban 2>/dev/null || sudo systemctl restart fail2ban 2>/dev/null || true
          fi
          echo "OK: MaxStartups=$(sudo grep -i '^MaxStartups' /etc/ssh/sshd_config) ; fail2ban bans cleared"
          EOSSH
            then echo "hardening applied on attempt $i"; exit 0
            fi
            echo "attempt $i failed (likely throttled) — waiting before retry"; sleep 40
          done
          echo "::error::could not reach the OCI host after 5 attempts — ban window may still be open"
          exit 1
