name: Gumroad Publish Sweep
# Attempts to flip every unpublished product live via PUT /v2/products/:id.
# Gumroad's create API accepts published=true but still lands products in
# draft; this sweep reports, per product, whether API publishing works or
# the product needs a manual click (usually: missing content file).
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish all draft products
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ["GUMROAD_ACCESS_TOKEN"].strip()
          BASE = "https://api.gumroad.com/v2"

          def call(method, path, data=None):
              params = {"access_token": token, **(data or {})}
              body = urllib.parse.urlencode(params).encode()
              req = urllib.request.Request(f"{BASE}{path}", data=body,
                                           method=method,
                                           headers={"User-Agent": "already-here/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"success": False, "http": e.code,
                          "message": e.read().decode(errors="replace")[:300]}

          listing = call("GET", "/products")
          products = listing.get("products", [])
          print(f"{len(products)} products in account")
          for p in products:
              name, pid = p.get("name", "?"), p.get("id")
              if p.get("published"):
                  print(f"  LIVE     {name}")
                  continue
              r = call("PUT", f"/products/{pid}", {"published": "true"})
              if r.get("success") and r.get("product", {}).get("published"):
                  print(f"  PUBLISHED-NOW  {name} -> {p.get('short_url')}")
              else:
                  print(f"  STILL-DRAFT    {name}: {str(r.get('message') or r)[:200]}")
          PY
