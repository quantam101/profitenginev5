name: Gumroad Publish Sweep
# Attempts to flip every unpublished product live via PUT /v2/products/:id.
# Gumroad's create API accepts published=true but still lands products in
# draft; runtime.gumroad_client.create_product now calls publish_product
# after every create, and this sweep is the failover: it reports, per
# product, whether API publishing worked or the product needs a manual
# click (usually: missing content file — the v2 API cannot upload files).
on:
  workflow_dispatch:
  schedule:
    # Daily failover sweep so newly created products don't sit in draft.
    - cron: '15 8 * * *'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Publish all draft products
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, sys

          if not os.environ.get("GUMROAD_ACCESS_TOKEN", "").strip():
              print("GUMROAD_ACCESS_TOKEN not set — skipping (fail-closed)")
              sys.exit(0)

          sys.path.insert(0, ".")
          from runtime.gumroad_client import publish_all_drafts

          results = publish_all_drafts()
          for r in results:
              tag = {"live": "LIVE", "published": "PUBLISHED-NOW"}.get(r["status"], "STILL-DRAFT")
              line = f"  {tag:14}  {r['name']}"
              if r.get("short_url"):
                  line += f" -> {r['short_url']}"
              if r.get("manual_step"):
                  line += f"  [{r['manual_step']}]"
              print(line)
          drafts = [r for r in results if r["status"] == "still_draft"]
          print(f"{len(results)} products, {len(drafts)} still draft")
          # Exit 0 either way: still-draft is an expected state needing a
          # manual dashboard step, not a job failure.
          PY
