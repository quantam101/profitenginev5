name: Verify Resend Credential
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check RESEND_API_KEY against Resend API
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "::error::RESEND_API_KEY not set"; exit 1; fi
          code=$(curl -s -o /tmp/domains.json -w '%{http_code}' -H "Authorization: Bearer $RESEND_API_KEY" https://api.resend.com/domains)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then echo "::error::Resend key rejected (HTTP $code)"; cat /tmp/domains.json; exit 1; fi
          echo "Verified sender domains:"
          python3 -c "import json;d=json.load(open('/tmp/domains.json'));[print(' -',x.get('name'),x.get('status')) for x in d.get('data',[])] or print(' (none configured)')"
