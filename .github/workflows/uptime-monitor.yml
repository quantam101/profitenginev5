name: Uptime Monitor
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints and alert on failure
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: dispatch@alreadyherellc.com
        run: |
          set -u
          ENDPOINTS="
          https://api.alreadyherellc.com/api/health
          https://app.alreadyherellc.com
          https://profitengine-tau.vercel.app
          "
          DOWN=""
          for u in $ENDPOINTS; do
            [ -z "$u" ] && continue
            code=$(curl -s -o /dev/null -m 15 -L -w '%{http_code}' "$u" || echo 000)
            echo "$code  $u"
            case "$code" in 2*|3*) : ;; *) DOWN="$DOWN\n$code  $u" ;; esac
          done
          if [ -n "$DOWN" ]; then
            echo "::warning::endpoints down:$DOWN"
            if [ -n "${RESEND_API_KEY:-}" ]; then
              BODY=$(printf 'Uptime monitor detected DOWN endpoints (run %s):\n%b\n\nTime: %s' "$GITHUB_RUN_ID" "$DOWN" "$(date -u)")
              curl -s -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -H "User-Agent: already-here-llc-uptime/1.0" \
                -d "$(python3 -c "import json,os;print(json.dumps({'from':'Uptime Monitor <dispatch@alreadyherellc.com>','to':[os.environ['ALERT_TO']],'subject':'⚠️ Already Here — endpoint DOWN','text':os.environ['BODY']}))" BODY="$BODY")" \
                && echo "alert email sent"
            fi
            exit 1
          fi
          echo "all endpoints healthy"
