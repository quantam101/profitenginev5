name: Uptime Monitor
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints and alert on failure
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: dispatch@alreadyherellc.com
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, datetime
          ENDPOINTS = [
              "https://api.alreadyherellc.com/api/health",
              "https://app.alreadyherellc.com",
              "https://profitengine-tau.vercel.app",
          ]
          down = []
          for u in ENDPOINTS:
              code = subprocess.run(["curl","-s","-o","/dev/null","-m","15","-L","-w","%{http_code}",u],
                                    capture_output=True, text=True).stdout.strip() or "000"
              print(f"{code}  {u}")
              if not code[:1] in ("2","3"):
                  down.append(f"{code}  {u}")
          if not down:
              print("all endpoints healthy")
              raise SystemExit(0)
          print("::warning::endpoints down: " + "; ".join(down))
          key = os.environ.get("RESEND_API_KEY", "").strip()
          if key:
              body = ("Uptime monitor detected DOWN endpoints (run %s):\n\n%s\n\nTime: %s UTC"
                      % (os.environ.get("RUN_ID",""), "\n".join(down),
                         datetime.datetime.utcnow().isoformat(timespec="seconds")))
              payload = json.dumps({
                  "from": "Uptime Monitor <dispatch@alreadyherellc.com>",
                  "to": [os.environ["ALERT_TO"]],
                  "subject": "ALERT: Already Here endpoint DOWN",
                  "text": body,
              }).encode()
              req = urllib.request.Request("https://api.resend.com/emails", data=payload, method="POST",
                  headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json",
                           "User-Agent": "already-here-llc-uptime/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("alert email sent, id=" + json.loads(r.read()).get("id",""))
              except Exception as e:
                  print("alert email FAILED:", e)
          raise SystemExit(1)
          PY
