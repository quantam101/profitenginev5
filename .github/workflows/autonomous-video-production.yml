name: Autonomous Video Production (YouTube)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate videos only (skip YouTube upload) — for previewing the engine'
        type: boolean
        default: false
  schedule:
    # Daily, 30 minutes after the article publisher's scheduled start.
    - cron: '35 7 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/autonomous-video-production.yml']

permissions:
  contents: read

concurrency:
  group: autonomous-video-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  VIDEO_OUTPUT_DIR: './videos/openmontage'

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip -qq
          pip install -q edge-tts google-auth-oauthlib google-auth-httplib2 google-api-python-client aiohttp yt-dlp

      - name: Mine trending topics (metadata-only, fails soft)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/find_trending.py || echo "trend mining failed — continuing with static programs"
          if [ -f trending_topics.json ]; then
            python scripts/trending_to_programs.py 3 || echo "trend conversion failed — continuing"
          fi

      - name: Generate videos (edge-tts VO + captions + motion + music)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AFFILIATE_LINKS: ${{ secrets.AFFILIATE_LINKS }}
        run: |
          python scripts/generate_shorts.py
          echo "=== generated files ==="
          ls -lh videos/openmontage/ || true

      - name: Test YouTube API connection
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -c "
          import os
          import json
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          # Test credentials
          creds_dict = {
              'type': 'authorized_user',
              'client_id': (os.getenv('YOUTUBE_CLIENT_ID') or '').strip().strip('﻿'),
              'client_secret': (os.getenv('YOUTUBE_CLIENT_SECRET') or '').strip().strip('﻿'),
              'refresh_token': (os.getenv('YOUTUBE_REFRESH_TOKEN') or '').strip().strip('﻿'),
          }
          # Debug (non-secret): lengths + id prefix to catch stale/malformed values
          cid = creds_dict['client_id']
          print(f'client_id len={len(cid)} head={cid[:14]}')
          print('secret len=%d rt len=%d' % (len(creds_dict['client_secret']), len(creds_dict['refresh_token'])))

          try:
              creds = Credentials.from_authorized_user_info(creds_dict)
              # Force a refresh to validate the client_id/secret/refresh_token chain.
              # Succeeds with any granted scope; videos.insert (next step) needs only
              # youtube.upload, so we do NOT require a read scope here.
              creds.refresh(Request())
              print('YouTube auth verified (access token minted)')

              # Best-effort channel readout; skipped quietly if the token is upload-only.
              try:
                  youtube = build('youtube', 'v3', credentials=creds)
                  response = youtube.channels().list(part='snippet', mine=True).execute()
                  if response.get('items'):
                      print(f'   Channel: {response[\"items\"][0][\"snippet\"].get(\"title\")}')
              except Exception as read_err:
                  print(f'   (channel read skipped — upload-only scope: {read_err})')
          except Exception as e:
              print(f'YouTube auth failed: {e}')
              exit(1)
          "

      - name: Upload to YouTube Shorts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -c "
          import os
          import json
          from pathlib import Path
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          # Load manifest
          with open('videos_manifest.json') as f:
              videos = json.load(f)

          creds_dict = {
              'type': 'authorized_user',
              'client_id': (os.getenv('YOUTUBE_CLIENT_ID') or '').strip().strip('﻿'),
              'client_secret': (os.getenv('YOUTUBE_CLIENT_SECRET') or '').strip().strip('﻿'),
              'refresh_token': (os.getenv('YOUTUBE_REFRESH_TOKEN') or '').strip().strip('﻿'),
          }

          creds = Credentials.from_authorized_user_info(creds_dict)
          if creds.expired:
              creds.refresh(Request())

          youtube = build('youtube', 'v3', credentials=creds)

          uploads = []
          for video in videos:
              try:
                  video_path = video['path']
                  if not Path(video_path).exists():
                      print(f'Video not found: {video_path}')
                      uploads.append({'program': video['program'], 'status': 'failed', 'error': 'Video file missing'})
                      continue

                  body = {
                      'snippet': {
                          'title': video['title'],
                          'description': video['description'],
                          'tags': ['affiliate', 'review', video['program']],
                          'categoryId': '22',
                      },
                      'status': {
                          'privacyStatus': 'public',
                          'madeForKids': False,
                      },
                  }

                  request = youtube.videos().insert(
                      part='snippet,status',
                      body=body,
                      media_body=MediaFileUpload(video_path, mimetype='video/mp4')
                  )

                  response = request.execute()
                  video_id = response['id']

                  uploads.append({
                      'program': video['program'],
                      'video_id': video_id,
                      'url': f'https://www.youtube.com/shorts/{video_id}',
                      'status': 'uploaded',
                      'expected_title': video['title'],
                      'expected_channel_id': response.get('snippet', {}).get('channelId', '')
                  })

                  prog = video['program']
                  print(f'YouTube upload accepted (public verification pending): {prog}')
                  print(f'   Video ID: {video_id}')
                  print(f'   URL: https://www.youtube.com/shorts/{video_id}')

              except Exception as e:
                  prog = video['program']
                  print(f'Upload failed for {prog}: {e}')
                  uploads.append({
                      'program': video['program'],
                      'status': 'failed',
                      'error': str(e)
                  })

          ok_count = sum(1 for u in uploads if u['status'] == 'uploaded')
          print(f'\\nCampaign complete: {ok_count}/{len(uploads)} uploaded')

          with open('youtube_uploads.json', 'w') as f:
              json.dump(uploads, f, indent=2)
          "

      - name: Publish assets publicly + post to Instagram/Facebook (fails soft)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          TAG="videos-$(date +%Y%m%d-%H%M%S)"
          # profitenginev5 is private → host MP4s on the public content repo so IG/FB can fetch them
          if gh release create "$TAG" videos/openmontage/*.mp4 -R quantam101/content \
               --title "Video assets $TAG" --notes "Public assets for automated social posting"; then
            export ASSET_BASE="https://github.com/quantam101/content/releases/download/$TAG"
            python -c "
          import json, os
          from pathlib import Path
          vids = json.loads(Path('videos_manifest.json').read_text())
          for v in vids:
              v['url'] = os.environ['ASSET_BASE'] + '/' + Path(v['path']).name
          Path('videos_manifest.json').write_text(json.dumps(vids, indent=2))
          print('urls injected for', len(vids), 'videos')
          "
            python scripts/post_social.py || echo "social posting failed — YouTube uploads unaffected"
          else
            echo "release create failed — skipping IG/FB posting"
          fi

      - name: Repost own top performer (fails soft)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/repost_top.py || echo "repost failed — new posts unaffected"

      - name: Verify public YouTube publication
        if: ${{ github.event.inputs.dry_run != 'true' }}
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.youtube_publication import canonical_video_url, public_video_metadata

          path = Path('youtube_uploads.json')
          uploads = json.loads(path.read_text())
          deadline = time.monotonic() + 210
          pending = [u for u in uploads if u.get('status') == 'uploaded']
          while pending and time.monotonic() < deadline:
              for item in list(pending):
                  if time.monotonic() >= deadline:
                      break
                  url = canonical_video_url(item)
                  metadata = public_video_metadata(url, timeout=8)
                  expected = item.get('expected_title', '')
                  if metadata and expected and metadata.get('title') == expected:
                      item.update(status='success', url=url, verified_public=True,
                                  verified_public_at=datetime.now(timezone.utc).isoformat(),
                                  verified_title=metadata['title'])
                      pending.remove(item)
              if pending and time.monotonic() < deadline:
                  time.sleep(10)
          for item in pending:
              item['status'] = 'unverified'
              item['error'] = 'Public accessibility or expected video identity could not be verified'
          path.write_text(json.dumps(uploads, indent=2))
          verified = sum(u.get('status') == 'success' for u in uploads)
          print(f'Public YouTube videos verified: {verified}/{len(uploads)}')
          if not uploads or verified != len(uploads):
              raise SystemExit('Video publication incomplete. Inspect youtube_uploads.json; do not blindly re-upload existing IDs.')
          PY

      - name: Extract preview frames + contact sheet
        if: always()
        run: |
          mkdir -p videos/preview
          for f in videos/openmontage/*.mp4; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .mp4)
            dur=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$f" 2>/dev/null | cut -d. -f1)
            dur=${dur:-20}
            # 4 evenly-spaced frames + a 2x2 contact sheet per video
            i=0
            for pct in 12 38 62 88; do
              t=$(( dur * pct / 100 ))
              ffmpeg -v error -y -ss "$t" -i "$f" -frames:v 1 -q:v 3 "videos/preview/${base}_f${i}.jpg" || true
              i=$((i+1))
            done
            ffmpeg -v error -y -i "$f" -vf "fps=1/max(1\,$((dur/4))),scale=540:-1,tile=2x2" -frames:v 1 -q:v 3 "videos/preview/${base}_sheet.jpg" || true
          done
          echo "=== preview frames ==="; ls -lh videos/preview/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-uploads
          path: |
            videos/openmontage/*.mp4
            videos/preview/*.jpg
            videos_manifest.json
            youtube_uploads.json
            trending_topics.json
            trending_programs.json
            social_posts.json
          retention-days: 30

      - name: Report results
        if: always()
        run: |
          echo "=== VIDEO PIPELINE RESULTS ==="
          echo ""
          if [ -f "youtube_uploads.json" ]; then
            echo "YouTube Shorts Uploaded:"
            cat youtube_uploads.json | jq -r '.[] | select(.status=="success") | "  \(.program): https://www.youtube.com/shorts/\(.video_id)"'
          fi
          echo ""
          ls -lh videos/openmontage/*.mp4 2>/dev/null | awk '{print "  " $9 " (" $5 ")"}'
