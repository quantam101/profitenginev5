name: Health Check - Runtime API (Every 5 Minutes)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: runtime-health-check
  cancel-in-progress: true

env:
  RUNTIME_API_URL: ${{ vars.RUNTIME_API_URL || secrets.RUNTIME_API_URL || 'https://api.profitengine.alreadyherellc.com' }}

jobs:
  check:
    name: Runtime API Health
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Runtime API health
        id: health
        shell: bash
        run: |
          set -euo pipefail
          BASE="${RUNTIME_API_URL%/}"
          HEALTH_OK=false
          LAST_HTTP="000"
          LAST_PATH="/health"

          for path in /health /api/health; do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --connect-timeout 10 --max-time 15 "$BASE$path" || echo "000")
            LAST_HTTP="$HTTP_CODE"
            LAST_PATH="$path"
            echo "Checked $BASE$path -> HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              if python3 - <<'PY'
          import json
          import sys
          try:
              data = json.load(open('/tmp/health.json', encoding='utf-8'))
          except Exception:
              sys.exit(1)
          ok = data.get('ok') is True or data.get('status') == 'ok'
          sys.exit(0 if ok else 1)
          PY
              then
                HEALTH_OK=true
                break
              fi
            fi
          done

          echo "http_code=$LAST_HTTP" >> "$GITHUB_OUTPUT"
          echo "path=$LAST_PATH" >> "$GITHUB_OUTPUT"
          echo "url=$BASE$LAST_PATH" >> "$GITHUB_OUTPUT"

          if [ "$HEALTH_OK" = "true" ]; then
            echo "Runtime API healthy."
            exit 0
          fi

          echo "Runtime API unhealthy: HTTP $LAST_HTTP at $BASE$LAST_PATH"
          exit 1

      - name: Alert on failure - open issue
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'runtime-critical',
              per_page: 1
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'CRITICAL: Runtime API Down - Auto-Recovery Started',
                body: `## Runtime API is unreachable

Endpoint: ${{ steps.health.outputs.url }}
HTTP Code: ${{ steps.health.outputs.http_code }}
Time: ${new Date().toISOString()}

### Revenue impact
- Newsletter publishing may fail
- Telegram daily digest may fail
- Backend AI operations may fail
- Lead capture email alerts may fail
- Vercel frontend may remain online while backend processing is down

### Auto-recovery actions
1. Dispatch OCI SSH recovery workflow with action=reboot
2. Escalation workflow checks health after the recovery window
3. If still down, escalation dispatches action=hard-restart

### Manual verification if automation fails
- Confirm OCI instance is running
- Confirm public IP / security list allows SSH from GitHub runners
- Confirm host firewall allows SSH
- Confirm OCI_SSH_KEY matches the opc user authorized_keys
- Confirm runtime service or Docker container is present

Assignee: @quantam101
Labels: runtime-critical, bug, P0`,
                labels: ['runtime-critical', 'bug', 'P0']
              });
            }

      - name: Trigger auto-recovery reboot
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'oci-auto-recovery.yml',
              ref: 'main',
              inputs: {
                action: 'reboot'
              }
            });
            console.log('Triggered OCI auto-recovery with action=reboot.');
