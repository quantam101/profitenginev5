name: OCI Auto-Recovery — Restart Runtime Instance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Recovery action'
        required: true
        default: 'reboot'
        type: choice
        options:
          - 'reboot'
          - 'start'
          - 'hard-restart'
          - 'status'
  workflow_call:
    inputs:
      action:
        description: 'Recovery action'
        required: false
        default: 'reboot'
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: oci-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: OCI Instance Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup OCI CLI
        run: |
          # Install OCI CLI
          curl -L -o oci-cli.zip https://github.com/oracle/oci-cli/releases/download/v3.41.0/oci-cli-v3.41.0-linux-x86_64.zip
          unzip -q oci-cli.zip
          sudo ./oci-cli/install.sh --accept-all-defaults

          # Verify installation
          oci --version

      - name: Configure OCI Credentials
        run: |
          # Create OCI config directory
          mkdir -p ~/.oci

          # Write config file
          cat > ~/.oci/config << 'OCIEOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          OCIEOF

          # Write private key
          cat > ~/.oci/oci_api_key.pem << 'KEYEOF'
          ${{ secrets.OCI_PRIVATE_KEY }}
          KEYEOF

          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config

          # Verify credentials
          oci iam user get --user-id ${{ secrets.OCI_USER_OCID }} --query 'data.name' --raw-output

      - name: Get OCI Instance ID
        id: instance
        run: |
          # Find the instance by name
          INSTANCE_ID=$(oci compute instance list \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} \
            --region ${{ secrets.OCI_REGION }} \
            --query "data[?\"display-name\"=='profitenginev5-runtime'].id" \
            --raw-output)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "❌ Instance not found"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "✅ Instance ID: $INSTANCE_ID"

      - name: Check Current Instance Status
        id: status
        run: |
          STATE=$(oci compute instance get \
            --instance-id ${{ steps.instance.outputs.instance_id }} \
            --region ${{ secrets.OCI_REGION }} \
            --query 'data."lifecycle-state"' \
            --raw-output)

          echo "current_state=$STATE" >> $GITHUB_OUTPUT
          echo "Current state: $STATE"

      - name: Perform Recovery Action — Reboot
        if: inputs.action == 'reboot' || inputs.action == ''
        run: |
          if [ "${{ steps.status.outputs.current_state }}" != "RUNNING" ]; then
            echo "⚠️  Instance is not RUNNING (state: ${{ steps.status.outputs.current_state }})"
            echo "Switching to START action instead..."
            INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"

            echo "🔄 Starting instance..."
            oci compute instance action \
              --instance-id "$INSTANCE_ID" \
              --action START \
              --region ${{ secrets.OCI_REGION }} \
              --wait

            echo "✅ Instance started, waiting for boot..."
            sleep 30
          else
            INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"

            echo "🔄 Rebooting instance..."
            oci compute instance action \
              --instance-id "$INSTANCE_ID" \
              --action REBOOT \
              --region ${{ secrets.OCI_REGION }} \
              --wait

            echo "✅ Reboot initiated, waiting for restart..."
            sleep 30
          fi

      - name: Perform Recovery Action — Start
        if: inputs.action == 'start'
        run: |
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"

          if [ "${{ steps.status.outputs.current_state }}" = "RUNNING" ]; then
            echo "⚠️  Instance is already RUNNING, skipping start"
          else
            echo "🔄 Starting instance..."
            oci compute instance action \
              --instance-id "$INSTANCE_ID" \
              --action START \
              --region ${{ secrets.OCI_REGION }} \
              --wait

            echo "✅ Instance started"
            sleep 30
          fi

      - name: Perform Recovery Action — Hard Restart (Stop + Start)
        if: inputs.action == 'hard-restart'
        run: |
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"

          echo "⛔ HARD STOP..."
          oci compute instance action \
            --instance-id "$INSTANCE_ID" \
            --action STOP \
            --region ${{ secrets.OCI_REGION }} \
            --wait

          echo "Waiting 20 seconds before restart..."
          sleep 20

          echo "🔄 HARD START..."
          oci compute instance action \
            --instance-id "$INSTANCE_ID" \
            --action START \
            --region ${{ secrets.OCI_REGION }} \
            --wait

          echo "✅ Hard restart complete"
          sleep 30

      - name: Report Status
        if: inputs.action == 'status'
        run: |
          echo "Instance ID: ${{ steps.instance.outputs.instance_id }}"
          echo "Current State: ${{ steps.status.outputs.current_state }}"

      - name: Wait for Instance to Boot
        run: |
          echo "⏳ Waiting for instance to fully boot (up to 3 minutes)..."
          for i in {1..36}; do
            if curl -s -f -m 5 https://api.profitengine.alreadyherellc.com/health > /dev/null 2>&1; then
              echo "✅ Runtime API is responding!"
              exit 0
            fi
            echo "  Attempt $i/36: Still booting..."
            sleep 5
          done

          echo "⚠️  Instance booted but API not responding yet"
          exit 0  # Don't fail — instance may still be initializing

      - name: Verify Runtime API Health
        id: verify
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            https://api.profitengine.alreadyherellc.com/health)

          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "✅ Runtime API healthy: HTTP $HTTP_CODE"
            echo "recovery_success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Runtime API returned HTTP $HTTP_CODE (may still be initializing)"
            echo "recovery_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Report Success
        if: steps.verify.outputs.recovery_success == 'true'
        uses: actions/github-script@v7
        env:
          ACTION: ${{ inputs.action || 'reboot' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Close any open runtime-critical issues
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'runtime-critical',
              per_page: 10
            });

            for (const issue of issues) {
              const action = process.env.ACTION || 'reboot';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **RESOLVED** — Runtime API is back online (HTTP 200)

**Recovery Action:** ${action}
**Time:** ${new Date().toISOString()}

Services resuming:
- ✅ Newsletter publishing
- ✅ Telegram daily digest
- ✅ Backend AI operations
- ✅ Lead capture alerts`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

      - name: Report Partial Recovery
        if: steps.verify.outputs.recovery_success == 'false'
        uses: actions/github-script@v7
        env:
          ACTION: ${{ inputs.action || 'reboot' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'runtime-critical',
              per_page: 1
            });

            if (issues.length > 0) {
              const action = process.env.ACTION || 'reboot';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `⚠️ **PARTIAL RECOVERY** — Instance restarted, API still initializing

**Recovery Action:** ${action}
**Status:** Instance is RUNNING, services initializing
**Time:** ${new Date().toISOString()}

ℹ️ Health check will continue monitoring. If API doesn't come online in 2 minutes,
we'll attempt a hard restart. Check the logs for details.`
              });
            }
