name: OCI Auto-Recovery - Restart Runtime Instance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Recovery action'
        required: true
        default: 'reboot'
        type: choice
        options:
          - 'reboot'
          - 'start'
          - 'hard-restart'
          - 'status'
  workflow_call:
    inputs:
      action:
        description: 'Recovery action'
        required: false
        default: 'reboot'
        type: string

permissions:
  contents: read

concurrency:
  group: oci-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: OCI Instance Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup OCI CLI
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install oci-cli
          oci --version

      - name: Configure OCI Credentials
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config << 'OCIEOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          OCIEOF

          cat > ~/.oci/oci_api_key.pem << 'KEYEOF'
          ${{ secrets.OCI_PRIVATE_KEY }}
          KEYEOF

          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config
          oci iam user get --user-id ${{ secrets.OCI_USER_OCID }} --query 'data.name' --raw-output

      - name: Get Instance ID
        id: instance
        run: |
          INSTANCE_ID=$(oci compute instance list \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} \
            --region ${{ secrets.OCI_REGION }} \
            --query "data[?\"display-name\"=='profitenginev5-runtime'].id" \
            --raw-output)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Instance ID: $INSTANCE_ID"

      - name: Check Instance Status
        id: status
        run: |
          STATE=$(oci compute instance get \
            --instance-id ${{ steps.instance.outputs.instance_id }} \
            --region ${{ secrets.OCI_REGION }} \
            --query 'data."lifecycle-state"' \
            --raw-output)
          echo "current_state=$STATE" >> $GITHUB_OUTPUT
          echo "Current state: $STATE"

      - name: Recovery Action - Reboot
        if: inputs.action == 'reboot' || inputs.action == ''
        run: |
          if [ "${{ steps.status.outputs.current_state }}" != "RUNNING" ]; then
            echo "Instance not running. Starting instead..."
            oci compute instance action \
              --instance-id "${{ steps.instance.outputs.instance_id }}" \
              --action START \
              --region ${{ secrets.OCI_REGION }} \
              --wait
            sleep 30
          else
            oci compute instance action \
              --instance-id "${{ steps.instance.outputs.instance_id }}" \
              --action REBOOT \
              --region ${{ secrets.OCI_REGION }} \
              --wait
            sleep 30
          fi

      - name: Recovery Action - Start
        if: inputs.action == 'start'
        run: |
          if [ "${{ steps.status.outputs.current_state }}" != "RUNNING" ]; then
            oci compute instance action \
              --instance-id "${{ steps.instance.outputs.instance_id }}" \
              --action START \
              --region ${{ secrets.OCI_REGION }} \
              --wait
            sleep 30
          else
            echo "Instance already running"
          fi

      - name: Recovery Action - Hard Restart
        if: inputs.action == 'hard-restart'
        run: |
          oci compute instance action \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --action STOP \
            --region ${{ secrets.OCI_REGION }} \
            --wait
          sleep 20
          oci compute instance action \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --action START \
            --region ${{ secrets.OCI_REGION }} \
            --wait
          sleep 30

      - name: Report Status
        if: inputs.action == 'status'
        run: |
          echo "Instance ID: ${{ steps.instance.outputs.instance_id }}"
          echo "Current State: ${{ steps.status.outputs.current_state }}"

      - name: Wait for API Health
        run: |
          echo "Waiting for Runtime API to respond..."
          for i in {1..36}; do
            if curl -s -f -m 5 https://api.profitengine.alreadyherellc.com/health > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            echo "Attempt $i/36: Still waiting..."
            sleep 5
          done
          echo "API not responding yet (may still be initializing)"
