name: OCI Auto-Recovery (SSH) - Instance Recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Recovery action'
        required: true
        default: 'reboot'
        type: choice
        options:
          - 'reboot'
          - 'restart-docker'
          - 'status'
  workflow_call:
    inputs:
      action:
        description: 'Recovery action'
        required: false
        default: 'reboot'
        type: string

permissions:
  contents: read

concurrency:
  group: oci-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: OCI Instance Recovery (SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate SSH Key Secret
        run: |
          if [ -z "${{ secrets.OCI_SSH_KEY }}" ]; then
            echo "❌ BLOCKING: OCI_SSH_KEY secret is not configured"
            echo "Add the private key to GitHub Secrets → Settings → Secrets and variables → Actions"
            echo "Secret name: OCI_SSH_KEY"
            exit 1
          fi
          echo "✅ SSH key secret is configured"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/deploy_key << 'SSHEOF'
          ${{ secrets.OCI_SSH_KEY }}
          SSHEOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 129.146.167.73 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 opc@129.146.167.73 "echo 'SSH connection successful' && uptime"

      - name: Recovery Action - Restart Docker
        if: inputs.action == 'restart-docker' || inputs.action == 'reboot'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 opc@129.146.167.73 << 'EOF'
          set -e
          echo "Checking Docker status..."
          docker ps > /dev/null 2>&1 || true
          echo "Restarting runtime container..."
          docker ps -a | grep runtime && docker restart $(docker ps -a | grep runtime | awk '{print $1}') || echo "Runtime container not found"
          echo "Waiting for recovery..."
          sleep 10
          EOF

      - name: Recovery Action - Full Reboot
        if: inputs.action == 'reboot'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 opc@129.146.167.73 << 'EOF'
          set -e
          echo "Initiating system reboot..."
          sudo shutdown -r +1 "Automated recovery reboot" || sudo reboot
          EOF
          echo "Reboot initiated. Waiting 90 seconds for system to come back online..."
          sleep 90

      - name: Check Instance Status
        if: inputs.action == 'status'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 opc@129.146.167.73 << 'EOF'
          echo "Instance Status Report"
          echo "======================"
          echo "Hostname: $(hostname)"
          echo "Uptime: $(uptime)"
          echo ""
          echo "Docker Status:"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          echo ""
          echo "Memory:"
          free -h | grep Mem
          echo ""
          echo "Disk:"
          df -h / | tail -1
          EOF

      - name: Verify API Recovery
        if: inputs.action != 'status'
        run: |
          echo "Waiting for Runtime API to respond..."
          for i in {1..36}; do
            if curl -s -f -m 5 https://api.profitengine.alreadyherellc.com/health > /dev/null 2>&1; then
              echo "✅ API is healthy!"
              exit 0
            fi
            echo "Attempt $i/36: Still waiting..."
            sleep 5
          done
          echo "⚠️ API not responding yet (may still be initializing)"

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
