name: Ops Monitor — Daily Health & Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: ops-monitor
  cancel-in-progress: false

jobs:
  healthcheck:
    name: Service Health + Revenue Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report: ${{ steps.report.outputs.report }}
      all_healthy: ${{ steps.report.outputs.all_healthy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all endpoints
        id: checks
        run: |
          check() {
            local name=$1 url=$2
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
            if [[ "$code" =~ ^2 ]]; then
              echo "OK|${name}|${code}|${url}"
            else
              echo "FAIL|${name}|${code}|${url}"
            fi
          }

          {
            check "ProfitEngine Web"    "https://profitengine-tau.vercel.app"
            check "ProfitEngine API"    "https://profitengine-tau.vercel.app/api/health"
            check "TokenForge API"      "https://api.alreadyherellc.com/api/health"
            check "TokenForge Frontend" "https://forge.alreadyherellc.com"
            check "Tradegate2"          "https://tradegate2.vercel.app"
            check "Content Repo"        "https://quantam101.github.io/content/"
            check "OCI Health Probe"    "http://129.146.167.73/health"
          } | tee /tmp/health_results.txt

      - name: Build daily report
        id: report
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, subprocess, datetime

          results = open('/tmp/health_results.txt').read().strip().split('\n')

          rows = []
          failures = []
          for line in results:
              if not line.strip():
                  continue
              parts = line.split('|')
              if len(parts) < 4:
                  continue
              status, name, code, url = parts
              ok = status == 'OK'
              rows.append({'name': name, 'ok': ok, 'code': code, 'url': url})
              if not ok:
                  failures.append(name)

          all_healthy = len(failures) == 0

          # Stripe revenue snapshot (optional)
          revenue_block = ''
          stripe_key = os.environ.get('STRIPE_SECRET_KEY', '')
          if stripe_key and stripe_key.startswith('sk_'):
              try:
                  import urllib.request, urllib.parse
                  now = int(datetime.datetime.utcnow().timestamp())
                  start_30d = now - 30 * 86400
                  req = urllib.request.Request(
                      f'https://api.stripe.com/v1/charges?created[gte]={start_30d}&limit=100',
                      headers={'Authorization': f'Bearer {stripe_key}'}
                  )
                  resp = json.loads(urllib.request.urlopen(req, timeout=10).read())
                  total = sum(c['amount'] for c in resp.get('data', []) if c.get('paid')) / 100
                  revenue_block = f'\n**Revenue (last 30d):** ${total:,.2f}'
              except Exception as e:
                  revenue_block = f'\n**Revenue:** could not fetch ({e})'

          # Build markdown report
          date_str = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
          status_icon = '✅' if all_healthy else '🚨'

          lines = [
              f'## {status_icon} Daily Ops Report — {date_str}',
              '',
              '### Service Health',
              '',
              '| Service | Status | Code |',
              '|---------|--------|------|',
          ]
          for r in rows:
              icon = '✅' if r['ok'] else '❌'
              lines.append(f"| {r['name']} | {icon} {r['code']} | `{r['url']}` |")

          if failures:
              lines += ['', f'### ⚠️ Failures: {", ".join(failures)}', '']

          lines.append(revenue_block)

          lines += [
              '',
              '---',
              '_Auto-generated by ops-monitor.yml · Fix issues within 4h of alert_'
          ]

          report = '\n'.join(lines)
          print(report)

          # Write outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              # Escape for GitHub Actions
              escaped = report.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              f.write(f'report={escaped}\n')
              f.write(f'all_healthy={str(all_healthy).lower()}\n')
          PYEOF

      - name: Create issue on failure
        if: steps.report.outputs.all_healthy == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = decodeURIComponent(process.env.REPORT.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%'));
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ops-alert',
              per_page: 1
            });
            // Don't spam — only open one ops-alert at a time
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Ops Alert — Service Degradation ${new Date().toISOString().slice(0,10)}`,
                body: report,
                labels: ['ops-alert', 'bug']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: report
              });
            }
        env:
          REPORT: ${{ steps.report.outputs.report }}

      - name: Post daily digest comment (healthy)
        if: steps.report.outputs.all_healthy == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = decodeURIComponent(process.env.REPORT.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%'));
            // Find or create daily tracking issue
            const title = `📊 Ops Log ${new Date().toISOString().slice(0,7)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ops-log',
              per_page: 1
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: report
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `# Monthly Operations Log\n\nDaily health + revenue snapshots.\n\n---\n\n${report}`,
                labels: ['ops-log']
              });
            }
        env:
          REPORT: ${{ steps.report.outputs.report }}
