name: FYE pipeline run

# Approval-driven execution only. A merge or push must never double as
# authorization to generate/publish production content: jobs are created
# by the FYE control plane (scripts/fye_dispatch.py) after a Command OS
# approval, and dispatched here with job_id + approval_id + payload_hash.
# The worker re-verifies all three before rendering — this file must
# never gain a push/pull_request_target trigger on the production path.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Immutable FYE job id (fye-job-...)"
        required: true
      approval_id:
        description: "Command OS approval id authorizing this render"
        required: true
      payload_hash:
        description: "sha256 of the canonical dispatch payload"
        required: true
      # workflow_dispatch caps at 10 inputs — render params travel inside
      # one serialized JSON input the worker decodes and hash-verifies.
      payload:
        description: "JSON-encoded canonical render payload"
        required: true

# Least privilege: when explicit permissions are supplied, every
# unspecified permission becomes none — the worker reads the repo and
# nothing else. Elevation happens per-step only if ever required.
permissions:
  contents: read

# One job_id = one active worker. A duplicate dispatch of a running job
# waits behind the lease instead of rendering twice.
concurrency:
  group: fye-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  fye:
    name: "FYE job ${{ inputs.job_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DC_WEBHOOK_URL: ${{ secrets.DC_WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      GMAOS_PAID_ADAPTERS_ENABLED: ${{ secrets.GMAOS_PAID_ADAPTERS_ENABLED }}
      # Free-tier media sources: stock B-roll + HF TTS fallback.
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      FYE_TTS_VOICE: ${{ vars.FYE_TTS_VOICE || 'en-US-GuyNeural' }}
      # Resource controls (defaults in runtime/fye/config.py).
      FYE_RENDER_TIMEOUT_S: ${{ vars.FYE_RENDER_TIMEOUT_S || '1200' }}
      FYE_MAX_ARTIFACT_MB: ${{ vars.FYE_MAX_ARTIFACT_MB || '500' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ffmpeg is required for video compilation — the Sep 22 FYE runs
      # failed compliance with "master video missing or empty" because the
      # runner image lacks it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      # edge-tts neural voiceover (word timings for captions). Falls back
      # to HF TTS / silent track if the install or network fails.
      - name: Install edge-tts
        # Non-fatal: a failed install must not block the whole render —
        # the voiceover agent falls back to HF TTS, then a silent track.
        continue-on-error: true
        run: pip install edge-tts

      - name: Run FYE job (approval-verified, hash-checked, leased)
        # Inputs arrive through env vars, never inline in the script —
        # a crafted value (e.g. topic containing $(...)) stays data and
        # cannot execute inside the shell that holds the secrets.
        env:
          IN_JOB_ID: ${{ inputs.job_id }}
          IN_APPROVAL_ID: ${{ inputs.approval_id }}
          IN_PAYLOAD_HASH: ${{ inputs.payload_hash }}
          IN_PAYLOAD: ${{ inputs.payload }}
        run: |
          python scripts/fye_worker.py \
            --job-id "$IN_JOB_ID" \
            --approval-id "$IN_APPROVAL_ID" \
            --payload-hash "$IN_PAYLOAD_HASH" \
            --payload "$IN_PAYLOAD"

      - name: Upload job record + artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fye-job-${{ inputs.job_id }}
          path: |
            data/fye/jobs/${{ inputs.job_id }}.json
            data/fye/${{ inputs.job_id }}/
            data/fye/journal.jsonl
          if-no-files-found: warn
          retention-days: 14
