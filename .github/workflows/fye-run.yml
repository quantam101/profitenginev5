name: FYE pipeline run

on:
  # Queue-driven automatic runs: merge or push a JSON file into
  # fye-queue/ and the pipeline picks it up — no Actions-scope token
  # needed (a plain git push triggers this).
  push:
    branches: [main]
    paths: ["fye-queue/*.json"]
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (e.g. 'How compound interest actually works')"
        required: true
      niche:
        description: "Niche key for RPM priors (personal-finance, science-explainer, tech, ...)"
        required: false
        default: "science-explainer"
      title:
        description: "Optional video title"
        required: false
        default: ""
      human_reviewed:
        description: "Mark the package human-reviewed (per YouTube synthetic-media disclosure flow)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      monthly_views_target:
        description: "Planning-prior monthly views target"
        required: false
        default: "100000"
      subscribers:
        description: "Channel subscribers (for the YPP gate)"
        required: false
        default: "0"
      watch_hours:
        description: "Channel watch hours (for the YPP gate)"
        required: false
        default: "0"
      shorts_views:
        description: "Channel Shorts views (for the YPP gate)"
        required: false
        default: "0"

# Render free tier (512MB) OOM-kills the FYE subprocess + ffmpeg, so the
# pipeline runs here instead: free runners have ~7GB and ffmpeg preinstalled.
permissions:
  contents: write  # needed to push the processed/ archive commit
jobs:
  fye:
    name: "FYE run"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DC_WEBHOOK_URL: ${{ secrets.DC_WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      GMAOS_PAID_ADAPTERS_ENABLED: ${{ secrets.GMAOS_PAID_ADAPTERS_ENABLED }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run FYE pipeline
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS=(
              --topic "${{ inputs.topic }}"
              --niche "${{ inputs.niche }}"
              --monthly-views-target "${{ inputs.monthly_views_target }}"
              --subscribers "${{ inputs.subscribers }}"
              --watch-hours "${{ inputs.watch_hours }}"
              --shorts-views "${{ inputs.shorts_views }}"
            )
            [ -n "${{ inputs.title }}" ] && ARGS+=(--title "${{ inputs.title }}")
            [ "${{ inputs.human_reviewed }}" = "true" ] && ARGS+=(--human-reviewed)
            python scripts/fye_run.py "${ARGS[@]}"
          else
            # push trigger: run every queued request committed under fye-queue/
            python scripts/fye_queue.py run
          fi

      - name: Archive processed queue entries
        if: github.event_name == 'push' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fye-queue
          git diff --cached --quiet || {
            git commit -m "chore(fye-queue): archive processed requests [skip ci]"
            git push
          }

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fye-package-${{ github.run_id }}
          path: |
            data/fye/**/manifest.json
            data/fye/**/*.mp4
            data/fye/journal.jsonl
          if-no-files-found: warn
          retention-days: 14
