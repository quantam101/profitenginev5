name: OCI Recovery - Escalation (Hard Restart)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oci-recovery-escalate.yml'
  workflow_run:
    workflows: ['OCI Auto-Recovery - SSH-based Instance Recovery']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: oci-recovery-escalation
  cancel-in-progress: false

env:
  RUNTIME_API_URL: ${{ vars.RUNTIME_API_URL || secrets.RUNTIME_API_URL || 'https://api.profitengine.alreadyherellc.com' }}

jobs:
  workflow_guard:
    name: Workflow guard
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow has a runnable job
        run: echo "Escalation workflow loaded with a runnable guard job."

  check_if_escalation_needed:
    name: Check if escalation is needed
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Wait for initial recovery window
        run: |
          echo "Waiting 180 seconds for runtime services to settle after the initial recovery attempt."
          sleep 180

      - name: Check Runtime API health
        id: health
        shell: bash
        run: |
          set -euo pipefail
          BASE="${RUNTIME_API_URL%/}"
          for path in /health /api/health; do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --connect-timeout 10 --max-time 15 "$BASE$path" || echo "000")
            echo "Checked $BASE$path -> HTTP $HTTP_CODE"
            echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
            if [ "$HTTP_CODE" = "200" ]; then
              if python3 - <<'PY'
          import json
          import sys
          try:
              data = json.load(open('/tmp/health.json', encoding='utf-8'))
          except Exception:
              sys.exit(1)
          ok = data.get('ok') is True or data.get('status') == 'ok'
          sys.exit(0 if ok else 1)
          PY
              then
                echo "Runtime API is healthy after initial recovery. No escalation needed."
                exit 0
              fi
            fi
          done
          echo "Runtime API is still down after initial recovery. Escalating to hard restart."
          exit 1

      - name: Trigger hard restart escalation
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'oci-auto-recovery.yml',
              ref: 'main',
              inputs: {
                action: 'hard-restart'
              }
            });
            console.log('Escalated to hard restart recovery action.');

      - name: Report escalation
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'runtime-critical',
              per_page: 1
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Escalation: initial recovery failed, hard restart dispatched.

Previous action: reboot / restart-docker
New action: hard-restart
Time: ${new Date().toISOString()}

Hard restart forces a host reboot through the SSH recovery workflow. If this fails, verify OCI network access, host firewall, public IP, SSH key, and instance state manually.`
              });
            }
