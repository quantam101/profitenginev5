name: Beehiiv Newsletter Automation

on:
  push:
    paths:
      - 'products/*COMPLETE.txt'
  schedule:
    # Daily newsletter send at 6 AM MST (1 PM UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
  BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}

jobs:
  setup-welcome-sequence:
    runs-on: ubuntu-latest
    name: 📧 Setup Welcome Email Sequence
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create Welcome Sequence
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import json
          import requests

          API_KEY = os.environ.get('BEEHIIV_API_KEY')
          PUB_ID = os.environ.get('BEEHIIV_PUBLICATION_ID')

          if not API_KEY or not PUB_ID:
              print("⚠️ Beehiiv credentials not configured")
              exit(0)

          BASE_URL = 'https://api.beehiiv.com/v1'

          # Welcome sequence emails
          emails = [
              {
                  "subject": "Welcome to ProfitEngine 🚀",
                  "body": """Hi [SUBSCRIBER_NAME],

Welcome to our community!

I'm excited to share tools and strategies to help you build profitable businesses online.

Here's what you'll get from this newsletter:
✅ AI prompt libraries (100+ proven templates)
✅ Real estate copywriting templates
✅ Social media content calendars
✅ SEO strategies (100+ keywords)
✅ Print-on-demand design systems
✅ Affiliate recommendations (20-40% commissions)

All from our production-tested playbooks.

Download your free AI Business Prompt Pack (normally $27):
[https://gumroad.com/alreadyhere/ai-business-prompt-pack]

Talk soon,
[YOUR_NAME]

P.S. Tomorrow you'll get access to our complete Real Estate Kit.""",
                  "send_delay_seconds": 0
              },
              {
                  "subject": "Real Estate Scripts (100+ Templates)",
                  "body": """The Real Estate Copywriting Kit includes:
✅ 5 complete email sequences (21+ emails)
✅ 3 property listing templates
✅ 30 social media posts
✅ 8 objection handling scripts

These templates were tested with 100+ real estate agents.

Get it here: [https://gumroad.com/alreadyhere/real-estate]

Normally $19.""",
                  "send_delay_seconds": 86400  # 24 hours later
              },
              {
                  "subject": "Social Media Content for 90 Days (Done-For-You)",
                  "body": """The Social Media Content Engine includes:
✅ 90-day complete content calendar
✅ Platform-specific formulas (Instagram, TikTok, LinkedIn)
✅ 15 caption templates
✅ Batch creation guide (28 days of content in 4 hours)

Use it immediately - no writing needed.

Get it here: [https://gumroad.com/alreadyhere/social-media]

Normally $17.""",
                  "send_delay_seconds": 172800  # 48 hours later
              },
              {
                  "subject": "Design Prompts for AI (100+ Templates)",
                  "body": """The POD Design Prompt Bundle includes:
✅ 100+ AI art generation prompts
✅ Niche market analysis with sales potential
✅ Etsy optimization guide
✅ Design style variations

Create bestselling designs immediately.

Get it here: [https://gumroad.com/alreadyhere/pod-design]

Normally $22.""",
                  "send_delay_seconds": 259200  # 72 hours later
              },
              {
                  "subject": "SEO System (100+ Keywords + Implementation)",
                  "body": """The Programmatic SEO Starter Kit includes:
✅ 100+ ready-to-rank keywords
✅ 25 content outline prompts
✅ 20-point optimization checklist
✅ Schema markup templates (copy-paste ready)
