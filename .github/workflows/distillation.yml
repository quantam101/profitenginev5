name: Distillation Engine — Catch and Correct
on:
  push:
    paths: ["master_distillation/**", ".github/workflows/distillation.yml"]
  pull_request:
    paths: ["master_distillation/**", ".github/workflows/distillation.yml"]
permissions:
  contents: read
jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: master_distillation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check . && python -m ruff format --check .
      - run: OMP_NUM_THREADS=1 python -m pytest tests -q --junitxml=results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-results
          path: master_distillation/results.xml
