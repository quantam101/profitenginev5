name: Weekly Newsletter Digest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'   # Monday 13:00 UTC — day after Sunday's video production

permissions:
  contents: read
  actions: read   # gh run list/download of the production run's artifacts

jobs:
  compose-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Pull artifacts from latest video production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow=autonomous-video-production.yml \
            --status=success --limit 1 --json databaseId -q '.[0].databaseId' || echo "")
          if [ -n "$RUN_ID" ]; then
            echo "using production run $RUN_ID"
            # bounded: an unresponsive artifact download must not hang the job
            timeout 180 gh run download "$RUN_ID" -n youtube-uploads -D artifacts || true
            # flatten the files the composer reads into the workspace root
            find artifacts -name '*.json' -exec cp {} . \; 2>/dev/null || true
            ls -la *.json || true
          else
            echo "no successful production run found — composing from trends only"
          fi

      - name: Pull artifacts from latest passive-income run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow=passive-income-engine.yml \
            --status=success --limit 1 --json databaseId -q '.[0].databaseId' || echo "")
          if [ -n "$RUN_ID" ]; then
            echo "using passive-income run $RUN_ID"
            timeout 180 gh run download "$RUN_ID" -D pe-artifacts || true
            # surface the product manifests the composer scans
            find pe-artifacts -type d -name technical-products -exec cp -r {} . \; 2>/dev/null || true
            find pe-artifacts -name 'product.json' -o -name 'checkout.json' | head
          else
            echo "no successful passive-income run — no product section this issue"
          fi

      - name: Compose + deliver newsletter
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 || secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: python scripts/make_newsletter.py

      - name: Upload issue artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: newsletter.html
          retention-days: 60
