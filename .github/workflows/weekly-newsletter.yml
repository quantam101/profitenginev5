name: Weekly Newsletter Digest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'   # Monday 13:00 UTC — day after Sunday's video production

jobs:
  compose-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Pull artifacts from latest video production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow=autonomous-video-production.yml \
            --status=success --limit 1 --json databaseId -q '.[0].databaseId' || echo "")
          if [ -n "$RUN_ID" ]; then
            echo "using production run $RUN_ID"
            gh run download "$RUN_ID" -n youtube-uploads -D artifacts || true
            # flatten the files the composer reads into the workspace root
            find artifacts -name '*.json' -exec cp {} . \; 2>/dev/null || true
            ls -la *.json || true
          else
            echo "no successful production run found — composing from trends only"
          fi

      - name: Compose + deliver newsletter
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: python scripts/make_newsletter.py

      - name: Upload issue artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: newsletter.html
          retention-days: 60
