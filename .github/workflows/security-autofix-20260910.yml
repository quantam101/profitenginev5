name: Temporary security autofix

on:
  push:
    branches:
      - fix/ci-vercel-hardening-20260910
    paths:
      - .github/workflows/security-autofix-20260910.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-vercel-hardening-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply non-breaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify clean install
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Show remaining vulnerabilities
        run: npm audit --json || true
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): apply non-breaking npm security fixes"
          git push origin HEAD:fix/ci-vercel-hardening-20260910
