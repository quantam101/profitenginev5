name: Auto Product Upload - Gumroad & Etsy

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at midnight UTC

jobs:
  upload-products:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Upload products to Gumroad
        env:
          GUMROAD_API_TOKEN: ${{ secrets.GUMROAD_API_TOKEN }}
        run: |
          echo "📤 Uploading to Gumroad..."
          python scripts/upload_gumroad_products.py

      - name: Upload products to Etsy
        env:
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: |
          echo "📤 Uploading to Etsy..."
          python scripts/upload_etsy_products.py

      - name: Verify Printify Sync
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: |
          echo "🔗 Verifying Printify sync..."
          curl -s -H "Authorization: Bearer $PRINTIFY_API_TOKEN" \
            https://api.printify.com/v1/shops \
            | python -m json.tool || echo "Printify API check skipped"

      - name: Upload workflow summary
        if: always()
        run: |
          echo "✅ Product upload workflow completed"
          echo "- Gumroad: 6 digital products"
          echo "- Etsy: 8 POD products"
          echo "- Printify: Auto-sync enabled"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Product upload failed"
          echo "Check API tokens in GitHub Secrets:"
          echo "  - GUMROAD_API_TOKEN"
          echo "  - ETSY_ACCESS_TOKEN"
          echo "  - ETSY_SHOP_ID"
          echo "  - PRINTIFY_API_TOKEN (optional)"
          exit 1
