name: Autonomous Video Generation (Real)
# Schedule removed 2026-07-19: this duplicated autonomous-video-production.yml's
# Sunday 02:00 UTC cron (both uploaded to YouTube at the same time). The fuller
# production workflow keeps the cron; this one stays dispatch-only as a fallback.
on:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  VIDEO_OUTPUT_DIR: './videos/openmontage'

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip -qq
          pip install -q aiohttp google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Generate and upload videos
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python backend/services/autonomous_video_uploader_v2.py

      - name: Report results
        if: always()
        run: |
          echo "✅ Video generation and upload complete"
          ls -lh videos/openmontage/*.mp4 2>/dev/null || echo "No videos generated (FFmpeg may not be available in this environment)"

      - name: Send status notification
        if: always()
        run: |
          echo "Campaign execution: ${{ job.status }}"
          echo "Videos: videos/openmontage/"
