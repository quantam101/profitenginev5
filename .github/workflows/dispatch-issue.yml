name: Dispatch Issue (weekday newsletter)

# Weekday revenue-intelligence issue. Replaces weekly-newsletter.yml.
# compose → guard → deliver: the guard (scripts/newsletter-guard.mjs) is the
# only thing that can approve a send, its decision lands in the run summary,
# and a broken sourcing/compose step fails the job instead of going green.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compose + guard only; never email'
        required: false
        default: 'false'
      max_age_days:
        description: 'Oldest pipeline data (days) the guard will still send'
        required: false
        default: '2'
  schedule:
    - cron: '0 13 * * 1-5'   # weekdays 13:00 UTC, after the 07:35 UTC video run lands

permissions:
  contents: read
  actions: read   # gh run list/download of the source runs' artifacts

concurrency:
  group: dispatch-issue
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash   # -e -o pipefail
    env:
      NEWSLETTER_MAX_DATA_AGE_DAYS: ${{ github.event.inputs.max_age_days || '2' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Source pipeline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Required: the video-production run supplies youtube_uploads.json + trending_topics.json.
          PROD=$(gh run list --workflow=autonomous-video-production.yml \
            --status=success --limit 1 --json databaseId,createdAt,url)
          PROD_ID=$(jq -r '.[0].databaseId // empty' <<<"$PROD")
          if [ -z "$PROD_ID" ]; then
            echo "::error::no successful autonomous-video-production run — nothing to compose from"
            exit 1
          fi
          echo "production run $PROD_ID ($(jq -r '.[0].createdAt' <<<"$PROD"))"
          timeout 180 gh run download "$PROD_ID" -n youtube-uploads -D artifacts
          find artifacts -name '*.json' -exec cp {} . \;

          # Optional: newest passive-income run supplies technical-products/*/product.json.
          PE=$(gh run list --workflow=passive-income-engine.yml \
            --status=success --limit 1 --json databaseId,createdAt,url)
          PE_ID=$(jq -r '.[0].databaseId // empty' <<<"$PE")
          if [ -n "$PE_ID" ]; then
            echo "passive-income run $PE_ID ($(jq -r '.[0].createdAt' <<<"$PE"))"
            if timeout 180 gh run download "$PE_ID" -D pe-artifacts; then
              find pe-artifacts -type d -name technical-products -exec cp -r {} . \;
            else
              echo "::warning::passive-income artifact download failed — no product section this issue"
              PE='[]'
            fi
          else
            echo "::warning::no successful passive-income run — no product section this issue"
          fi

          jq -n --argjson prod "$PROD" --argjson pe "$PE" \
            '{items: ([($prod[0] // empty | . + {workflow:"autonomous-video-production.yml"}),
                       ($pe[0]   // empty | . + {workflow:"passive-income-engine.yml"})])}' \
            > source_runs.json
          jq -c . source_runs.json

      - name: Compose issue payload
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 || secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/make_newsletter.py compose --out issue.json
          test -s issue.json
          if ! jq -e '.dataDate | strings | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")' issue.json >/dev/null; then
            echo "::error::issue.json has no dataDate — sourcing did not record a run date"
            exit 1
          fi
          jq '{dataDate, fingerprint, opportunities: (.opportunities|length), signals: (.signals|length), previous}' issue.json

      - name: Guard decision
        id: guard
        run: |
          set -uo pipefail
          node scripts/newsletter-guard.mjs issue.json
          code=$?
          echo "guard exit $code"
          case "$code" in
            0) ;;                                   # send | brief → deliver step runs
            3|4) echo "::notice::newsletter skipped — see guard summary" ;;
            *) echo "::error::guard rejected the payload (exit $code)"; exit "$code" ;;
          esac

      - name: Deliver issue
        if: steps.guard.outputs.exit_code == '0' && github.event.inputs.dry_run != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          DECISION: ${{ steps.guard.outputs.decision }}
        run: |
          set -euo pipefail
          python scripts/make_newsletter.py deliver --issue issue.json --decision "$DECISION"

      - name: Dry run notice
        if: steps.guard.outputs.exit_code == '0' && github.event.inputs.dry_run == 'true'
        run: echo "::notice::dry run — guard said '${{ steps.guard.outputs.decision }}' but nothing was emailed"

      - name: Upload issue artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: |
            issue.json
            source_runs.json
            newsletter.html
          if-no-files-found: ignore
          retention-days: 60
