name: SSH Key Recovery (one-shot)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH keys to authorized_keys
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PUB_KEY: "ssh-rsa  oci_cmdos_oci-stephen"
          DEVIN_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPp2I2ngE5QRsB9HyLbZCpxBwylhntz7IaElLbcto2FU devin-deploy-profitenginev5"
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key ubuntu@129.146.167.73 "mkdir -p ~/.ssh && chmod 700 ~/.ssh && echo 'ssh-rsa  oci_cmdos_oci-stephen' >> ~/.ssh/authorized_keys && echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPp2I2ngE5QRsB9HyLbZCpxBwylhntz7IaElLbcto2FU devin-deploy-profitenginev5' >> ~/.ssh/authorized_keys && sort -u ~/.ssh/authorized_keys -o ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo DONE && cat ~/.ssh/authorized_keys"
          rm -f /tmp/deploy_key