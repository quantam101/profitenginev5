name: SSH Key Recovery (one-shot)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH keys using OCI_SSH_KEY
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          echo "$OCI_SSH_KEY" > /tmp/oci_key
          chmod 600 /tmp/oci_key
          echo "Key fingerprint:"
          ssh-keygen -l -f /tmp/oci_key
          echo "Attempting SSH..."
          ssh -v -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -i /tmp/oci_key ubuntu@129.146.167.73 "echo OK_IN && mkdir -p ~/.ssh && chmod 700 ~/.ssh && echo 'ssh-rsa  oci_cmdos_oci-stephen' >> ~/.ssh/authorized_keys && echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPp2I2ngE5QRsB9HyLbZCpxBwylhntz7IaElLbcto2FU devin-deploy-profitenginev5' >> ~/.ssh/authorized_keys && sort -u ~/.ssh/authorized_keys -o ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo KEYS_ADDED && cat ~/.ssh/authorized_keys" 2>&1
          rm -f /tmp/oci_key