name: SSH Key Recovery (one-shot)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH keys via base64-decoded SERVER_SSH_KEY
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          HOST=129.146.167.73
          STEPHEN_KEY="ssh-rsa  oci_cmdos_oci-stephen"
          DEVIN_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPp2I2ngE5QRsB9HyLbZCpxBwylhntz7IaElLbcto2FU devin-deploy-profitenginev5"

          # SERVER_SSH_KEY is base64-encoded — decode it first
          echo "Decoding SERVER_SSH_KEY from base64..."
          echo "$SERVER_SSH_KEY" | tr -d '[:space:]' | base64 -d > /tmp/server_key 2>&1 && echo "Decode OK" || echo "Decode failed"
          chmod 600 /tmp/server_key
          echo "Decoded key type:"
          file /tmp/server_key
          echo "Fingerprint:"
          ssh-keygen -l -f /tmp/server_key 2>&1 || true
          echo "First 40 chars decoded:"
          head -1 /tmp/server_key | cut -c1-40

          echo "Testing SERVER_SSH_KEY (decoded)..."
          if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 -i /tmp/server_key ubuntu@$HOST "echo SSH_OK" 2>&1; then
            echo "=== SUCCESS! Adding keys... ==="
            ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/server_key ubuntu@$HOST "
              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              echo '$STEPHEN_KEY' >> ~/.ssh/authorized_keys
              echo '$DEVIN_KEY' >> ~/.ssh/authorized_keys
              sort -u ~/.ssh/authorized_keys -o ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/authorized_keys
              echo KEYS_ADDED && wc -l ~/.ssh/authorized_keys && cat ~/.ssh/authorized_keys
            "
            exit 0
          fi

          echo "SERVER decoded failed. Trying OCI_SSH_KEY..."
          echo "$OCI_SSH_KEY" > /tmp/oci_key && chmod 600 /tmp/oci_key
          ssh -v -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 -i /tmp/oci_key ubuntu@$HOST "echo SSH_OK" 2>&1 | tail -20

          echo "Both failed."
          echo "SERVER decoded fingerprint:"
          ssh-keygen -l -f /tmp/server_key 2>&1 || true
          exit 1