name: SSH Key Recovery (one-shot)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Debug and recover SSH keys
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          # Try SERVER_SSH_KEY first with proper handling
          echo "$SERVER_SSH_KEY" > /tmp/server_key
          chmod 600 /tmp/server_key
          echo "--- SERVER_SSH_KEY header ---"
          head -1 /tmp/server_key
          echo "--- SERVER_SSH_KEY lines ---"
          wc -l /tmp/server_key
          file /tmp/server_key
          ssh-keygen -l -f /tmp/server_key 2>&1 || echo "server_key invalid"
          
          # Try OCI_SSH_KEY  
          echo "$OCI_SSH_KEY" > /tmp/oci_key
          chmod 600 /tmp/oci_key
          echo "--- OCI_SSH_KEY header ---"
          head -1 /tmp/oci_key
          ssh-keygen -l -f /tmp/oci_key 2>&1 || echo "oci_key invalid"
          
          # Try SSH with each key
          for key in /tmp/server_key /tmp/oci_key; do
            echo "=== Trying \ ==="
            ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 -i "\" ubuntu@129.146.167.73 "echo SUCCESS && hostname" 2>&1 && echo "KEY_WORKS: \" && break
          done