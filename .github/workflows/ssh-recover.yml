name: SSH Key Recovery (one-shot)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Brute-force remaining secrets
        env:
          ACTIONS_KEY: ${{ secrets.ACTIONS }}
          PROFIT_KEY: ${{ secrets.PROFIT }}
          TRADE_KEY: ${{ secrets.TRADE }}
          GH_PAT: ${{ secrets.GH_PAT_WRITE }}
        run: |
          HOST=129.146.167.73
          STEPHEN_KEY="ssh-rsa  oci_cmdos_oci-stephen"
          DEVIN_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPp2I2ngE5QRsB9HyLbZCpxBwylhntz7IaElLbcto2FU devin-deploy-profitenginev5"

          try_key() {
            local label="$1"
            local raw="$2"
            [ -z "$raw" ] && echo "$label: EMPTY" && return 1

            # Write raw
            printf '%s' "$raw" > /tmp/k && chmod 600 /tmp/k
            ftype=$(file /tmp/k | cut -d: -f2 | xargs)
            fp=$(ssh-keygen -l -f /tmp/k 2>&1 | head -1)
            echo "$label raw: $ftype | $fp"
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=8 -i /tmp/k ubuntu@$HOST "echo SSH_OK_$label" 2>/dev/null; then
              echo "SUCCESS: $label"
              ssh -o StrictHostKeyChecking=no -i /tmp/k ubuntu@$HOST "
                mkdir -p ~/.ssh && chmod 700 ~/.ssh
                echo '$STEPHEN_KEY' >> ~/.ssh/authorized_keys
                echo '$DEVIN_KEY' >> ~/.ssh/authorized_keys
                sort -u ~/.ssh/authorized_keys -o ~/.ssh/authorized_keys
                chmod 600 ~/.ssh/authorized_keys
                echo KEYS_ADDED && cat ~/.ssh/authorized_keys
              " && exit 0
            fi

            # Try echo (adds newline)
            echo "$raw" > /tmp/k2 && chmod 600 /tmp/k2
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=8 -i /tmp/k2 ubuntu@$HOST "echo SSH_OK_${label}_echo" 2>/dev/null; then
              echo "SUCCESS: $label (echo)"
              ssh -o StrictHostKeyChecking=no -i /tmp/k2 ubuntu@$HOST "
                mkdir -p ~/.ssh && chmod 700 ~/.ssh
                echo '$STEPHEN_KEY' >> ~/.ssh/authorized_keys
                echo '$DEVIN_KEY' >> ~/.ssh/authorized_keys
                sort -u ~/.ssh/authorized_keys -o ~/.ssh/authorized_keys
                chmod 600 ~/.ssh/authorized_keys
                echo KEYS_ADDED && cat ~/.ssh/authorized_keys
              " && exit 0
            fi

            # Try base64 decode
            echo "$raw" | tr -d '[:space:]' | base64 -d > /tmp/k3 2>/dev/null && chmod 600 /tmp/k3
            if [ -s /tmp/k3 ]; then
              ftype3=$(file /tmp/k3 | cut -d: -f2 | xargs)
              echo "$label b64-decoded: $ftype3"
              if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=8 -i /tmp/k3 ubuntu@$HOST "echo SSH_OK_${label}_b64" 2>/dev/null; then
                echo "SUCCESS: $label (b64)"
                ssh -o StrictHostKeyChecking=no -i /tmp/k3 ubuntu@$HOST "
                  mkdir -p ~/.ssh && chmod 700 ~/.ssh
                  echo '$STEPHEN_KEY' >> ~/.ssh/authorized_keys
                  echo '$DEVIN_KEY' >> ~/.ssh/authorized_keys
                  sort -u ~/.ssh/authorized_keys -o ~/.ssh/authorized_keys
                  chmod 600 ~/.ssh/authorized_keys
                  echo KEYS_ADDED && cat ~/.ssh/authorized_keys
                " && exit 0
              fi
            fi
            return 1
          }

          try_key "ACTIONS" "$ACTIONS_KEY" && exit 0
          try_key "PROFIT" "$PROFIT_KEY" && exit 0
          try_key "TRADE" "$TRADE_KEY" && exit 0

          echo "=== ALL SECRETS EXHAUSTED ==="
          exit 1