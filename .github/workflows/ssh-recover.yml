name: SSH Key Recovery (one-shot)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and recover
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          HOST=129.146.167.73
          STEPHEN_KEY="ssh-rsa  oci_cmdos_oci-stephen"
          DEVIN_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPp2I2ngE5QRsB9HyLbZCpxBwylhntz7IaElLbcto2FU devin-deploy-profitenginev5"
          
          try_key() {
            local keyfile="$1"
            local label="$2"
            echo "--- Testing $label ---"
            echo "Lines: $(wc -l < $keyfile)"
            echo "First line: $(head -1 $keyfile | cut -c1-40)"
            echo "File type: $(file $keyfile)"
            # Try direct
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 -i "$keyfile" ubuntu@$HOST "echo OK_$label" 2>&1; then
              echo "SUCCESS with $label"
              ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i "$keyfile" ubuntu@$HOST "
                mkdir -p ~/.ssh && chmod 700 ~/.ssh
                echo '$STEPHEN_KEY' >> ~/.ssh/authorized_keys
                echo '$DEVIN_KEY' >> ~/.ssh/authorized_keys
                sort -u ~/.ssh/authorized_keys -o ~/.ssh/authorized_keys
                chmod 600 ~/.ssh/authorized_keys
                echo KEYS_ADDED
                wc -l ~/.ssh/authorized_keys
              "
              return 0
            fi
            return 1
          }
          
          # Try SERVER_SSH_KEY as-is
          printf '%s' "$SERVER_SSH_KEY" > /tmp/s1 && chmod 600 /tmp/s1
          try_key /tmp/s1 "SERVER_raw" && exit 0
          
          # Try SERVER_SSH_KEY with newline fix
          echo "$SERVER_SSH_KEY" | sed 's/ /\n/g' | grep -v '^$' > /tmp/s2 && chmod 600 /tmp/s2
          try_key /tmp/s2 "SERVER_fixed" && exit 0
          
          # Try OCI_SSH_KEY as-is  
          echo "$OCI_SSH_KEY" > /tmp/o1 && chmod 600 /tmp/o1
          try_key /tmp/o1 "OCI_raw" && exit 0
          
          echo "All keys failed. Dumping key structures for analysis:"
          echo "SERVER_KEY char count: ${#SERVER_SSH_KEY}"
          echo "OCI_KEY char count: ${#OCI_SSH_KEY}"
          
          exit 1