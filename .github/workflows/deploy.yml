name: Deploy to OCI Server

on:
  workflow_dispatch:
    inputs:
      fresh_build:
        description: 'Rebuild images without cache after OCI access is restored'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  oci_preflight:
    name: OCI reachability gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check OCI HTTP and SSH reachability
        id: oci
        run: |
          HTTP_OK=false
          for i in 1 2 3; do
            if curl -sf --max-time 10 http://129.146.167.73/ >/dev/null 2>&1; then
              HTTP_OK=true
              break
            fi
            sleep 5
          done

          if [ "$HTTP_OK" = "true" ]; then
            echo "HTTP liveness: OK"
          else
            echo "::warning::OCI HTTP check failed for 129.146.167.73"
          fi

          echo "OCI deploy is currently manual-gated until SSH/network access is confirmed."
          echo "### OCI deployment gate" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP reachable: $HTTP_OK" >> "$GITHUB_STEP_SUMMARY"
          echo "SSH deployment is intentionally disabled in CI until host access is restored." >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel remains the primary production deployment path." >> "$GITHUB_STEP_SUMMARY"
