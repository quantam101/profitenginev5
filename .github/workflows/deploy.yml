name: Deploy to OCI Server

on:
  workflow_dispatch:
    inputs:
      fresh_build:
        description: 'Rebuild images without cache after OCI access is restored'
        required: false
        default: 'false'
        type: boolean
      oci_host:
        description: 'OCI public IP or DNS name to check'
        required: false
        default: '129.146.167.73'
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  DEFAULT_OCI_HOST: '129.146.167.73'

jobs:
  oci_preflight:
    name: OCI reachability gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      host: ${{ steps.check.outputs.host }}
      http_ok: ${{ steps.check.outputs.http_ok }}
      https_ok: ${{ steps.check.outputs.https_ok }}
      ssh_ok: ${{ steps.check.outputs.ssh_ok }}
      ready_for_ssh_deploy: ${{ steps.check.outputs.ready_for_ssh_deploy }}
    steps:
      - name: Check OCI HTTP, HTTPS, and SSH reachability
        id: check
        shell: bash
        run: |
          set -uo pipefail
          HOST="${{ github.event.inputs.oci_host }}"
          if [ -z "$HOST" ]; then HOST="$DEFAULT_OCI_HOST"; fi

          check_url() {
            local url="$1"
            for i in 1 2 3; do
              if curl -fsS --max-time 10 "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          check_tcp() {
            local host="$1"
            local port="$2"
            for i in 1 2 3; do
              if timeout 10 bash -c "</dev/tcp/$host/$port" >/dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          HTTP_OK=false
          HTTPS_OK=false
          SSH_OK=false

          if check_url "http://$HOST/"; then HTTP_OK=true; fi
          if check_url "https://$HOST/"; then HTTPS_OK=true; fi
          if check_tcp "$HOST" 22; then SSH_OK=true; fi

          READY=false
          if [ "$SSH_OK" = "true" ]; then READY=true; fi

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "http_ok=$HTTP_OK" >> "$GITHUB_OUTPUT"
          echo "https_ok=$HTTPS_OK" >> "$GITHUB_OUTPUT"
          echo "ssh_ok=$SSH_OK" >> "$GITHUB_OUTPUT"
          echo "ready_for_ssh_deploy=$READY" >> "$GITHUB_OUTPUT"

          echo "### OCI deployment gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Host: $HOST" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP reachable: $HTTP_OK" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTPS reachable: $HTTPS_OK" >> "$GITHUB_STEP_SUMMARY"
          echo "SSH reachable: $SSH_OK" >> "$GITHUB_STEP_SUMMARY"
          echo "Ready for SSH deploy: $READY" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$READY" != "true" ]; then
            echo "OCI is not reachable for automated SSH deployment. This workflow will exit successfully to prevent false production failures. Use scripts/oci-recover.sh from OCI console, serial console, or an already-authenticated shell to restore host reachability." >> "$GITHUB_STEP_SUMMARY"
          fi

  oci_recovery_instructions:
    name: OCI recovery instructions
    runs-on: ubuntu-latest
    needs: oci_preflight
    if: needs.oci_preflight.outputs.ready_for_ssh_deploy != 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Print deterministic recovery command
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Immediate OCI host repair path

          Automated deploy is blocked because SSH is not reachable from GitHub Actions.
          Run this on the OCI instance through console access or any working shell:

          ```bash
          curl -fsSL -o /tmp/oci-recover.sh https://raw.githubusercontent.com/quantam101/profitenginev5/main/scripts/oci-recover.sh
          sudo APP_DIR=/opt/profitenginev5 bash /tmp/oci-recover.sh
          ```

          If the app checkout is not in `/opt/profitenginev5`, replace `APP_DIR` with the real path before running.
          After recovery, re-run this workflow with the same host. If SSH becomes reachable, enable a credentialed deploy job using repository secrets for SSH identity; do not hardcode credentials.
          EOF

  deploy_blocked_until_ssh_restored:
    name: SSH deployment blocked until OCI access is restored
    runs-on: ubuntu-latest
    needs: [oci_preflight, oci_recovery_instructions]
    if: always() && needs.oci_preflight.outputs.ready_for_ssh_deploy != 'true'
    steps:
      - name: Exit cleanly with OCI blocked status
        run: |
          echo "OCI host ${{ needs.oci_preflight.outputs.host }} is not SSH reachable. Vercel remains primary production. OCI workflow is no longer a failing drift source."

  ssh_deploy:
    name: SSH deploy to OCI (git pull + restart)
    runs-on: ubuntu-latest
    needs: oci_preflight
    if: needs.oci_preflight.outputs.ready_for_ssh_deploy == 'true'
    env:
      OCI_HOST: ${{ needs.oci_preflight.outputs.host }}
      APP_DIR: /opt/profitenginev5
    steps:
      - name: Deploy via SSH — git pull + docker restart
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              -i /tmp/deploy_key opc@"${OCI_HOST}" \
              "set -e
               echo '=== locate app dir ==='
               APP_DIR=''
               for d in /opt/profitenginev5 /home/opc/profitenginev5 /home/ubuntu/profitenginev5 /opt/profitengine /srv/profitenginev5; do
                 if [ -d \"\$d/.git\" ]; then APP_DIR=\"\$d\"; break; fi
               done
               if [ -z \"\$APP_DIR\" ]; then
                 APP_DIR=\$(find /opt /srv /home -maxdepth 3 -name 'runtime' -type d 2>/dev/null | grep -E 'profitengine' | head -1 | xargs -r dirname || true)
               fi
               if [ -z \"\$APP_DIR\" ]; then
                 echo 'No existing checkout found — cloning fresh to /home/opc/profitenginev5'
                 git clone https://github.com/quantam101/profitenginev5.git /home/opc/profitenginev5
                 APP_DIR=/home/opc/profitenginev5
               fi
               echo \"APP_DIR=\$APP_DIR\"
               echo '=== git pull ==='
               git -C \${APP_DIR} fetch origin main
               git -C \${APP_DIR} reset --hard origin/main
               echo '=== restart service ==='
               if [ -f \${APP_DIR}/docker-compose.yml ]; then
                 # setsid+nohup so the build survives an SSH disconnect; tail the log until done
                 cd \${APP_DIR}
                 setsid nohup docker compose up -d --build > /tmp/deploy_build.log 2>&1 < /dev/null &
                 BUILD_PID=\$!
                 while kill -0 \$BUILD_PID 2>/dev/null; do sleep 15; echo \"[build] still running \$(date -u +%H:%M:%S)\"; done
                 tail -25 /tmp/deploy_build.log
               else
                 sudo systemctl restart profitengine-runtime 2>/dev/null || \
                 pkill -f 'uvicorn runtime' || true
                 sleep 2
                 cd \${APP_DIR} && nohup python3 -m uvicorn runtime.api:app \
                   --host 0.0.0.0 --port 8001 --log-level info \
                   > /tmp/runtime.log 2>&1 &
               fi
               echo '=== health check ==='
               sleep 5
               curl -fsS http://localhost:8001/health || \
               curl -fsS http://localhost:8000/health || echo 'health pending'"
          rm -f /tmp/deploy_key

      - name: Post-deploy health gate
        run: |
          sleep 10
          STATUS=$(curl -sf --max-time 15 \
            "https://api.profitengine.alreadyherellc.com/health" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if d.get('ok') else 'fail')" \
            2>/dev/null || echo "unreachable")
          echo "Runtime health post-deploy: $STATUS"
          if [ "$STATUS" = "ok" ]; then
            echo "::notice::OCI runtime healthy after deploy"
          else
            echo "::warning::OCI runtime health check returned $STATUS — may need a moment to start"
          fi
