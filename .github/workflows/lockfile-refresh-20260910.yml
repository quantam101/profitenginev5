name: Temporary security lockfile refresh

on:
  push:
    branches:
      - fix/ci-vercel-hardening-20260910
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-refresh-20260910
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-vercel-hardening-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Refresh lockfile without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile is internally consistent
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile for security patches"
          git push origin HEAD:fix/ci-vercel-hardening-20260910
