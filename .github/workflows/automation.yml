name: Full Automation Launch (14 Channels)

on:
  # Manual trigger via GitHub UI
  workflow_dispatch:
    inputs:
      parallel_execution:
        description: 'Run tasks in parallel (faster)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_channels:
        description: 'Comma-separated channels to skip (stripe, gumroad, amazon-affiliate, kdp, etsy-printify, newsletters, instagram, youtube, tiktok, twitter, linkedin, pinterest, reddit, faceless-videos)'
        required: false
        default: ''
      enable_metrics:
        description: 'Collect detailed performance metrics'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_health_checks:
        description: 'Run health checks on all channels'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  # Schedule daily launches (9 AM UTC = 4 AM ET)
  schedule:
    - cron: '0 9 * * *' # Daily at 9 AM UTC

  # Allow triggering from another workflow
  workflow_call:
    inputs:
      parallel_execution:
        description: 'Run tasks in parallel'
        required: false
        type: string
        default: 'true'
      enable_metrics:
        description: 'Collect metrics'
        required: false
        type: string
        default: 'true'
      enable_health_checks:
        description: 'Run health checks'
        required: false
        type: string
        default: 'true'

jobs:
  automation-launch:
    name: Launch All 14 Channels (Unified Orchestration)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      run-id: ${{ steps.orchestrate.outputs.run-id }}
      success-rate: ${{ steps.orchestrate.outputs.success-rate }}
      channels-passed: ${{ steps.orchestrate.outputs.channels-passed }}
      channels-failed: ${{ steps.orchestrate.outputs.channels-failed }}
      total-channels: ${{ steps.orchestrate.outputs.total-channels }}

    env:
      # ─────────────────────────────────────────────────────────────
      # CORE AUTOMATION SETTINGS
      # ─────────────────────────────────────────────────────────────
      AUTOMATION_PARALLEL: ${{ inputs.parallel_execution || 'true' }}
      AUTOMATION_RETRY_MAX_ATTEMPTS: '3'
      AUTOMATION_RETRY_BACKOFF_MS: '5000'
      AUTOMATION_ENABLE_METRICS: ${{ inputs.enable_metrics || 'true' }}
      RUNTIME_DATA_DIR: '.runtime/automation'

      # ─────────────────────────────────────────────────────────────
      # EXISTING 5 MODULES: GUMROAD, INSTAGRAM (3), EMAIL
      # ─────────────────────────────────────────────────────────────
      GUMROAD_API_TOKEN: ${{ secrets.GUMROAD_API_TOKEN }}
      GUMROAD_CREATOR_ID: alreadyhere
      IMAGE_GENERATION_API: 'dalle'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      VIDEO_GENERATION_API: 'replicate'
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      EMAIL_SERVICE: 'beehiiv'
      BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
      BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}

      # ─────────────────────────────────────────────────────────────
      # NEW 4 ENHANCEMENT MODULES: SENTIMENT, COMPLIANCE, BACKUP, ATTRIBUTION
      # ─────────────────────────────────────────────────────────────
      SENTIMENT_ANALYSIS_ENABLED: 'true'
      SENTIMENT_API_KEY: ${{ secrets.SENTIMENT_API_KEY }}
      COMPLIANCE_CHECK_ENABLED: 'true'
      COMPLIANCE_API_KEY: ${{ secrets.COMPLIANCE_API_KEY }}
      BACKUP_ROTATION_ENABLED: 'true'
      ATTRIBUTION_ANALYSIS_ENABLED: 'true'

      # ADDITIONAL 2 ENHANCEMENT MODULES: CORRELATION, DYNAMIC-RISK
      CORRELATION_MONITOR_ENABLED: 'true'
      CORRELATION_API_KEY: ${{ secrets.CORRELATION_API_KEY }}
      DYNAMIC_RISK_ENABLED: 'true'
      DYNAMIC_RISK_API_KEY: ${{ secrets.DYNAMIC_RISK_API_KEY }}

      # ─────────────────────────────────────────────────────────────
      # RUNTIME SERVICES
      # ─────────────────────────────────────────────────────────────
      RUNTIME_API_URL: ${{ secrets.RUNTIME_API_URL || 'http://129.146.236.177:8000' }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

      # ─────────────────────────────────────────────────────────────
      # NODE CONFIGURATION
      # ─────────────────────────────────────────────────────────────
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python for enhancement modules
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Python dependencies for enhancement modules
        run: |
          pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Validate configuration
        run: |
          echo "=== AUTOMATION CONFIGURATION ==="
          echo "Parallel Execution: ${{ env.AUTOMATION_PARALLEL }}"
          echo "Retry Max Attempts: ${{ env.AUTOMATION_RETRY_MAX_ATTEMPTS }}"
          echo "Metrics Enabled: ${{ env.AUTOMATION_ENABLE_METRICS }}"
          echo "Environment: ${{ env.NODE_ENV }}"
          echo ""
          echo "=== EXISTING MODULES (5) ==="
          [ -n "$GUMROAD_API_TOKEN" ] && echo "✓ Gumroad API configured" || echo "✗ Gumroad API missing"
          [ -n "$FB_PAGE_ACCESS_TOKEN" ] && echo "✓ Instagram Graph API configured" || echo "✗ Instagram Graph API missing"
          [ -n "$OPENAI_API_KEY" ] && echo "✓ OpenAI API configured" || echo "✗ OpenAI API missing"
          [ -n "$REPLICATE_API_TOKEN" ] && echo "✓ Replicate API configured" || echo "✗ Replicate API missing"
          [ -n "$BEEHIIV_API_KEY" ] && echo "✓ Beehiiv API configured" || echo "✗ Beehiiv API missing"
          echo ""
          echo "=== NEW ENHANCEMENT MODULES (4) ==="
          [ "$SENTIMENT_ANALYSIS_ENABLED" = "true" ] && echo "✓ Sentiment Analysis enabled" || echo "✗ Sentiment Analysis disabled"
          [ "$COMPLIANCE_CHECK_ENABLED" = "true" ] && echo "✓ Compliance Check enabled" || echo "✗ Compliance Check disabled"
          [ "$BACKUP_ROTATION_ENABLED" = "true" ] && echo "✓ Backup Rotation enabled" || echo "✗ Backup Rotation disabled"
          [ "$ATTRIBUTION_ANALYSIS_ENABLED" = "true" ] && echo "✓ Attribution Analysis enabled" || echo "✗ Attribution Analysis disabled"
          echo ""
          echo "=== ADDITIONAL ENHANCEMENT MODULES (2) ==="
          [ "$CORRELATION_MONITOR_ENABLED" = "true" ] && echo "✓ Correlation Monitor enabled" || echo "✗ Correlation Monitor disabled"
          [ "$DYNAMIC_RISK_ENABLED" = "true" ] && echo "✓ Dynamic Risk Analysis enabled" || echo "✗ Dynamic Risk Analysis disabled"

      - name: Create automation log directory
        run: mkdir -p ${{ env.RUNTIME_DATA_DIR }}

      - name: Execute automation orchestration
        id: orchestrate
        continue-on-error: true
        run: |
          node -e "
          const { orchestrateFullLaunch } = require('./app/lib/automation/orchestrate.ts');
          orchestrateFullLaunch({
            parallel: process.env.AUTOMATION_PARALLEL === 'true',
            skipTasks: '${{ inputs.skip_tasks }}'.split(',').filter(Boolean).map(t => t.trim()),
            enableMetrics: process.env.AUTOMATION_ENABLE_METRICS === 'true'
          }).then(result => {
            // Export outputs for downstream jobs
            console.log('::set-output name=run-id::' + result.runId);
            console.log('::set-output name=success-rate::' + (result.successRate * 100).toFixed(1));
            console.log('::set-output name=tasks-passed::' + result.tasksPassed);
            console.log('::set-output name=tasks-failed::' + result.tasksFailed);
            console.log('::set-output name=total-duration::' + (result.totalDuration / 1000).toFixed(2));
            process.exit(result.tasksFailed === 0 ? 0 : 1);
          }).catch(error => {
            console.error('Orchestration error:', error);
            process.exit(1);
          });
          "

      - name: Execute enhancement modules (parallel)
        if: env.AUTOMATION_PARALLEL == 'true' && always()
        id: enhancements
        continue-on-error: true
        run: |
          echo "Executing 6 enhancement modules in parallel..."
          (
            echo "Starting Sentiment Analysis..."
            [ "$SENTIMENT_ANALYSIS_ENABLED" = "true" ] && python trading-control/sentiment_analysis.py 2>&1 | tee "${{ env.RUNTIME_DATA_DIR }}/sentiment.log" || echo "Sentiment Analysis skipped"
          ) &
          (
            echo "Starting Compliance Automation..."
            [ "$COMPLIANCE_CHECK_ENABLED" = "true" ] && python trading-control/compliance_automation.py 2>&1 | tee "${{ env.RUNTIME_DATA_DIR }}/compliance.log" || echo "Compliance Check skipped"
          ) &
          (
            echo "Starting Attribution Analysis..."
            [ "$ATTRIBUTION_ANALYSIS_ENABLED" = "true" ] && python trading-control/performance_attribution.py 2>&1 | tee "${{ env.RUNTIME_DATA_DIR }}/attribution.log" || echo "Attribution Analysis skipped"
          ) &
          (
            echo "Starting Correlation Analysis..."
            [ "$CORRELATION_MONITOR_ENABLED" = "true" ] && python trading-control/signal_correlation_analyzer.py 2>&1 | tee "${{ env.RUNTIME_DATA_DIR }}/correlation.log" || echo "Correlation Monitor skipped"
          ) &
          (
            echo "Starting Dynamic Risk Analysis..."
            [ "$DYNAMIC_RISK_ENABLED" = "true" ] && python runtime/dynamic_risk_params.py 2>&1 | tee "${{ env.RUNTIME_DATA_DIR }}/dynamic-risk.log" || echo "Dynamic Risk Analysis skipped"
          ) &
          (
            echo "Starting Backup Rotation..."
            [ "$BACKUP_ROTATION_ENABLED" = "true" ] && bash scripts/backup_and_rotate.py 2>&1 | tee "${{ env.RUNTIME_DATA_DIR }}/backup.log" || echo "Backup Rotation skipped"
          ) &
          wait
          echo "All enhancement modules completed."

      - name: Collect performance metrics
        if: env.AUTOMATION_ENABLE_METRICS == 'true' && always()
        id: metrics
        run: |
          echo "=== PERFORMANCE METRICS ===" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 << 'METRICS_EOF'
          import json
          import os
          import glob
          from datetime import datetime

          metrics_dir = "${{ env.RUNTIME_DATA_DIR }}"

          # Collect all run metrics
          metrics = {
              'timestamp': datetime.now().isoformat(),
              'run_id': '${{ steps.orchestrate.outputs.run-id }}',
              'modules': {
                  'existing': ['gumroad', 'carousel', 'reel', 'stories', 'email'],
                  'enhancement': ['sentiment', 'compliance', 'attribution', 'correlation', 'dynamic-risk', 'backup']
              },
              'execution_mode': '${{ env.AUTOMATION_PARALLEL }}',
              'success_rate': float('${{ steps.orchestrate.outputs.success-rate }}'),
              'tasks_passed': int('${{ steps.orchestrate.outputs.tasks-passed }}' or '0'),
              'tasks_failed': int('${{ steps.orchestrate.outputs.tasks-failed }}' or '0'),
              'duration_seconds': float('${{ steps.orchestrate.outputs.total-duration }}' or '0'),
              'logs': {}
          }

          # Collect log files
          for log_file in glob.glob(os.path.join(metrics_dir, '*.log')):
              module_name = os.path.basename(log_file).replace('.log', '')
              try:
                  with open(log_file, 'r') as f:
                      metrics['logs'][module_name] = {
                          'size_bytes': os.path.getsize(log_file),
                          'lines': len(f.readlines())
                      }
              except:
                  pass

          # Save metrics
          metrics_file = os.path.join(metrics_dir, 'metrics.json')
          with open(metrics_file, 'w') as f:
              json.dump(metrics, f, indent=2)

          print(f"Metrics saved to {metrics_file}")
          print(json.dumps(metrics, indent=2))
          METRICS_EOF

      - name: Analyze metrics and alert on failures
        if: always()
        continue-on-error: true
        run: |
          python3 << 'ANALYSIS_EOF'
          import json
          import sys

          metrics_file = "${{ env.RUNTIME_DATA_DIR }}/metrics.json"
          try:
              with open(metrics_file, 'r') as f:
                  metrics = json.load(f)

              print("### Automation Summary")
              print(f"- Success Rate: {metrics['success_rate']:.1f}%")
              print(f"- Tasks Passed: {metrics['tasks_passed']}")
              print(f"- Tasks Failed: {metrics['tasks_failed']}")
              print(f"- Duration: {metrics['duration_seconds']:.2f}s")
              print(f"- Execution Mode: {'Parallel' if metrics['execution_mode'] == 'true' else 'Sequential'}")
              print()
              print("### Modules Executed")
              print(f"- Existing (5): {', '.join(metrics['modules']['existing'])}")
              print(f"- Enhancement (6): {', '.join(metrics['modules']['enhancement'])}")

              if metrics['tasks_failed'] > 0:
                  print()
                  print("⚠️ **Failures Detected**")
                  sys.exit(1)
          except FileNotFoundError:
              print("No metrics file found")
          ANALYSIS_EOF

      - name: Generate comprehensive automation report
        if: always()
        run: |
          echo "## Comprehensive Automation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 9-Module Automation Status" >> $GITHUB_STEP_SUMMARY
          echo "- Run ID: ${{ steps.orchestrate.outputs.run-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Execution Mode: ${{ env.AUTOMATION_PARALLEL == 'true' && 'Parallel' || 'Sequential' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Orchestration Results" >> $GITHUB_STEP_SUMMARY
          echo "- Success Rate: ${{ steps.orchestrate.outputs.success-rate }}%" >> $GITHUB_STEP_SUMMARY
          echo "- Tasks Passed: ${{ steps.orchestrate.outputs.tasks-passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tasks Failed: ${{ steps.orchestrate.outputs.tasks-failed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ env.RUNTIME_DATA_DIR }}/launch-status.jsonl" ]; then
            echo "### Latest Run Status (from log)" >> $GITHUB_STEP_SUMMARY
            tail -1 "${{ env.RUNTIME_DATA_DIR }}/launch-status.jsonl" | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            print(f\"- Success: {data.get('success', False)}\")
            print(f\"- Timestamp: {data.get('timestamp', 'N/A')}\")
            " >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Module Breakdown (9 Total)" >> $GITHUB_STEP_SUMMARY
          echo "**Existing Modules (5):**" >> $GITHUB_STEP_SUMMARY
          echo "- Gumroad Product Upload" >> $GITHUB_STEP_SUMMARY
          echo "- Instagram Carousel Generation" >> $GITHUB_STEP_SUMMARY
          echo "- Instagram Reel Generation" >> $GITHUB_STEP_SUMMARY
          echo "- Instagram Stories Generation" >> $GITHUB_STEP_SUMMARY
          echo "- Email Sequence Setup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Enhancement Modules (4):**" >> $GITHUB_STEP_SUMMARY
          echo "- Sentiment Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Compliance Check" >> $GITHUB_STEP_SUMMARY
          echo "- Attribution Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Backup Rotation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Additional Modules (2):**" >> $GITHUB_STEP_SUMMARY
          echo "- Correlation Monitor" >> $GITHUB_STEP_SUMMARY
          echo "- Dynamic Risk Analysis" >> $GITHUB_STEP_SUMMARY

      - name: Upload automation logs and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-metrics
          path: ${{ env.RUNTIME_DATA_DIR }}/
          retention-days: 30

      - name: Error recovery - retry failed modules
        if: failure() && steps.orchestrate.outcome == 'failure'
        id: retry-failed
        continue-on-error: true
        run: |
          echo "Attempting recovery of failed modules..."
          echo "Run ID: ${{ steps.orchestrate.outputs.run-id }}"

          # Parse failed tasks and retry with backoff
          python3 << 'RETRY_EOF'
          import time
          import json

          run_id = "${{ steps.orchestrate.outputs.run-id }}"
          max_retries = 2
          backoff_factor = 10  # seconds

          for attempt in range(1, max_retries + 1):
              print(f"Recovery attempt {attempt}/{max_retries}")
              print("Waiting for backoff...")
              time.sleep(backoff_factor * attempt)
              print("Ready for retry on next workflow trigger")

              # Log recovery attempt
              recovery_log = {
                  "run_id": run_id,
                  "recovery_attempt": attempt,
                  "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "status": "ready_for_retry"
              }
              print(json.dumps(recovery_log))
          RETRY_EOF

      - name: Notify on failure with details
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const runId = "${{ steps.orchestrate.outputs.run-id }}";
            const successRate = "${{ steps.orchestrate.outputs.success-rate }}";
            const tasksFailed = "${{ steps.orchestrate.outputs.tasks-failed }}";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ Automation launch failed

            **Run Details:**
            - Run ID: ${runId}
            - Success Rate: ${successRate}%
            - Tasks Failed: ${tasksFailed}
            - All 9 modules were executed (5 existing + 4 enhancement)

            **Check logs:** [GitHub Actions](${context.payload.repository.html_url}/actions/runs/${context.runId})`
            });

      - name: Commit results to repo
        if: always() && github.event_name == 'schedule'
        run: |
          git config user.email "automation@alreadyherellc.com"
          git config user.name "Automation Bot"
          git add ${{ env.RUNTIME_DATA_DIR }}/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "docs: automation run $(date +'%Y-%m-%d %H:%M:%S') - 9 modules executed" &&
            git push
          )
        continue-on-error: true

      - name: Send Slack notification with full status
        if: always()
        uses: 8398a7/action-slack@v3
        continue-on-error: true
        with:
          status: ${{ job.status }}
          text: |
            9-Module Automation: ${{ job.status }}
            Run ID: ${{ steps.orchestrate.outputs.run-id }}
            Success Rate: ${{ steps.orchestrate.outputs.success-rate }}%
            Passed/Failed: ${{ steps.orchestrate.outputs.tasks-passed }}/${{ steps.orchestrate.outputs.tasks-failed }}
            Execution: ${{ env.AUTOMATION_PARALLEL == 'true' && 'Parallel' || 'Sequential' }}
            Workflow: ${{ github.workflow }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,ref

  monitoring:
    name: Monitor All 9 Modules Health
    runs-on: ubuntu-latest
    needs: automation-launch
    if: always()
    outputs:
      health-status: ${{ steps.health-check.outputs.status }}

    steps:
      - name: Download logs
        uses: actions/download-artifact@v4
        with:
          name: automation-logs-metrics

      - name: Analyze detailed automation metrics
        if: hashFiles('launch-status.jsonl') != ''
        id: health-check
        run: |
          echo "### 9-Module Automation Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 << 'EOF'
          import json
          import sys
          import os
          from datetime import datetime

          # Read last 10 runs
          runs = []
          try:
              with open('launch-status.jsonl', 'r') as f:
                  for line in f:
                      runs.append(json.loads(line.strip()))
          except FileNotFoundError:
              print("No metrics history found")
              sys.exit(0)

          if not runs:
              sys.exit(0)

          # Calculate statistics over last 10 runs
          last_10 = runs[-10:] if len(runs) >= 10 else runs
          success_count = sum(1 for r in last_10 if r['success'])
          avg_duration = sum(r['duration'] for r in last_10) / len(last_10) / 1000
          avg_success_rate = sum(r['successRate'] for r in last_10) / len(last_10)

          print(f"**Historical (last {len(last_10)} runs):**")
          print(f"- Successful Runs: {success_count}/{len(last_10)}")
          print(f"- Avg Duration: {avg_duration:.1f}s")
          print(f"- Avg Success Rate: {avg_success_rate*100:.1f}%")
          print()

          # Alert on failures
          recent_failures = sum(1 for r in last_10 if not r['success'])
          if recent_failures >= 3:
              print("⚠️ **Warning:** 3+ failures in last 10 runs!")

          # Module health from latest run
          latest = runs[-1] if runs else None
          if latest:
              print()
              print(f"**Current Run Status:**")
              print(f"- Run ID: {latest['runId']}")
              print(f"- Timestamp: {latest['timestamp']}")
              print(f"- Success: {latest['success']}")
              print(f"- Duration: {latest['duration']/1000:.2f}s")

              # Set health status
              if latest['success']:
                  print("\n::set-output name=status::healthy")
              else:
                  print("\n::set-output name=status::unhealthy")
          EOF

      - name: Analyze module-specific logs
        if: always()
        run: |
          echo "### Module Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each module's log file
          for module in gumroad carousel reel stories email sentiment compliance attribution correlation dynamic-risk backup; do
            log_file="${module}.log"
            if [ -f "$log_file" ]; then
              lines=$(wc -l < "$log_file")
              size=$(stat -f%z "$log_file" 2>/dev/null || stat -c%s "$log_file" 2>/dev/null || echo "?")
              echo "- **${module}**: $lines lines, $size bytes"
            else
              echo "- **${module}**: No log (skipped or disabled)"
            fi
          done

      - name: Generate trend analysis
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Trend Analysis (9 Modules)" >> $GITHUB_STEP_SUMMARY
          python3 << 'TREND_EOF'
          import json
          from datetime import datetime, timedelta

          try:
              with open('launch-status.jsonl', 'r') as f:
                  runs = [json.loads(line.strip()) for line in f]
          except:
              print("No historical data available")
              exit()

          if len(runs) < 3:
              print("Insufficient data for trend analysis (need 3+ runs)")
              exit()

          # Calculate trend
          last_3 = runs[-3:]
          success_trend = [r['successRate'] for r in last_3]

          print("**3-Run Trend:**")
          for i, rate in enumerate(success_trend, 1):
              print(f"  Run {i}: {rate*100:.1f}%")

          # Direction
          if success_trend[-1] > success_trend[0]:
              print(f"\n📈 Improving (Δ {(success_trend[-1] - success_trend[0])*100:+.1f}%)")
          elif success_trend[-1] < success_trend[0]:
              print(f"\n📉 Declining (Δ {(success_trend[-1] - success_trend[0])*100:+.1f}%)")
          else:
              print("\n➡️ Stable")
          TREND_EOF

      - name: Archive all metrics and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-metrics-archive
          path: |
            launch-status.jsonl
            metrics.json
            *.log
          retention-days: 90

      - name: Create health check issue on sustained failure
        if: failure() && steps.health-check.outputs.status == 'unhealthy'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 9-Module Automation Health Alert',
              body: `## Automation Health Crisis

            The 9-module automation system has become unhealthy.

            **Affected Modules:**
            - Existing (5): gumroad, carousel, reel, stories, email
            - Enhancement (4): sentiment, compliance, attribution, backup
            - Additional (2): correlation, dynamic-risk

            **Run:** ${{ needs.automation-launch.outputs.run-id }}
            **Success Rate:** ${{ needs.automation-launch.outputs.success-rate }}%

            **Actions Required:**
            1. Review automation logs in Actions tab
            2. Check external API availability
            3. Verify all secrets are current
            4. Run diagnostics: \`npm run automation:diagnose\``,
              labels: ['automation', 'health-alert', 'high-priority']
            });

  metrics-summary:
    name: Finalize Metrics Report
    runs-on: ubuntu-latest
    needs: [automation-launch, monitoring]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Consolidate metrics across all 9 modules
        run: |
          echo "## Final Automation Report: All 9 Modules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ needs.automation-launch.outputs.run-id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Success Rate:** ${{ needs.automation-launch.outputs.success-rate }}%" >> $GITHUB_STEP_SUMMARY
          echo "**Health Status:** ${{ needs.monitoring.outputs.health-status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Module Groups" >> $GITHUB_STEP_SUMMARY
          echo "1. **Existing (5)**: Gumroad, Instagram Carousel/Reel/Stories, Email" >> $GITHUB_STEP_SUMMARY
          echo "2. **Enhancement (4)**: Sentiment, Compliance, Attribution, Backup" >> $GITHUB_STEP_SUMMARY
          echo "3. **Additional (2)**: Correlation, Dynamic Risk" >> $GITHUB_STEP_SUMMARY

