name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  pre_merge:
    name: "Stage 1 — pre-merge (lint, unit, types)"
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install ruff pytest
      - name: Install Node deps
        run: npm ci --include=dev
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Ruff lint
        run: ruff check backend code_merger scripts/seo_content_quality.py tests/test_seo_content_quality.py

      - name: SEO content quality regression tests
        run: python -m pytest tests/test_seo_content_quality.py -q
      - name: Frontend lint
        run: npx --no-install eslint app/ lib/ --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Validate YAML
        run: npm run validate:yaml
      - name: Validate Revenue OS seed
        run: npm run validate:revenue-os
      - name: Unit tests
        run: npm run test:unit
      - name: Health contract test
        run: npm run test:integration
        env:
          CI: "true"
      - name: AI gateway test
        run: npm run test:ai-gateway
        env:
          CI: "true"
          GROQ_API_KEY: ""
      - name: Skill gateway test
        run: npm run test:skill-gateway
        env:
          CI: "true"
          GROQ_API_KEY: ""
      - name: Opportunity intelligence test
        run: npm run test:opportunity
        env:
          CI: "true"
      - name: Revenue OS tests
        run: npm run test:revenue-os
        env:
          CI: "true"
          MONGO_URL: "mongodb://127.0.0.1:27017"
          MONGODB_DB: "profitengine_ci"
      - name: Gateway evals
        run: |
          npm run eval:ai-gateway
          npm run eval:skill-gateway
        env:
          CI: "true"
          GROQ_API_KEY: ""
      - name: Runtime security scan
        run: |
          python - <<'PY'
          import sys
          from runtime.security_scanner import scan_repo
          findings = scan_repo('.')
          if findings:
              print('\n'.join(findings))
              sys.exit(1)
          print('runtime security scan passed')
          PY
      - name: Production build
        run: npm run build
        env:
          CI: "true"

  integration:
    name: "Stage 2 — integration (API + Mongo)"
    runs-on: ubuntu-latest
    needs: pre_merge
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: pip install -r backend/requirements.txt
      - name: Run contract tests
        env:
          MONGO_URL: "mongodb://127.0.0.1:27017"
          DB_NAME: "profitengine_ci"
          GROQ_API_KEY: ""
        run: python -m pytest backend/tests/test_distillation.py -v

  e2e:
    name: "Stage 3 — e2e (Playwright)"
    runs-on: ubuntu-latest
    needs: integration
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
          npm ci --include=dev
      - name: Boot backend
        env:
          MONGO_URL: "mongodb://127.0.0.1:27017"
          DB_NAME: "profitengine_ci"
          GROQ_API_KEY: ""
        run: |
          cd /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          nohup uvicorn backend.server:app --host 0.0.0.0 --port 8001 > backend.log 2>&1 &
          for i in {1..30}; do curl -fs http://127.0.0.1:8001/api/health && break; sleep 1; done
      - name: e2e smoke — backend health check
        run: |
          curl -fs http://127.0.0.1:8001/api/health | python -c "
          import sys, json
          d = json.load(sys.stdin)
          print('health:', json.dumps(d, indent=2))
          assert d.get('ok') == True or d.get('status') == 'ok', f'health check failed: {d}'
          print('e2e smoke: ok')
          "

  performance:
    name: "Stage 4 — performance (k6)"
    runs-on: ubuntu-latest
    needs: integration
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Boot backend
        env:
          MONGO_URL: "mongodb://127.0.0.1:27017"
          DB_NAME: "profitengine_ci"
          GROQ_API_KEY: ""
        run: |
          nohup uvicorn backend.server:app --host 0.0.0.0 --port 8001 > backend.log 2>&1 &
          for i in {1..30}; do curl -fs http://127.0.0.1:8001/api/health && break; sleep 1; done
      - name: Install k6
        run: |
          sudo gpg -k && sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - name: Run k6 smoke
        env:
          BASE_URL: "http://127.0.0.1:8001"
        run: k6 run ci/load_smoke.js

  deployment_gate:
    name: "Stage 5 — deployment gate"
    runs-on: ubuntu-latest
    needs: [e2e, performance]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Frontend deployment gate
        run: |
          npm ci --include=dev
          npm audit --omit=dev --audit-level=high
          npx --no-install eslint app/ lib/ --max-warnings=0
          npm run typecheck
          npm run build
      - name: Done
        run: echo "deployment gate passed"

  readiness:
    name: "Stage 6 — readiness gate"
    runs-on: ubuntu-latest
    needs: [deployment_gate]
    steps:
      - uses: actions/checkout@v5
      - run: echo "All gates passed. Ready to deploy."
