name: Daily Revenue Tracking

on:
  schedule:
    # Run daily at 9 AM UTC for consolidated report.
    # (The 4-hourly Gumroad log-only check was dropped 2026-07-19 — it produced
    # no artifacts and burned ~270 Actions min/mo; run it via dispatch if needed.)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hourly-check:
    name: Hourly Gumroad Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Fetch Gumroad hourly metrics
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests
          import json
          from datetime import datetime
          import os

          api_key = os.getenv("GUMROAD_ACCESS_TOKEN")
          if not api_key:
              print("⚠ GUMROAD_ACCESS_TOKEN not configured")
              exit(0)

          try:
              headers = {"Authorization": f"Bearer {api_key}"}
              response = requests.get(
                  "https://api.gumroad.com/v2/products",
                  headers=headers,
                  timeout=10
              )

              if response.status_code == 200:
                  products = response.json().get("products", [])

                  total_revenue = sum(p.get("revenue_in_last_24_hours", 0) for p in products)
                  total_sales = sum(p.get("sales_in_last_24_hours", 0) for p in products)

                  timestamp = datetime.utcnow().isoformat()

                  log_entry = {
                      "timestamp": timestamp,
                      "total_revenue_24h": total_revenue,
                      "total_sales_24h": total_sales,
                      "product_count": len(products)
                  }

                  print(f"✓ Gumroad Check - Revenue: ${total_revenue:.2f}, Sales: {total_sales}")
                  print(json.dumps(log_entry, indent=2))
              else:
                  print(f"✗ Gumroad API error: {response.status_code}")
          except Exception as e:
              print(f"✗ Error: {str(e)}")
          EOF

  daily-aggregation:
    name: Daily Revenue Aggregation
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv pydantic

      - name: Run daily revenue tracker
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          EMAIL_PLATFORM_API_KEY: ${{ secrets.EMAIL_PLATFORM_API_KEY }}
          AFFILIATE_API_KEY: ${{ secrets.AFFILIATE_API_KEY }}
          TRADING_API_KEY: ${{ secrets.TRADING_API_KEY }}
        run: |
          python3 scripts/daily_revenue_tracker.py

      - name: Sync Gumroad buyers to newsletter (post-purchase nurture)
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
        run: |
          python3 scripts/gumroad_buyers_to_beehiiv.py --days 7

      - name: Upload tracking report
        uses: actions/upload-artifact@v4
        with:
          name: daily-revenue-reports
          path: daily_revenue_*.json
          retention-days: 90

      - name: Generate markdown report
        run: |
          python3 << 'EOF'
          import json
          import glob
          from datetime import datetime

          # Find latest report
          reports = glob.glob("daily_revenue_*.json")
          if not reports:
              print("No reports found")
              exit(1)

          latest = sorted(reports)[-1]

          with open(latest, 'r') as f:
              data = json.load(f)

          # Generate markdown

          md = (
              f"# Daily Revenue Report\n\n"
              f"**Date:** {data.get('date')}\n"
              f"**Generated:** {datetime.utcnow().isoformat()}\n\n"
              f"## Summary\n"
              f"- **Total Revenue (24h):** ${data.get('consolidated', {}).get('total_revenue_24h', 0):.2f}\n"
              f"- **Active Streams:** {data.get('consolidated', {}).get('active_revenue_streams', 0)}/6\n\n"
              f"## Revenue Breakdown\n"
              f"| Stream | Revenue |\n"
              f"|--------|---------|\n"
          )

          for stream, amount in data.get('consolidated', {}).get('revenue_breakdown', {}).items():
              md += f"| {stream.capitalize()} | ${amount:.2f} |\n"

          if data.get('errors'):
              md += f"\n## Errors ({len(data['errors'])})\n"
              for error in data['errors']:
                  md += f"- {error}\n"

          with open('DAILY_REVENUE_REPORT.md', 'w') as f:
              f.write(md)

          print("✓ Markdown report generated")
          EOF

      - name: Get current date
        id: date
        run: echo "today=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Commit report to repository
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily revenue report for ${{ steps.date.outputs.today }}"
          file_pattern: "DAILY_REVENUE_REPORT.md daily_revenue_*.json"
          skip_fetch: false
          skip_checkout: false

  email-summary:
    name: Send Email Summary
    runs-on: ubuntu-latest
    needs: daily-aggregation
    if: github.event.schedule == '0 9 * * *'
    steps:
      - uses: actions/checkout@v4

      - name: Send daily summary email
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.DAILY_TRACKING_EMAIL }}
        run: |
          python3 << 'EOF'
          import requests
          import json
          import glob
          import os
          from datetime import datetime

          if not all([
              os.getenv("SENDGRID_API_KEY"),
              os.getenv("RECIPIENT_EMAIL")
          ]):
              print("⚠ Email configuration incomplete")
              exit(0)

          # Get latest report
          reports = glob.glob("daily_revenue_*.json")
          if not reports:
              exit(1)

          with open(sorted(reports)[-1], 'r') as f:
              data = json.load(f)

          consolidated = data.get('consolidated', {})

          # Build email
          email_body = (
              f"<h2>Daily Revenue Summary - {data.get('date')}</h2>"
              f"<p><strong>Total Revenue (24h):</strong> ${consolidated.get('total_revenue_24h', 0):.2f}</p>"
              '<table border="1" cellpadding="5">'
              "<tr><th>Revenue Stream</th><th>Amount</th></tr>"
          )

          for stream, amount in consolidated.get('revenue_breakdown', {}).items():
              email_body += f"<tr><td>{stream.capitalize()}</td><td>${amount:.2f}</td></tr>"

          email_body += "</table>"

          # Send via SendGrid
          try:
              import base64

              api_key = os.getenv("SENDGRID_API_KEY")
              recipient = os.getenv("RECIPIENT_EMAIL")

              # Using Python requests with SendGrid
              url = "https://api.sendgrid.com/v3/mail/send"
              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              }

              payload = {
                  "personalizations": [{
                      "to": [{"email": recipient}]
                  }],
                  "from": {"email": "noreply@alreadyherellc.com"},
                  "subject": f"Daily Revenue Report - {data.get('date')}",
                  "content": [{
                      "type": "text/html",
                      "value": email_body
                  }]
              }

              response = requests.post(url, json=payload, headers=headers)
              if response.status_code in [200, 202]:
                  print(f"✓ Email sent to {recipient}")
              else:
                  print(f"✗ Email failed: {response.status_code}")
          except Exception as e:
              print(f"✗ Email error: {str(e)}")
          EOF

  slack-notification:
    name: Send Slack Notification
    runs-on: ubuntu-latest
    needs: daily-aggregation
    if: github.event.schedule == '0 9 * * *'
    steps:
      - uses: actions/checkout@v4

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_REVENUE_ALERTS }}
        run: |
          python3 << 'EOF'
          import requests
          import json
          import glob
          import os

          slack_webhook = os.getenv("SLACK_WEBHOOK")
          if not slack_webhook:
              print("⚠ SLACK_WEBHOOK not configured")
              exit(0)

          # Get latest report
          reports = glob.glob("daily_revenue_*.json")
          if not reports:
              exit(1)

          with open(sorted(reports)[-1], 'r') as f:
              data = json.load(f)

          consolidated = data.get('consolidated', {})
          total_revenue = consolidated.get('total_revenue_24h', 0)

          # Build Slack message
          color = "good" if total_revenue > 100 else "warning" if total_revenue > 0 else "danger"

          slack_payload = {
              "attachments": [{
                  "color": color,
                  "title": f"Daily Revenue Report - {data.get('date')}",
                  "fields": [
                      {
                          "title": "Total Revenue (24h)",
                          "value": f"${total_revenue:.2f}",
                          "short": True
                      },
                      {
                          "title": "Active Streams",
                          "value": f"{consolidated.get('active_revenue_streams', 0)}/6",
                          "short": True
                      }
                  ]
              }]
          }

          # Add revenue breakdown
          breakdown_text = "\n".join([
              f"• {stream.capitalize()}: ${amount:.2f}"
              for stream, amount in consolidated.get('revenue_breakdown', {}).items()
          ])

          slack_payload["attachments"][0]["fields"].append({
              "title": "Breakdown",
              "value": breakdown_text,
              "short": False
          })

          # Send to Slack
          try:
              response = requests.post(slack_webhook, json=slack_payload)
              if response.status_code == 200:
                  print("✓ Slack notification sent")
              else:
                  print(f"✗ Slack error: {response.status_code}")
          except Exception as e:
              print(f"✗ Slack error: {str(e)}")
          EOF
