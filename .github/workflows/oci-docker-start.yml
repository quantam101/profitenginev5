name: OCI Docker Start - Revenue Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - status
          - restart
          - logs

permissions:
  contents: read

env:
  OCI_HOST: '129.146.236.177'
  OCI_USER: 'opc'
  APP_DIR: '/home/opc/profitenginev5'

jobs:
  oci_docker:
    name: OCI Docker Command
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CMDOS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $OCI_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute Docker Command
        run: |
          ACTION="${{ github.event.inputs.action }}"

          case "$ACTION" in
            start)
              ssh -i ~/.ssh/deploy_key $OCI_USER@$OCI_HOST << 'EOF'
          cd $APP_DIR
          docker compose up -d
          sleep 10
          docker compose ps
          curl -s http://localhost/health || echo "Health endpoint loading..."
          EOF
              ;;
            status)
              ssh -i ~/.ssh/deploy_key $OCI_USER@$OCI_HOST "cd $APP_DIR && docker compose ps"
              ;;
            restart)
              ssh -i ~/.ssh/deploy_key $OCI_USER@$OCI_HOST << 'EOF'
          cd $APP_DIR
          docker compose restart
          sleep 5
          docker compose ps
          EOF
              ;;
            logs)
              ssh -i ~/.ssh/deploy_key $OCI_USER@$OCI_HOST "cd $APP_DIR && docker compose logs --tail=50"
              ;;
          esac

      - name: Summary
        run: echo "✅ Docker command completed"
