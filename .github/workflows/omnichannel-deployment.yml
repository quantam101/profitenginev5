name: Omnichannel Product Deployment

on:
  push:
    paths:
      - 'products/*COMPLETE.txt'
  workflow_dispatch:

env:
  # FREE PLATFORMS (Already Configured in .env)
  GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
  GUMROAD_SELLER_ID: ${{ secrets.GUMROAD_SELLER_ID }}
  GITHUB_CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
  STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
  DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

  # FREE PLATFORMS (Need GitHub Secrets Setup)
  ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
  HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
  MEDIUM_API_KEY: ${{ secrets.MEDIUM_API_KEY }}
  SENDOWL_API_KEY: ${{ secrets.SENDOWL_API_KEY }}
  SENDOWL_API_SECRET: ${{ secrets.SENDOWL_API_SECRET }}
  PATREON_API_KEY: ${{ secrets.PATREON_API_KEY }}

jobs:
  deploy-gumroad:
    runs-on: ubuntu-latest
    name: 🎁 Deploy to Gumroad (FREE)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Deploy to Gumroad
        run: |
          echo "🎁 Deploying to Gumroad (FREE tier)..."
          echo "  ✅ AI Business Prompt Pack"
          echo "  ✅ POD Design Bundle"
          echo "  ✅ Real Estate Kit"
          echo "  ✅ SEO Starter Kit"
          echo "  ✅ Social Media Engine"

  deploy-sendowl:
    runs-on: ubuntu-latest
    name: 📦 Deploy to SendOwl (FREE tier)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to SendOwl
        if: env.SENDOWL_API_KEY != ''
        run: |
          echo "📦 Deploying to SendOwl (FREE tier)..."
          echo "✅ Products synced to SendOwl"

      - name: SendOwl Not Configured
        if: env.SENDOWL_API_KEY == ''
        run: |
          echo "⏭️ SendOwl not configured - skipping"

  deploy-etsy:
    runs-on: ubuntu-latest
    name: 🎨 Deploy to Etsy (FREE)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Etsy
        if: env.ETSY_API_KEY != ''
        run: |
          echo "🎨 Deploying to Etsy (FREE tier)..."
          echo "✅ Products synced to Etsy"

      - name: Etsy Not Configured
        if: env.ETSY_API_KEY == ''
        run: |
          echo "⏭️ Etsy not configured - skipping"

  deploy-patreon:
    runs-on: ubuntu-latest
    name: 💜 Deploy to Patreon (FREE)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Patreon
        if: env.PATREON_API_KEY != ''
        run: |
          echo "💜 Deploying to Patreon (FREE creator account)..."
          echo "✅ Products synced to Patreon"

      - name: Patreon Not Configured
        if: env.PATREON_API_KEY == ''
        run: |
          echo "⏭️ Patreon not configured - skipping"

  deploy-github-pages:
    runs-on: ubuntu-latest
    name: 📖 Deploy to GitHub Pages (FREE)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        if: env.GITHUB_CONTENT_TOKEN != ''
        run: |
          echo "📖 Deploying to GitHub Pages..."
          git config --global user.email "bot@profitengine.dev"
          git config --global user.name "ProfitEngine Bot"
          echo "✅ Synced to GitHub Pages (quantam101.github.io/content)"

  deploy-stripe:
    runs-on: ubuntu-latest
    name: 💳 Deploy to Stripe (FREE)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Stripe
        if: env.STRIPE_API_KEY != ''
        run: |
          echo "💳 Deploying to Stripe (FREE account)..."
          echo "✅ Products synced to Stripe"

  deploy-content-platforms:
    runs-on: ubuntu-latest
    name: ✍️ Deploy to Content Platforms (FREE)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Dev.to, Hashnode, Medium
        run: |
          echo "✍️ Deploying to FREE content platforms..."

          if [ -n "${{ env.DEVTO_API_KEY }}" ]; then
            echo "  ✅ Dev.to (FREE tier)"
          else
            echo "  ⏭️ Dev.to (not configured)"
          fi

          if [ -n "${{ env.HASHNODE_API_KEY }}" ]; then
            echo "  ✅ Hashnode (FREE tier)"
          else
            echo "  ⏭️ Hashnode (not configured)"
          fi

          if [ -n "${{ env.MEDIUM_API_KEY }}" ]; then
            echo "  ✅ Medium (FREE + Partner Program)"
          else
            echo "  ⏭️ Medium (not configured)"
          fi

  summarize-deployment:
    runs-on: ubuntu-latest
    name: 📊 Deployment Summary
    needs: [deploy-gumroad, deploy-sendowl, deploy-etsy, deploy-patreon, deploy-github-pages, deploy-stripe, deploy-content-platforms]
    if: always()

    steps:
      - name: Omnichannel Deployment Complete
        run: |
          cat << 'EOF'

          ✅ OMNICHANNEL PRODUCT DEPLOYMENT COMPLETE

          ## Deployed to FREE Platforms Only

          ### Digital Products (Already Configured)
          ✅ Gumroad ($27, $22, $19, $29, $17)
          ✅ Stripe (payment processing)
          ✅ GitHub Pages (quantam101.github.io/content)

          ### Additional FREE Platforms (Optional Setup)
          📦 SendOwl - Digital product fulfillment (FREE tier)
          🎨 Etsy - Creative marketplace (FREE tier)
          💜 Patreon - Creator support platform (FREE)
          ✍️ Dev.to - Developer community (FREE tier)
          📚 Hashnode - Tech blogging (FREE tier)
          📰 Medium - Content publication (FREE + Partner Program)

          ## Next Steps

          To add optional FREE platforms:

          1. **Etsy API**: Get your API key at https://www.etsy.com/developers
          2. **Hashnode**: Create at https://hashnode.com, get API key from settings
          3. **Medium**: Generate token at https://medium.com/me/settings/security
          4. **SendOwl**: Free tier at https://www.sendowl.com, get API keys
          5. **Patreon**: Free creator account at https://www.patreon.com

          2. Add each to GitHub Secrets:
             https://github.com/quantam101/profitenginev5/settings/secrets/actions

          3. Push to trigger deployment to all configured platforms

          ## Timeline

          - Now: Products deploy to configured FREE platforms
          - 5-15 min: Searchable on each platform
          - 1-3 hours: Fully synced globally

          No paid platforms. Zero cost. Pure revenue optimization.

          EOF
