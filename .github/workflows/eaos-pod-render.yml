name: EAOS — POD Render & Printify Push

# Renders all 8 Already Here LLC SKUs (4500x5400 300DPI PNG).
# Printify API blocks GitHub Actions runner IPs (Cloudflare error 1010),
# so artwork is uploaded to the OCI runtime (/pod/push) which has a real
# static IP. Products are auto-published to the Etsy-connected shop.

on:
  schedule:
    - cron: '0 8 * * 1'
  repository_dispatch:
    types:
      - eaos-pod-render
  workflow_dispatch:
    inputs:
      sku:
        description: 'Specific SKU to render (e.g. AHL-001) — blank = all 8'
        required: false
        default: ''
      push_to_printify:
        description: 'Push rendered artwork to Printify?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      strict_printify:
        description: 'Fail workflow if Printify push or verification fails?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  render:
    name: Render POD artwork + Printify push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PROFITENGINE_WEBHOOK_TOKEN: ${{ secrets.PROFITENGINE_WEBHOOK_TOKEN }}
      RUNTIME_BASE: ${{ secrets.RUNTIME_API_URL || 'https://api.profitengine.alreadyherellc.com' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pillow
        run: pip install pillow

      - name: Show workflow version
        run: |
          echo "Workflow commit: $GITHUB_SHA"
          git --no-pager log -1 --oneline

      - name: Validate Printify shop via OCI runtime (/pod/status)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
        run: |
          set +e
          HTTP=$(curl -s -o printify_status_before.json -w "%{http_code}" --max-time 120 \
            -X GET "${RUNTIME_BASE}/pod/status" \
            -H "Authorization: Bearer ${PROFITENGINE_WEBHOOK_TOKEN}")
          echo "HTTP $HTTP"; cat printify_status_before.json || true
          OK=$(python3 -c "import json; print(json.load(open('printify_status_before.json')).get('ok',False))" 2>/dev/null || echo "False")
          if [[ ! "$HTTP" =~ ^2 ]] || [[ "$OK" != "True" ]]; then
            if [ "$STRICT_PRINTIFY" = "true" ]; then
              echo "::error::Printify shop validation failed."; exit 1
            fi
            echo "::warning::Printify shop validation failed; continuing."
          fi

      - name: Render SKUs
        env:
          EAOS_POD_ROOT: ./datacenter/pod_factory
          EAOS_POD_DB: ./datacenter/pod_cache.db
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
          PYTHONUTF8: "1"
        run: python3 scripts/render_pod_catalog.py

      - name: Push artwork to OCI runtime (/pod/push → Printify API, real IP)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
        run: |
          set +e
          RENDER_DIR="./datacenter/pod_factory/render_cache"
          FORM_ARGS=()
          if [ -d "$RENDER_DIR" ] && ls "$RENDER_DIR"/*.png >/dev/null 2>&1; then
            for f in "$RENDER_DIR"/*.png; do
              FORM_ARGS+=(-F "files=@${f};type=image/png")
            done
            echo "Uploading ${#FORM_ARGS[@]} PNG(s) via OCI runtime..."
          fi
          HTTP=$(curl -s -o printify_push_result.json -w "%{http_code}" --max-time 900 \
            -X POST "${RUNTIME_BASE}/pod/push?target_sku=${TARGET_SKU}" \
            -H "Authorization: Bearer ${PROFITENGINE_WEBHOOK_TOKEN}" \
            "${FORM_ARGS[@]}")
          echo "HTTP $HTTP"
          python3 -c "import json; d=json.load(open('printify_push_result.json')); print(d.get('output','')[-3000:])" 2>/dev/null || cat printify_push_result.json
          OK=$(python3 -c "import json; print(json.load(open('printify_push_result.json')).get('ok',False))" 2>/dev/null || echo "False")
          if [[ ! "$HTTP" =~ ^2 ]] || [[ "$OK" != "True" ]]; then
            if [ "$STRICT_PRINTIFY" = "true" ]; then
              echo "::error::Printify push failed."; exit 1
            fi
            echo "::warning::Printify push failed — artwork saved as artifact."
          fi

      - name: Verify products after push (/pod/status)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
        run: |
          set +e
          curl -s -o printify_status_after.json --max-time 120 \
            -X GET "${RUNTIME_BASE}/pod/status" \
            -H "Authorization: Bearer ${PROFITENGINE_WEBHOOK_TOKEN}" || true
          TOTAL=$(python3 -c "import json; d=json.load(open('printify_status_after.json')); print(d.get('products',{}).get('total',0))" 2>/dev/null || echo "?")
          echo "Products in Printify shop: $TOTAL"
          echo "::notice::Printify shop has $TOTAL products after push"

      - name: Upload rendered artwork
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pod-artwork-${{ github.run_id }}
          path: datacenter/pod_factory/render_cache/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### EAOS POD Render & Printify Push" >> $GITHUB_STEP_SUMMARY
          echo "Ran at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Target SKU: ${{ inputs.sku || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Printify dashboard:** https://printify.com/app/store/products" >> $GITHUB_STEP_SUMMARY
          echo "**Etsy shop:** https://www.etsy.com/shop/AlreadyHereLLC" >> $GITHUB_STEP_SUMMARY
          for f in printify_status_before.json printify_status_after.json; do
            if [ -f "$f" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "#### $f" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$f" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done
