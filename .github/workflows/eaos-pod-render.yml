name: EAOS — POD Render & Printify Push

# Renders all 8 Already Here LLC SKUs (4500x5400 300DPI PNG).
# Printify push is supported, but external Printify failures are non-fatal
# unless strict_printify=true is selected on manual dispatch.
#
# Printify validation/push runs on the OCI host via the runtime API over
# HTTPS (Caddy) — never via SSH. The host has a real IP not blocked by
# Printify's Cloudflare (error 1010 for GH Actions runner IPs), and keeping
# CI/CD off port 22 avoids the automated SSH-probe-detection ban that also
# catches GitHub Actions runner IP ranges.

on:
  schedule:
    - cron: '0 8 * * 1'
  repository_dispatch:
    types:
      - eaos-pod-render
  workflow_dispatch:
    inputs:
      sku:
        description: 'Specific SKU to render (e.g. AHL-001) — blank = all 8'
        required: false
        default: ''
      push_to_printify:
        description: 'Push rendered artwork to Printify?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      strict_printify:
        description: 'Fail workflow if Printify push or verification fails?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  render:
    name: Render POD artwork + optional Printify push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PROFITENGINE_WEBHOOK_TOKEN: ${{ secrets.PROFITENGINE_WEBHOOK_TOKEN }}
      RUNTIME_BASE: ${{ secrets.RUNTIME_API_URL || 'https://profitengine-runtime.onrender.com' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pillow
        run: pip install pillow

      - name: Show workflow version
        run: |
          echo "Workflow commit: $GITHUB_SHA"
          git --no-pager log -1 --oneline

      - name: Validate Printify shop connection (via runtime API)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
        run: |
          set +e
          HTTP_CODE=$(curl -s -o printify_status_before.json -w "%{http_code}" --max-time 150 \
            -X GET "${RUNTIME_BASE}/pod/status" \
            -H "Authorization: Bearer ${PROFITENGINE_WEBHOOK_TOKEN}")
          echo "HTTP $HTTP_CODE"
          cat printify_status_before.json || true
          OK=$(python3 -c "import json; print(json.load(open('printify_status_before.json')).get('ok', False))" 2>/dev/null || echo "False")
          if [[ ! "$HTTP_CODE" =~ ^2 ]] || [[ "$OK" != "True" ]]; then
            if [ "$STRICT_PRINTIFY" = "true" ]; then
              echo "::error::Printify shop validation failed under strict mode."
              exit 1
            fi
            echo "::warning::Printify shop validation failed; continuing."
          fi

      - name: Render SKUs
        env:
          EAOS_POD_ROOT: ./datacenter/pod_factory
          EAOS_POD_DB: ./datacenter/pod_cache.db
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
          PYTHONUTF8: "1"
        run: python3 scripts/render_pod_catalog.py

      - name: Push to Printify via runtime API (bypasses Cloudflare GH-Actions block)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
        run: |
          set +e
          RENDER_DIR="./datacenter/pod_factory/render_cache"
          FORM_ARGS=()
          if [ -d "$RENDER_DIR" ] && ls "$RENDER_DIR"/*.png >/dev/null 2>&1; then
            for f in "$RENDER_DIR"/*.png; do
              FORM_ARGS+=(-F "files=@${f};type=image/png")
            done
            echo "Uploading ${#FORM_ARGS[@]} PNG(s) to runtime for Printify push..."
          else
            echo "No rendered PNGs found; calling push with no upload."
          fi

          HTTP_CODE=$(curl -s -o printify_push_result.json -w "%{http_code}" --max-time 900 \
            -X POST "${RUNTIME_BASE}/pod/push?target_sku=${TARGET_SKU}" \
            -H "Authorization: Bearer ${PROFITENGINE_WEBHOOK_TOKEN}" \
            "${FORM_ARGS[@]}")
          echo "HTTP $HTTP_CODE"
          python3 -c "import json; d=json.load(open('printify_push_result.json')); print(d.get('output','')[-3000:])" 2>/dev/null || cat printify_push_result.json
          OK=$(python3 -c "import json; print(json.load(open('printify_push_result.json')).get('ok', False))" 2>/dev/null || echo "False")
          if [[ ! "$HTTP_CODE" =~ ^2 ]] || [[ "$OK" != "True" ]]; then
            if [ "$STRICT_PRINTIFY" = "true" ]; then
              echo "::error::Printify push failed under strict mode."
              exit 1
            fi
            echo "::warning::Printify push failed; rendered artwork remains available as a build artifact."
          fi

      - name: Verify Printify products after push (via runtime API)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
        run: |
          set +e
          HTTP_CODE=$(curl -s -o printify_status_after.json -w "%{http_code}" --max-time 150 \
            -X GET "${RUNTIME_BASE}/pod/status" \
            -H "Authorization: Bearer ${PROFITENGINE_WEBHOOK_TOKEN}")
          echo "HTTP $HTTP_CODE"
          cat printify_status_after.json || true
          OK=$(python3 -c "import json; print(json.load(open('printify_status_after.json')).get('ok', False))" 2>/dev/null || echo "False")
          if [[ ! "$HTTP_CODE" =~ ^2 ]] || [[ "$OK" != "True" ]]; then
            if [ "$STRICT_PRINTIFY" = "true" ]; then
              echo "::error::Printify post-push verification failed under strict mode."
              exit 1
            fi
            echo "::warning::Printify post-push verification failed; continuing."
          fi

      - name: Upload rendered artwork
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pod-artwork-${{ github.run_id }}
          path: datacenter/pod_factory/render_cache/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### EAOS POD Render" >> $GITHUB_STEP_SUMMARY
          echo "Ran at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Strict Printify: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "Printify dashboard: https://printify.com/app/store/products" >> $GITHUB_STEP_SUMMARY
          echo "Etsy shop: https://www.etsy.com/shop/AlreadyHereLLC" >> $GITHUB_STEP_SUMMARY
          for f in printify_status_before.json printify_status_after.json printify_push_result.json; do
            if [ -f "$f" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "#### $f" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$f" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done
