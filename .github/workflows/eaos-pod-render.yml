name: EAOS — POD Render & Printify Push

# Renders all 8 Already Here LLC SKUs (4500x5400 300DPI PNG) and pushes
# live products to Printify. Runs weekly on Monday and on manual dispatch.

on:
  schedule:
    - cron: '0 8 * * 1'
  repository_dispatch:
    types:
      - eaos-pod-render
  workflow_dispatch:
    inputs:
      sku:
        description: 'Specific SKU to render (e.g. AHL-001) — blank = all 8'
        required: false
        default: ''
      push_to_printify:
        description: 'Push rendered artwork to Printify?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  render:
    name: Render POD artwork + push to Printify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pillow
        run: pip install pillow

      - name: Validate Printify shop connection
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
        run: |
          python3 scripts/printify_shop_status.py | tee printify_status_before.json

      - name: Render SKUs
        env:
          EAOS_POD_ROOT: ./datacenter/pod_factory
          EAOS_POD_DB: ./datacenter/pod_cache.db
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
          PYTHONUTF8: "1"
        run: python3 scripts/render_pod_catalog.py

      - name: Push to Printify
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          EAOS_POD_ROOT: ./datacenter/pod_factory
          EAOS_POD_DB: ./datacenter/pod_cache.db
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
          PYTHONUTF8: "1"
        run: python3 scripts/push_printify_catalog.py

      - name: Verify Printify products after push
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
        run: |
          python3 scripts/printify_shop_status.py | tee printify_status_after.json

      - name: Upload rendered artwork
        uses: actions/upload-artifact@v5
        with:
          name: pod-artwork-${{ github.run_id }}
          path: datacenter/pod_factory/render_cache/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### EAOS POD Render" >> $GITHUB_STEP_SUMMARY
          echo "Ran at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Printify dashboard: https://printify.com/app/store/products" >> $GITHUB_STEP_SUMMARY
          echo "Etsy shop: https://www.etsy.com/shop/AlreadyHereLLC" >> $GITHUB_STEP_SUMMARY
          if [ -f printify_status_before.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Printify status before push" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat printify_status_before.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f printify_status_after.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Printify status after push" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat printify_status_after.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
