name: EAOS — POD Render & Printify Push

# Renders all 8 Already Here LLC SKUs (4500x5400 300DPI PNG).
# Printify push is supported, but external Printify failures are non-fatal
# unless strict_printify=true is selected on manual dispatch.

on:
  schedule:
    - cron: '0 8 * * 1'
  repository_dispatch:
    types:
      - eaos-pod-render
  workflow_dispatch:
    inputs:
      sku:
        description: 'Specific SKU to render (e.g. AHL-001) — blank = all 8'
        required: false
        default: ''
      push_to_printify:
        description: 'Push rendered artwork to Printify?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      strict_printify:
        description: 'Fail workflow if Printify push or verification fails?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  render:
    name: Render POD artwork + optional Printify push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pillow
        run: pip install pillow

      - name: Show workflow version
        run: |
          echo "Workflow commit: $GITHUB_SHA"
          git --no-pager log -1 --oneline

      - name: Validate Printify shop connection (via OCI server)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
        run: |
          # Run from OCI server to avoid Cloudflare block (error code 1010)
          set +e
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SERVER_SSH_KEY }}" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 129.146.167.73 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            opc@129.146.167.73 \
            "cd /home/opc/profitenginev5 && python3 scripts/printify_shop_status.py 2>&1" \
            | tee printify_status_before.json
          rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ "$STRICT_PRINTIFY" = "true" ]; then
              echo "::error::Printify shop validation failed under strict mode."
              exit "$rc"
            fi
            echo "::warning::Printify shop validation failed; continuing."
          fi

      - name: Render SKUs
        env:
          EAOS_POD_ROOT: ./datacenter/pod_factory
          EAOS_POD_DB: ./datacenter/pod_cache.db
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
          PYTHONUTF8: "1"
        run: python3 scripts/render_pod_catalog.py

      - name: Set up SSH for OCI server push
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SERVER_SSH_KEY }}" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 129.146.167.73 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Push to Printify via OCI server (bypasses Cloudflare GH-Actions block)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
        run: |
          # Copy artwork to OCI server, then run the push from there
          # (Printify's Cloudflare blocks GitHub Actions IPs but not the OCI server)
          set +e
          RENDER_DIR="./datacenter/pod_factory/render_cache"
          if [ -d "$RENDER_DIR" ] && ls "$RENDER_DIR"/*.png 2>/dev/null | head -1 > /dev/null; then
            echo "Uploading rendered artwork to OCI server..."
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
              opc@129.146.167.73 "mkdir -p /tmp/pod_render"
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "$RENDER_DIR"/*.png opc@129.146.167.73:/tmp/pod_render/ 2>/dev/null || true
          fi

          # Run the Printify push script on the server (has real IP, not blocked)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            opc@129.146.167.73 \
            "cd /home/opc/profitenginev5 && \
             if [ -d /tmp/pod_render ] && ls /tmp/pod_render/*.png 2>/dev/null | head -1 > /dev/null; then \
               mkdir -p datacenter/pod_factory/render_cache && \
               cp /tmp/pod_render/*.png datacenter/pod_factory/render_cache/ 2>/dev/null || true; \
             fi && \
             EAOS_POD_ROOT=./datacenter/pod_factory \
             EAOS_POD_DB=./datacenter/pod_cache.db \
             TARGET_SKU='${TARGET_SKU}' \
             python3 scripts/push_printify_catalog.py 2>&1 | tail -30"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ "$STRICT_PRINTIFY" = "true" ]; then
              echo "::error::Printify push failed under strict mode."
              exit "$rc"
            fi
            echo "::warning::Printify push failed; rendered artwork remains available as a build artifact."
          fi

      - name: Verify Printify products after push (via OCI server)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
        run: |
          # Verify via OCI server to avoid Cloudflare block
          set +e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            opc@129.146.167.73 \
            "cd /home/opc/profitenginev5 && python3 scripts/printify_shop_status.py 2>&1" \
            | tee printify_status_after.json
          rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ "$STRICT_PRINTIFY" = "true" ]; then
              echo "::error::Printify post-push verification failed under strict mode."
              exit "$rc"
            fi
            echo "::warning::Printify post-push verification failed; continuing."
          fi

      - name: Upload rendered artwork
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pod-artwork-${{ github.run_id }}
          path: datacenter/pod_factory/render_cache/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### EAOS POD Render" >> $GITHUB_STEP_SUMMARY
          echo "Ran at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Strict Printify: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "Printify dashboard: https://printify.com/app/store/products" >> $GITHUB_STEP_SUMMARY
          echo "Etsy shop: https://www.etsy.com/shop/AlreadyHereLLC" >> $GITHUB_STEP_SUMMARY
          if [ -f printify_status_before.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Printify status before push" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat printify_status_before.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f printify_status_after.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Printify status after push" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat printify_status_after.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
