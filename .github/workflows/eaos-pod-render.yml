name: EAOS — POD Render & Printify Push

# Renders all 8 Already Here LLC SKUs (4500x5400 300DPI PNG) and pushes
# them directly to Printify via the API (api.printify.com/v1 is NOT
# blocked by Cloudflare for GitHub Actions runners — only the storefront
# website is). Products are auto-published to the Etsy-connected shop.

on:
  schedule:
    - cron: '0 8 * * 1'
  repository_dispatch:
    types:
      - eaos-pod-render
  workflow_dispatch:
    inputs:
      sku:
        description: 'Specific SKU to render (e.g. AHL-001) — blank = all 8'
        required: false
        default: ''
      push_to_printify:
        description: 'Push rendered artwork to Printify?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      strict_printify:
        description: 'Fail workflow if Printify push or verification fails?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  render:
    name: Render POD artwork + Printify push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pillow httpx

      - name: Show workflow version
        run: |
          echo "Workflow commit: $GITHUB_SHA"
          git --no-pager log -1 --oneline

      - name: Validate Printify shop + token scopes (direct API check)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
          PRINTIFY_VERIFY_UPLOAD: "true"
          PYTHONUTF8: "1"
        run: |
          python3 scripts/printify_shop_status.py | tee printify_status_before.json || true
          EXIT=$?
          if [ $EXIT -ne 0 ] && [ "$STRICT_PRINTIFY" = "true" ]; then
            echo "::error::Printify shop validation failed under strict mode (exit $EXIT)."
            exit 1
          fi

      - name: Render SKUs
        env:
          EAOS_POD_ROOT: ./datacenter/pod_factory
          EAOS_POD_DB: ./datacenter/pod_cache.db
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
          PYTHONUTF8: "1"
        run: python3 scripts/render_pod_catalog.py

      - name: Push products to Printify (direct API — no OCI intermediary)
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          EAOS_POD_ROOT: ./datacenter/pod_factory
          TARGET_SKU: ${{ inputs.sku || github.event.client_payload.sku || '' }}
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
          PYTHONUTF8: "1"
        run: |
          python3 scripts/push_printify_catalog.py
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            if [ "$STRICT_PRINTIFY" = "true" ]; then
              echo "::error::Printify push failed under strict mode."
              exit 1
            fi
            echo "::warning::Printify push returned non-zero — see output above."
          fi

      - name: Verify Printify products after push
        if: ${{ (inputs.push_to_printify || github.event.client_payload.push_to_printify || 'true') != 'false' }}
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          STRICT_PRINTIFY: ${{ inputs.strict_printify || github.event.client_payload.strict_printify || 'false' }}
          PYTHONUTF8: "1"
        run: |
          python3 scripts/printify_shop_status.py | tee printify_status_after.json || true
          TOTAL=$(python3 -c "import json; d=json.load(open('printify_status_after.json')); print(d.get('products',{}).get('total',0))" 2>/dev/null || echo "?")
          echo "Products in Printify shop after push: $TOTAL"
          echo "::notice::Printify shop now has $TOTAL products"

      - name: Upload rendered artwork
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pod-artwork-${{ github.run_id }}
          path: datacenter/pod_factory/render_cache/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### EAOS POD Render & Printify Push" >> $GITHUB_STEP_SUMMARY
          echo "Ran at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Target SKU: ${{ inputs.sku || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Printify dashboard:** https://printify.com/app/store/products" >> $GITHUB_STEP_SUMMARY
          echo "**Etsy shop:** https://www.etsy.com/shop/AlreadyHereLLC" >> $GITHUB_STEP_SUMMARY
          for f in printify_status_before.json printify_status_after.json; do
            if [ -f "$f" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "#### $f" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$f" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done
