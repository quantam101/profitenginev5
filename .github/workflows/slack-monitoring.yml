                  sys.exit(1)

              client = AsyncIOMotorClient(mongo_url)
              db = client.get_database()
              service = SlackMonitoringService(db)

              briefing = await service.weekly_summary()
              success = await service.send_briefing(briefing)

              await service.close()
              client.close()

              if success:
                  print("✓ Weekly summary posted successfully")
                  sys.exit(0)
