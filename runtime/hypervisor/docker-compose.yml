services:
  gateway_router:
    image: ghcr.io/berriai/litellm:v1.40.14
    container_name: enterprise_gateway_router
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_CONFIG=/app/config.yaml
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - REDIS_HOST=state_cache
      - REDIS_PORT=6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    # mem_limit / cpus work in compose v2 without Swarm mode
    mem_limit: 2g
    cpus: "1.5"
    restart: unless-stopped
    depends_on:
      state_cache:
        condition: service_healthy
    networks:
      - enterprise_backbone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  state_cache:
    image: redis:7.2-alpine
    container_name: enterprise_state_cache
    command: redis-server --appendonly yes --save 300 1 --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - enterprise_backbone
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vector_memory:
    image: qdrant/qdrant:v1.9.0
    container_name: enterprise_vector_memory
    ports:
      - "127.0.0.1:6333:6333"  # bind localhost only — no external exposure
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=2
      - QDRANT__SERVICE__HTTP_PORT=6333
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - enterprise_backbone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  qdrant_data:

networks:
  enterprise_backbone:
    driver: bridge
