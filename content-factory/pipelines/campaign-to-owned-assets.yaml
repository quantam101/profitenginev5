pipeline:
  id: campaign-to-owned-assets
  name: Campaign To Owned Assets
  version: 1.1.0
  enabled: true
  mode: local_first_zero_spend_with_supervised_autopublish_transition

inputs:
  campaign_payload_root: campaigns
  supported_campaign_types:
    - referral_financial
    - affiliate
    - productized_service
    - educational
    - local_service

required_outputs:
  - book/chapter-01.md
  - blog/article.md
  - video/short-form-45s.md
  - social/platform-variants.md
  - email/newsletter.md
  - course/micro-class-outline.md
  - manifest.json

agents:
  primary: content-factory
  optional_enhancer: hf-asset-enhancer
  verifier: lifelong-catch-correct
  cost_guard: free-tier-cost-guard

execution:
  default_generator: scripts/content_factory_run.py
  output_root: generated-content
  write_files_first: true
  current_publish_mode: generate_queue_review
  publish_after_generation_before_2026_06_23: false
  publish_after_generation_starting_2026_06_23: supervised_allowlisted_channels_only
  approval_required_before_publish_until: 2026-06-22
  supervised_autopublish_starts: 2026-06-23
  approval_required_before_external_inference_until: 2026-06-22
  autopublish_policy: ops/autopublish/policy.yaml

controls:
  no_paid_api_calls_by_default: true
  no_unapproved_external_calls_during_warmup: true
  no_public_post_before_2026_06_23: true
  no_bulk_cold_outreach: true
  no_scraped_contact_outreach: true
  require_disclosure_for_referral_financial: true
  no_guaranteed_outcome_claims: true
  no_personalized_financial_advice: true
  audit_publication_events: true
  rollback_required: true

optional_huggingface:
  connector: huggingface_runtime
  enabled_by_default: true
  current_mode: governed_warmup
  token_env_var: HF_TOKEN
  allowed_now:
    - image_prompt_expansion_as_file_output
    - voiceover_script_variants_as_file_output
    - short_video_concept_variants_as_file_output
    - embeddings_for_content_reuse_after_approval
    - spaces_demo_plan_as_file_output
  allowed_after_2026_06_23:
    - supervised_external_inference_when_token_present
    - supervised_asset_enhancement
    - supervised_spaces_demo_after_approval
  forbidden_without_approval:
    - paid_usage
    - dataset_upload
    - model_upload
    - public_space_deploy
