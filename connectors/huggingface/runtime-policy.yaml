connector:
  id: huggingface-runtime
  name: Hugging Face Runtime Adapter
  version: 0.3.0
  default_enabled: true
  execution_mode: active_external_adapter

lifecycle:
  activated: "2026-06-10"
  current_phase: active
  autopublish_policy: ops/autopublish/policy.yaml

security:
  token_env_var: HF_TOKEN
  commit_tokens_to_repo: false
  allow_public_posting: true
  allow_paid_inference_by_default: false
  approval_required_for_paid_usage: true
  approval_required_for_model_uploads: false
  approval_required_for_dataset_uploads: false
  approval_required_for_space_deploys: false

allowed_uses:
  - external_inference_when_token_present
  - owned_channel_publishing
  - blog_platform_publishing
  - social_asset_generation
  - short_form_video_asset_generation
  - spaces_demo_deploy
  - image_generation_for_pod_artwork
  - embedding_generation
  - audio_generation
  - free_inference_api
  - serverless_inference_api

# Priority uses for immediate revenue:
# 1. FLUX/SDXL image generation — replace Pillow text renders with real AI art for POD
# 2. Serverless Inference API (Meta-Llama-3, Mistral) — free content generation backup
# 3. Spaces — host ProfitEngine demo publicly for lead capture + social proof
# 4. Embeddings — better vector cache for sovereign cycle

forbidden_uses:
  - hardcoded_api_keys
  - unapproved_paid_inference
  - cold_bulk_messaging
  - scraped_contact_outreach
  - platform_rule_evasion
  - storing_private_user_data_in_public_datasets

fallback:
  enabled: true
  mode: deterministic_local_content_factory
  script: scripts/content_factory_run.py

outputs:
  generated_content_root: generated-content

audit:
  required: true
  log_publication_events: true
  log_external_inference_events: true
  log_rollbacks: true
