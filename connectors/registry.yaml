connectors:
  # ── Local / always-free ──────────────────────────────────────────────────
  local_files:
    state: free_core
    enabled: true
    permissions: [read_workspace, write_drafts]

  ollama_local:
    state: free_core
    enabled: true
    permissions: [local_inference]

  playwright_local:
    state: free_core
    enabled: true
    permissions: [browser_research]

  n8n_local:
    state: free_core
    enabled: true
    permissions: [run_local_workflow]

  # ── Free external inference ──────────────────────────────────────────────
  tokenforge_api:
    state: free_external
    enabled: true
    permissions: [remote_inference, proxy_llm]

  groq_api:
    state: free_external
    enabled: true
    permissions: [remote_inference]

  gemini_api:
    state: free_external
    enabled: true
    permissions: [remote_inference]

  # ── Free external publishing ─────────────────────────────────────────────
  devto_api:
    state: free_external
    enabled: true
    permissions: [create_article, read_articles]

  hashnode_api:
    state: free_external
    enabled: true
    permissions: [create_article, read_articles]

  medium_api:
    state: free_external
    enabled: true
    permissions: [create_article]

  github_api:
    state: free_external
    enabled: true
    permissions: [read_repo, write_file]

  gmail_smtp:
    state: free_external
    enabled: true
    permissions: [send_email]

  # ── Read-only external (free, no write) ──────────────────────────────────
  github_read:
    state: free_external
    enabled: false
    permissions: [read_repo]

  # ── Requires explicit approval or governed warmup ─────────────────────────
  github_write:
    state: forbidden_without_approval
    enabled: false
    permissions: [create_branch, open_pr]

  huggingface_runtime:
    state: active
    enabled: true
    permissions:
      - inference
      - embedding
      - image_generation
      - audio_generation
      - space_deploy
      - serverless_inference_api
    policy_file: connectors/huggingface/runtime-policy.yaml
    autopublish_policy_file: ops/autopublish/policy.yaml
    token_env_var: HF_TOKEN
    fallback: deterministic_local_content_factory
    activated: "2026-06-10"
    current_mode: active

  stripe:
    state: forbidden_without_approval
    enabled: false
    permissions: []

  # ── Optional paid (disabled) ──────────────────────────────────────────────
  openai_api:
    state: optional_paid_disabled
    enabled: false
    permissions: []

  anthropic_api:
    state: optional_paid_disabled
    enabled: false
    permissions: []

  perplexity_api:
    state: optional_paid_disabled
    enabled: false
    permissions: []
